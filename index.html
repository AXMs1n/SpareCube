function renderHistory(){
  const filtered = history.filter(h => ((h.partName||"")+(h.machine||"")+(h.by||"")).toLowerCase().includes(search.toLowerCase()));
  if (filtered.length === 0) {
    return `
      <div class="search">
        <span class="icon">🔍</span>
        <input id="searchInput" placeholder="ค้นหาตามอะไหล่ เครื่อง หรือผู้เบิก" value="${esc(search)}">
      </div>
      <div class="empty">ไม่พบประวัติ</div>
    `;
  }

  // group by the zone(s) of the related part; entries whose part has no zone (or part was deleted) go into "unassigned".
  // a part marked "all zones" appears under every zone currently in use; a part with several zones appears in each of them.
  const allKnownZones = [...new Set(parts.flatMap(p => getPartZones(p)).filter(z => z && z !== "__all__"))];
  const groups = new Map();
  filtered.forEach(h => {
    const part = parts.find(p => p.id === h.partId);
    const pz = getPartZones(part);
    let targetZones = pz.includes("__all__") ? allKnownZones : pz;
    if (!targetZones || targetZones.length === 0) targetZones = ["__unassigned__"];
    targetZones.forEach(key => {
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(h);
    });
  });
  const zoneKeys = [...groups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (groups.has("__unassigned__")) zoneKeys.push("__unassigned__");

  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input id="searchInput" placeholder="ค้นหาตามอะไหล่ เครื่อง หรือผู้เบิก" value="${esc(search)}">
    </div>
    ${zoneKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const groupItems = groups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ยังไม่ระบุโซน" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${groupItems.length})</span></div>
        <div class="card-list" style="margin-bottom:10px;">
          ${groupItems.map(histRow).join("")}
        </div>
      </div>`;
    }).join("")}
  `;
}

/* ======================================================
   Maintenance Cost tab — ดึงจาก Google Sheet ผ่าน Apps Script
   แล้วคำนวณ/จับคู่ฝั่งนี้ (client-side) เหมือนที่ตรวจทานไว้แล้ว
   ====================================================== */
let maintDebug = null; // ข้อมูลวินิจฉัย แสดงในหน้าเว็บเองเวลามีปัญหา ไม่ต้องเปิด DevTools

/* ---------------- ตรวจสอบ/อัปเดตสถานะอัตโนมัติ (reconcile) ---------------- */
let reconcileStatus = "idle"; // idle | loading | ready | applying | error
let reconcileResults = null;  // array ของรายการที่เสนอให้เปลี่ยน
let reconcileError = null;

async function runReconcilePreview(){
  reconcileStatus = "loading"; reconcileError = null;
  render();
  try {
    const resp = await fetch(MAINT_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "reconcilePreview" }),
    });
    const json = await resp.json();
    if (!json.success) throw new Error(json.error || "ตรวจสอบไม่สำเร็จ");
    reconcileResults = json.changes || [];
    reconcileStatus = "ready";
  } catch (err) {
    reconcileError = String(err.message || err);
    reconcileStatus = "error";
  }
  render();
}

async function applyReconcile(){
  const ok = await showConfirm({
    title: `ยืนยันอัปเดต ${reconcileResults.length} รายการ?`,
    message: "ระบบจะเขียนสถานะใหม่ลงในชีท Google Sheet จริงทันที การกระทำนี้ย้อนกลับเองไม่ได้ (แก้มือได้ภายหลังถ้าผิดพลาด)",
    confirmText: "ยืนยันอัปเดต",
    icon: "ti-refresh",
    danger: true,
  });
  if (!ok) return;

  reconcileStatus = "applying";
  render();
  try {
    const resp = await fetch(MAINT_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "reconcileApply" }),
    });
    const json = await resp.json();
    if (!json.success) throw new Error(json.error || "อัปเดตไม่สำเร็จ");
    showToast(`อัปเดตสถานะ ${json.changes.length} รายการสำเร็จ`);
    reconcileResults = null;
    reconcileStatus = "idle";
    await ensureMaintDataLoaded(true); // โหลดข้อมูลใหม่ให้ตรงกับที่เพิ่งแก้
  } catch (err) {
    reconcileError = String(err.message || err);
    reconcileStatus = "error";
    render();
  }
}
async function ensureMaintDataLoaded(force){
  if (maintStatus === "loading") return;
  if (maintStatus === "ready" && !force) return;
  maintStatus = "loading";
  if (view === "maintcost") render();
  try {
    // กันแคชทุกชั้น (browser / CDN / ตัวกลางใดๆ) ด้วยการแปะ query แบบสุ่มทุกครั้ง
    const bustUrl = MAINT_SCRIPT_URL + (MAINT_SCRIPT_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
    const resp = await fetch(bustUrl, { cache: "no-store" });
    const rawText = await resp.text();
    let json;
    try { json = JSON.parse(rawText); }
    catch { throw new Error("ไม่ใช่ JSON: " + rawText.slice(0,200)); }

    maintDebug = {
      url: bustUrl,
      httpStatus: resp.status,
      hasYearsAvailable: Array.isArray(json.yearsAvailable),
      yearsAvailableRaw: json.yearsAvailable,
      poMasterLen: Array.isArray(json.poMaster) ? json.poMaster.length : null,
      firstRowYear: Array.isArray(json.poMaster) && json.poMaster[0] ? json.poMaster[0].year : null,
      generatedAt: json.generatedAt,
      fetchedAt: new Date().toISOString(),
    };

    if (!json.success) throw new Error(json.error || "load failed");
    maintRaw = json;
    const years = (json.yearsAvailable && json.yearsAvailable.length)
      ? json.yearsAvailable
      : [...new Set((json.poMaster||[]).map(r=>r.year))].filter(y=>y!==undefined && y!==null).sort((a,b)=>b-a);
    if (!maintSelectedYear || !years.includes(maintSelectedYear)) {
      maintSelectedYear = years[0] || null; // ค่าเริ่มต้น = ปีล่าสุด
    }
    maintLoadedAt = new Date();
    maintStatus = "ready";
  } catch (err) {
    maintDebug = { ...(maintDebug||{}), error: String(err && err.message || err) };
    maintStatus = "error";
  }
  maintRefreshing = false;
  if (view === "maintcost") render();
}

function normPOStr(v){
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  if (!isNaN(n) && isFinite(n)) return String(Math.round(n));
  return String(v).trim();
}

function computeMaintAggregates(poMaster, costLedger){
  const MAIN_STATUSES = ["Complete","รอส่งมอบงาน","รอส่งอะไหล่","Partial","รอวางบิล"];
  const billedPOs = new Set(costLedger.map(c => normPOStr(c.po)).filter(Boolean));

  let totalValue = 0, completeValue = 0, completeCount = 0, pendingValue = 0, pendingCount = 0;
  const statusMap = {};
  const ownerMap = {};
  let completeNoEN = 0;
  const issueByOwner = {};

  poMaster.forEach(row => {
    const status = (row.status || "ไม่ระบุสถานะ").trim() || "ไม่ระบุสถานะ";
    const owner = (row.owner || "").trim();
    const val = Number(row.price) || 0; // ใช้คอลัมน์ "ราคา" เป็นมาตรฐานเดียวกันทุกปี (ไม่ใช้ VAT แล้ว เพราะไม่ใช่ทุกปีมีคอลัมน์นี้)
    const group = MAIN_STATUSES.includes(status) ? status : "อื่นๆ";

    totalValue += val;
    if (!statusMap[group]) statusMap[group] = { count:0, value:0 };
    statusMap[group].count++; statusMap[group].value += val;

    if (status === "Complete") {
      completeValue += val; completeCount++;
      if (row.enFilled === false) { // false = มีคอลัมน์ติดตามแต่ยังว่าง; null = ปีนี้ไม่มีข้อมูลติดตามเลย ไม่นับว่า "ขาด"
        completeNoEN++;
        if (owner) issueByOwner[owner] = (issueByOwner[owner]||0) + 1;
      }
    } else {
      pendingValue += val; pendingCount++;
    }

    if (owner) {
      if (!ownerMap[owner]) ownerMap[owner] = { total_count:0, total_value:0, complete_count:0, complete_value:0, pending_count:0, pending_value:0, pending_jobs:[] };
      const o = ownerMap[owner];
      o.total_count++; o.total_value += val;
      if (status === "Complete") { o.complete_count++; o.complete_value += val; }
      else { o.pending_count++; o.pending_value += val; o.pending_jobs.push({ name: row.item || "(ไม่มีชื่อรายการ)", po: row.po || "-", status, value: val }); }
    }
  });

  Object.values(ownerMap).forEach(o => o.pending_jobs.sort((a,b)=>b.value-a.value));
  const ownerBreakdown = Object.fromEntries(Object.entries(ownerMap).sort((a,b)=>b[1].total_value-a[1].total_value));

  const matchedRows = poMaster.filter(row => billedPOs.has(normPOStr(row.po)));
  const billedCount = new Set(matchedRows.map(r=>normPOStr(r.po))).size;

  const statusSummary = Object.entries(statusMap).map(([label,d]) => ({ label, ...d }));
  const issueList = Object.entries(issueByOwner).map(([label,count])=>({label,count})).sort((a,b)=>b.count-a.count);

  const hasENTracking = poMaster.some(r => r.enFilled !== null);

  // ค่าซ่อมวิศวกรรม: รวมยอดตามเลข PO (อาจมีหลายรายการย่อยต่อ PO เดียว) เฉพาะ PO ที่อยู่ในปีที่เลือก
  const poSet = new Set(poMaster.map(r => normPOStr(r.po)).filter(Boolean));
  const costByPO = {};
  costLedger.forEach(c => {
    const po = normPOStr(c.po);
    if (!po || !poSet.has(po)) return;
    if (!costByPO[po]) costByPO[po] = { po, items: new Set(), amount: 0 };
    costByPO[po].amount += Number(c.amount) || 0;
    if (c.description) costByPO[po].items.add(c.description);
  });
  const costLedgerSummary = Object.values(costByPO)
    .map(d => ({ po: d.po, item: [...d.items].join(" / ") || "-", amount: d.amount }))
    .sort((a,b) => b.amount - a.amount);
  const costLedgerTotal = costLedgerSummary.reduce((s,d)=>s+d.amount, 0);

  return {
    kpi: { totalValue, totalCount: poMaster.length, completeValue, completeCount, pendingValue, pendingCount, completeNoEN, billedCount },
    statusSummary, ownerBreakdown, issueList, hasENTracking, costLedgerSummary, costLedgerTotal,
  };
}

  }
  return "";
}

const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function parsePostMonth(s){ // รับ "17.08.2026" หรือ "2026-08-17" -> "2026-08" (ไม่ตรงรูปแบบ -> null)
  if (!s) return null;
  s = String(s).trim();
  let y, mo, m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) { y = +m[1]; mo = +m[2]; }
  else if ((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/))) { y = +m[3]; mo = +m[2]; }
  else return null;
  if (y > 2400) y -= 543;
  if (mo < 1 || mo > 12) return null;
  return y + "-" + String(mo).padStart(2, "0");
}
function monthLabelTh(key){ const [y, mo] = key.split("-"); return TH_MONTHS[+mo - 1] + " " + (+y + 543); }

function fmtMoneyMc(n){
  return (Number(n)||0).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2}) + " บาท"; // แสดงค่าจริง ไม่ปัดเป็นล้าน
}

let mcStatusChartInstance = null, mcValueChartInstance = null, mcCostChartInstance = null;
function bindMaintCostCharts(){
  if (!maintAggView) return;
  if (typeof Chart === "undefined") {
    document.querySelectorAll(".mc-chart-box").forEach(box => {
      box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mutedFaint);font-size:11.5px;">โหลดไลบรารีกราฟไม่สำเร็จ ลองรีเฟรชหน้าเว็บ</div>`;
    });
    return;
  }

  const statusCanvas = document.getElementById("mcStatusChart");
  if (statusCanvas) {
    if (mcStatusChartInstance) { mcStatusChartInstance.destroy(); mcStatusChartInstance = null; }
    const colors = { "Complete":"#2DD4BF","รอส่งมอบงาน":"#F5A623","รอส่งอะไหล่":"#F0473E","Partial":"#3B82F6","รอวางบิล":"#A78BFA","อื่นๆ":"#5B6068" };
    const data = maintAggView.statusSummary;
    mcStatusChartInstance = new Chart(statusCanvas, {
      type: 'doughnut',
      data: { labels: data.map(s=>s.label), datasets: [{ data: data.map(s=>s.count), backgroundColor: data.map(s=>colors[s.label]||"#5B6068"), borderColor:"#1B1E23", borderWidth:3 }] },
      options: { plugins:{ legend:{ position:'right', labels:{ boxWidth:10, font:{size:10.5}, color:"#878D97" } } }, cutout:'62%', maintainAspectRatio:false }
    });
  }

  const valueCanvas = document.getElementById("mcValueChart");
  if (valueCanvas) {
    if (mcValueChartInstance) { mcValueChartInstance.destroy(); mcValueChartInstance = null; }
    const { completeValue, pendingValue } = maintAggView.kpi;
    mcValueChartInstance = new Chart(valueCanvas, {
      type: 'bar',
      data: {
        labels: ["วางบิลแล้ว", "ค้างดำเนินการ"],
        datasets: [{ data: [completeValue, pendingValue], backgroundColor: ["#2DD4BF", "#F5A623"], borderRadius: 6, maxBarThickness: 46 }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display:false }, tooltip:{ callbacks:{ label: ctx => fmtMoneyMc(ctx.raw) } } },
        scales: { x: { grid:{color:"#2C3139"}, ticks:{ color:"#878D97", callback:v=>(v/1e6).toFixed(1)+"M" } }, y: { grid:{display:false}, ticks:{ color:"#ECEDEF" } } },
        maintainAspectRatio: false
      }
    });
  }

  const costCanvas = document.getElementById("mcCostChart");
  if (costCanvas) {
    if (mcCostChartInstance) { mcCostChartInstance.destroy(); mcCostChartInstance = null; }
    const top = maintAggView.costLedgerSummary.slice(0, 8);
    if (top.length) {
      mcCostChartInstance = new Chart(costCanvas, {
        type: 'bar',
        data: {
          labels: top.map(d => d.po),
          datasets: [{ data: top.map(d => d.amount), backgroundColor: "#2DD4BF", borderRadius: 6, maxBarThickness: 22 }]
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display:false }, tooltip:{ callbacks:{
            title: ctx => "PO " + ctx[0].label,
            label: ctx => [fmtMoneyMc(ctx.raw), top[ctx.dataIndex].item].join(" — "),
          } } },
          scales: { x: { grid:{color:"#2C3139"}, ticks:{ color:"#878D97", callback:v=>(v/1e3).toFixed(0)+"K" } }, y: { grid:{display:false}, ticks:{ color:"#ECEDEF", font:{size:10} } } },
          maintainAspectRatio: false
        }
      });
    } else {
      costCanvas.closest(".mc-chart-box").innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mutedFaint);font-size:11.5px;">ไม่พบ PO ที่ตรงกันในไฟล์ค่าใช้จ่ายสำหรับปีนี้</div>`;

}

function prStatusBadgeHtml(pr){
  const status = pr.status || "pending";
  if (status === "approved") {
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:#134E4A;color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;"><i class="ti ti-circle-check" aria-hidden="true"></i> อนุมัติแล้ว</span>`;
  }
  if (status === "rejected") {
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--dangerDim);color:var(--danger);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;"><i class="ti ti-circle-x" aria-hidden="true"></i> ถูกปฏิเสธ</span>`;
  }
  return `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--warnDim);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;"><i class="ti ti-clock" aria-hidden="true"></i> รอตรวจสอบ</span>`;
}

  `;
}

function renderPRList(){
  const q = prSearch.toLowerCase();
  const filtered = prRequests.filter(pr =>
    ((pr.prNumber||"")+(pr.jobName||"")+(pr.department||"")+(pr.submittedBy||"")+(pr.vendor||"")).toLowerCase().includes(q)
  );
  if (filtered.length === 0) {
    return `
      <div class="search">
        <span class="icon">🔍</span>
        <input id="prSearchInput" placeholder="ค้นหาเลขที่ PR ชื่องาน หน่วยงาน หรือผู้กรอก" value="${esc(prSearch)}">
      </div>
      <div class="empty">ยังไม่มีใบ PR</div>
    `;
  }

  // group by the submitting user, so each person's items stay separated instead of mixed together
  const groups = new Map();
  filtered.forEach(pr => {
    const key = pr.submittedBy && pr.submittedBy.trim() ? pr.submittedBy.trim() : "__unassigned__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(pr);
  });
  const userKeys = [...groups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (groups.has("__unassigned__")) userKeys.push("__unassigned__");

  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input id="prSearchInput" placeholder="ค้นหาเลขที่ PR ชื่องาน หน่วยงาน หรือผู้กรอก" value="${esc(prSearch)}">
    </div>
    ${userKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const items = groups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ไม่ระบุผู้กรอก" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${items.length})</span></div>
        ${items.map(prCardHtml).join("")}
      </div>`;
    }).join("")}
  `;
}

/* ---------------- persistent app-wide background animation ---------------- */
function initBgParticles(){
  const canvas = document.getElementById("bgParticles");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function spawnNodes(){
    const isSmall = W < 480;
    const count = isSmall ? 30 : 60;
    const arr = [];
    for (let i = 0; i < count; i++){
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        size: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.007,
      });
    }
    return arr;
  }
  let nodes = spawnNodes();
  window.addEventListener("resize", () => { nodes = spawnNodes(); });

  const mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener("mouseleave", () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener("touchmove", (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true;
  }, { passive: true });

  const LINK_DIST = 135;
  const MOUSE_DIST = 150;
  // colors oscillate slowly and continuously between teal and purple ("หลบไปมา")
  const TEAL = [45, 212, 191];
  const PURPLE = [124, 58, 237];
  const LIGHT_TEAL = [110, 231, 216];
  const LIGHT_PURPLE = [192, 160, 250];

  function mixColor(c1, c2, t){
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t),
    ];
  }

  function frame(t){
    ctx.clearRect(0, 0, W, H);

    const cyclePos = (Math.sin(t * 0.00012) + 1) / 2; // 0..1, ~8.7s half-cycle
    const linkColor = mixColor(TEAL, PURPLE, cyclePos);
    const nodeColor = mixColor(LIGHT_TEAL, LIGHT_PURPLE, cyclePos);
    const mouseLinkColor = mixColor(LIGHT_TEAL, LIGHT_PURPLE, cyclePos);

    for (const n of nodes){
      n.x += n.vx; n.y += n.vy;
      n.rot += n.rotSpeed;
      if (n.x < -10) n.x = W + 10; else if (n.x > W + 10) n.x = -10;
      if (n.y < -10) n.y = H + 10; else if (n.y > H + 10) n.y = -10;

      if (mouse.active){
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < MOUSE_DIST && dist > 0.01){
          const f = (1 - dist / MOUSE_DIST) * 0.55;
          n.x += (dx / dist) * f;
          n.y += (dy / dist) * f;
        }
      }
    }

    for (let i = 0; i < nodes.length; i++){
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++){
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < LINK_DIST){
          const op = (1 - dist / LINK_DIST) * 0.16;
          ctx.strokeStyle = `rgba(${linkColor[0]},${linkColor[1]},${linkColor[2]},${op})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
      if (mouse.active){
        const dx = a.x - mouse.x, dy = a.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < MOUSE_DIST){
          const op = (1 - dist / MOUSE_DIST) * 0.3;
          ctx.strokeStyle = `rgba(${mouseLinkColor[0]},${mouseLinkColor[1]},${mouseLinkColor[2]},${op})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }
    }

    for (const n of nodes){
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(n.rot);
      ctx.fillStyle = `rgba(${nodeColor[0]},${nodeColor[1]},${nodeColor[2]},0.45)`;
      ctx.fillRect(-n.size / 2, -n.size / 2, n.size, n.size);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ======================================================
   🔐 Authentication flow — Google Sign-in
   ====================================================== */
function friendlyAuthError(e){
  const c = (e && e.code) ? e.code : "";
  if (c === "auth/popup-blocked")            return "Your browser blocked the sign-in popup. Allow popups for this site and try again.";
  if (c === "auth/popup-closed-by-user")     return "The sign-in window was closed before finishing. Please try again.";
  if (c === "auth/cancelled-popup-request")  return "A sign-in window is already open.";
  if (c === "auth/operation-not-allowed")    return "This sign-in method is not enabled yet in the Firebase Console (Authentication → Sign-in method).";
  if (c === "auth/unauthorized-domain") {
    if (location.protocol === "file:" || !location.hostname)
      return "This page is open from a local file (file://). Google Login only works on the live website — open https://axms1n.github.io/SpareCube/ instead.";
    return "This domain is not authorized yet. Add " + location.hostname + " in Authentication → Settings → Authorized domains.";
  }
  if (c === "auth/network-request-failed")   return "No internet connection.";
  if (c === "auth/internal-error")           return "Firebase rejected the request (auth/internal-error). If you opened the installed app, try a normal browser tab instead.";
  return "Sign-in failed: " + ((e && e.message) ? e.message : "") + (c ? " (" + c + ")" : "");
}

/* เปิดจากเบราว์เซอร์ในแอป (LINE / Facebook / IG / Messenger) ?
   Google ไม่อนุญาตให้ทำ OAuth ใน webview พวกนี้ → ต้องเปิดใน Chrome/Safari */
function isInAppBrowser(){
  const ua = navigator.userAgent || "";
  return /\bLine\/|FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger|TikTok|Snapchat|Twitter/i.test(ua);
}

/* อยู่ในโหมดแอปติดตั้ง (PWA) หรือไม่ — โหมดนี้ popup ใช้ไม่ได้ ต้องใช้ redirect */
function isStandaloneApp(){
  try {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || window.navigator.standalone === true
      || (window.matchMedia && window.matchMedia("(display-mode: minimal-ui)").matches);
  } catch (e) { return false; }
}

/* error ที่แปลว่า "popup ใช้ไม่ได้ในสภาพแวดล้อมนี้" → ลอง redirect แทน */
const POPUP_FALLBACK_CODES = [
  "auth/internal-error",
  "auth/popup-blocked",
  "auth/operation-not-supported-in-this-environment",
  "auth/cancelled-popup-request",
  "auth/web-storage-unsupported",
];

async function doProviderLogin(provider){
  if (authBusy) return;
  authBusy = true; authError = "";

  // 1) แอปติดตั้ง (PWA) → redirect ตั้งแต่แรก
  if (isStandaloneApp()) {
    render();
    try { await signInWithRedirect(auth, provider); }
    catch (e) { authBusy = false; authError = friendlyAuthError(e); render(); }
    return;
  }

  // 2) เบราว์เซอร์ปกติ → popup ก่อน (ต้องเรียกทันทีก่อน await ใดๆ เพื่อไม่ให้เสีย user gesture)
  const pending = signInWithPopup(auth, provider);
  render();
  try {
    await pending;
    authBusy = false;
  } catch (e) {
    const c = (e && e.code) || "";
    if (POPUP_FALLBACK_CODES.includes(c)) {
      try { await signInWithRedirect(auth, provider); return; }
      catch (e2) { e = e2; }
    }
    authBusy = false;
    authError = friendlyAuthError(e);
    render();
  }
}

const doGoogleLogin = () => doProviderLogin(googleProvider);

function bindLoginEvents(){
  document.getElementById("btnGoogleLogin")?.addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const span = document.createElement("span");
    span.className = "ripple";
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX - r.left - size / 2) + "px";
    span.style.top  = (e.clientY - r.top  - size / 2) + "px";
    btn.appendChild(span);
    setTimeout(() => span.remove(), 600);
    doGoogleLogin();
  });
  document.getElementById("btnThemeLogin")?.addEventListener("click", toggleTheme);
}

    try { await navigator.clipboard.writeText(uid); showToast("คัดลอก User ID แล้ว"); }
    catch { showToast("คัดลอกอัตโนมัติไม่ได้ — เลือกข้อความแล้ว copy เอง"); }
  });
  document.getElementById("btnRetryAccess")?.addEventListener("click", async () => {
    showToast("กำลังตรวจสอบสิทธิ์...");
    await loadProfile(authUser);
    if (userProfile) { attachDataListeners(); showToast("ได้รับสิทธิ์แล้ว เข้าสู่ระบบ..."); view = "inventory"; }
    else showToast("ยังไม่พบสิทธิ์ของบัญชีนี้");
    render();
  });
  document.getElementById("btnNoAccessLogout")?.addEventListener("click", () => signOut(auth));
}

/* อ่านสิทธิ์จาก users/{uid} — ถ้าไม่มีเอกสาร = ยังไม่ได้รับอนุญาต */
async function loadProfile(u){
  authError = "";
  if (!u) { userProfile = null; currentRole = null; currentName = ""; return; }
  try {
    let d = null, docId = u.uid, uidMismatch = false;

    const snap = await getDoc(doc(db, "users", u.uid));
    if (snap.exists()) {
      d = snap.data() || {};
    } else if (u.email) {
      // สำรอง: หาเอกสารที่ผูกด้วย "อีเมล" เผื่อ UID ที่บันทึกไว้พิมพ์ผิด 1 ตัว
      try {
        const q = await getDocs(query(collection(db, "users"), where("email", "==", u.email), limit(1)));
        if (!q.empty) {
          d = q.docs[0].data() || {};
          docId = q.docs[0].id;
          uidMismatch = (docId !== u.uid);
        }
      } catch (_) { /* อ่านไม่ได้ = ไม่มีสิทธิ์ fallback */ }
    }

    if (!d) { userProfile = null; return; }
    if (d.active === false) { userProfile = null; return; }
    const role = VALID_ROLES.includes(d.role) ? d.role : "user";
    userProfile = { uid: u.uid, docId, uidMismatch, ...d, role, email: d.email || u.email || "" };
    currentRole = role;
    currentName = String(d.name || u.displayName || u.email || "").trim();
    localStorage.setItem("wk_name", currentName);
    if (uidMismatch){
      setTimeout(() => showToast("⚠️ UID ในระบบไม่ตรง — เข้าใช้ได้ผ่านอีเมล (แจ้งผู้ดูแลให้แก้ UID)"), 900);
    }
  } catch (e) {
    userProfile = null;
    authError = "อ่านสิทธิ์ไม่สำเร็จ: " + ((e && e.message) ? e.message : e);
  }
}

setPersistence(auth, browserLocalPersistence).catch(() => {});

/* จบ flow แบบ redirect (กลับมาจากหน้า Google) — ถ้าพลาดให้โชว์สาเหตุจริง */
getRedirectResult(auth).catch((e) => {
  authBusy = false;
  authError = friendlyAuthError(e);
  render();
});

onAuthStateChanged(auth, async (u) => {
  authUser = u || null;
  authBusy = false;
  if (u) await loadProfile(u);
  else { userProfile = null; currentRole = null; currentName = ""; usersLoaded = false; usersList = []; }
  // เริ่มดึงข้อมูลจริง "หลัง" รู้สิทธิ์แล้วเท่านั้น
  if (u && userProfile) attachDataListeners(); else detachDataListeners();
  authReady = true;
  lastRenderedView = null;
  render();
});

/* ======================================================
   👥 จัดการผู้ใช้ (เฉพาะ Admin) — แท็บ "ผู้ใช้"
   ====================================================== */
async function loadUsers(){
  if (usersLoading) return;
  usersLoading = true;
  try {
    const snap = await getDocs(collection(db, "users"));
    usersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    usersLoaded = true;
  } catch (e) {
    showToast("โหลดรายชื่อผู้ใช้ไม่สำเร็จ: " + ((e && e.message) ? e.message : e));
  } finally {
    usersLoading = false;
    if (view === "users") render();
  }
}

async function deleteUserDoc(id){
  try {
    await deleteDoc(doc(db, "users", id));
    showToast("ลบผู้ใช้แล้ว");
    usersLoaded = false;
    await loadUsers();
  } catch (e) {
    showToast("ลบไม่สำเร็จ: " + ((e && e.message) ? e.message : e));
  }
}

async function setUserRole(uid, role){
  if (!VALID_ROLES.includes(role)) return;
  try {
    await updateDoc(doc(db, "users", uid), { role, updatedAt: serverTimestamp() });
    showToast("เปลี่ยนสิทธิ์เป็น " + (ROLE_LABEL[role] || role) + " แล้ว");
    await loadUsers();
  } catch (e) {
    showToast("เปลี่ยนสิทธิ์ไม่สำเร็จ: " + ((e && e.message) ? e.message : e));
  }
}

async function toggleUserActive(uid, isActive){
  try {
    await updateDoc(doc(db, "users", uid), { active: !isActive, updatedAt: serverTimestamp() });
    showToast(isActive ? "ปิดสิทธิ์บัญชีนี้แล้ว" : "เปิดสิทธิ์บัญชีนี้แล้ว");
    await loadUsers();
  } catch (e) {
    showToast("อัปเดตไม่สำเร็จ: " + ((e && e.message) ? e.message : e));
  }
}

async function addUserFromForm(){
  const uid = (document.getElementById("newUserUid")?.value || "").trim();
  const name = (document.getElementById("newUserName")?.value || "").trim();
  const email = (document.getElementById("newUserEmail")?.value || "").trim();
  const role = document.getElementById("newUserRole")?.value || "user";
  if (!uid) { showToast("กรอก User ID ก่อน (ได้จากหน้าจอของพนักงาน)"); return; }
  if (uid.length < 15) { showToast("User ID ไม่ถูกต้อง — ต้องเป็นชุดยาวๆ ที่คัดลอกมาจากหน้าจอพนักงาน"); return; }
  try {
    await setDoc(doc(db, "users", uid), {
      name: name || email || "ผู้ใช้ใหม่",
      email: email || "",
      role,
      active: true,
      createdAt: serverTimestamp(),
    }, { merge: true });
    showToast("เพิ่มผู้ใช้แล้ว");
    ["newUserUid","newUserName","newUserEmail"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
    await loadUsers();
  } catch (e) {
    showToast("เพิ่มผู้ใช้ไม่สำเร็จ: " + ((e && e.message) ? e.message : e));
  }
}

function renderUsers(){

    const rank = { admin: 0, approve: 1, user: 2 };
    const ra = rank[a.role] ?? 3, rb = rank[b.role] ?? 3;
    if (ra !== rb) return ra - rb;
    return String(a.name || a.email || "").localeCompare(String(b.name || b.email || ""), "th");
  });

  const rows = sorted.map(u => {
    const role = VALID_ROLES.includes(u.role) ? u.role : "user";

             class="btn ${role === r ? "btn-accent" : "btn-ghost"}" style="padding:6px 10px;font-size:11.5px;">${ROLE_LABEL[r]}</button>`).join("")}

          class="btn ${active ? "btn-danger" : "btn-ghost"}" style="padding:6px 10px;font-size:11.5px;" title="${active ? "ปิดสิทธิ์" : "เปิดสิทธิ์"}">

        </button>
        ${isMe ? "" : `<button data-user-del="${esc(u.id)}" data-user-label="${esc(u.name || u.email || u.id)}"
          class="btn btn-danger" style="padding:6px 10px;font-size:11.5px;" title="ลบผู้ใช้นี้ออกจากระบบ">
          <i class="ti ti-trash" aria-hidden="true"></i> ลบ
        </button>`}

  }).join("");

  return `
    <div class="notice" style="background:var(--panelAlt);border-color:var(--border);color:var(--muted);line-height:1.75;">
      🔐 สิทธิ์ถูกตรวจที่ Firestore Rules ฝั่งเซิร์ฟเวอร์แล้ว — ไม่ใช่แค่ซ่อนปุ่มในหน้าเว็บ<br>
      พนักงานใหม่: ให้เขาล็อกอินด้วย Google ก่อน → จะเห็นหน้า "ยังไม่ได้รับสิทธิ์" พร้อม <b>User ID</b> → คัดลอกมาวางด้านล่าง
    </div>

    <div class="section-title"><i class="ti ti-user-plus" aria-hidden="true"></i> เพิ่มผู้ใช้ใหม่</div>
    <div class="field-wrap"><label class="field">User ID (จากหน้าจอของพนักงาน)</label><input id="newUserUid" placeholder="เช่น aB3dE9fGhIjKlMnOpQrS"></div>
    <div class="grid2">
      <div class="field-wrap"><label class="field">ชื่อที่แสดง</label><input id="newUserName" placeholder="เช่น สมชาย ก."></div>

      : (usersList.length === 0 ? `<div class="empty">ยังไม่มีผู้ใช้ในระบบ<br><span style="font-size:11.5px;">เพิ่มตัวเองก่อนด้วย User ID ของคุณ แล้วรีเฟรชหน้าเว็บ</span></div>`

}

    if (ok) deletePRRequest(id);
  }));
  document.querySelectorAll("[data-edit-pr]").forEach(el => el.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const pr = prRequests.find(p => p.id === el.dataset.editPr);
    if (pr) openPREdit(pr);
  }));

  /* ---- PR edit modal (admin) ---- */
  document.getElementById("closePREdit")?.addEventListener("click", closePREdit);
  document.getElementById("overlayPREdit")?.addEventListener("click", (ev) => {
    if (ev.target.id === "overlayPREdit") closePREdit();
  });
  document.querySelectorAll("[data-edit-jobtype]").forEach(el => el.addEventListener("click", () => setPREditJobType(el.dataset.editJobtype)));
  document.querySelectorAll("[data-edit-category]").forEach(el => el.addEventListener("click", () => setPREditCategory(el.dataset.editCategory)));
  document.getElementById("btnAddPREditRow")?.addEventListener("click", addPREditRow);
  document.querySelectorAll("[data-remove-edit-row]").forEach(el => el.addEventListener("click", () => removePREditRow(el.dataset.removeEditRow)));
  document.querySelectorAll(".prEditRowQty, .prEditRowPrice").forEach(el => el.addEventListener("input", () => {
    const rowId = el.dataset.row;
    const qtyEl = document.getElementById(`prEditRow_${rowId}_qty`);
    const priceEl = document.getElementById(`prEditRow_${rowId}_price`);
    const amountEl = document.getElementById(`prEditRow_${rowId}_amount`);
    const amount = (parseFloat(qtyEl?.value)||0) * (parseFloat(priceEl?.value)||0);
    if (amountEl) amountEl.textContent = prFormatMoney(amount);
    let sum = 0;
    document.querySelectorAll(".prEditRowQty").forEach(qEl => {
      const rid = qEl.dataset.row;
      const pEl = document.getElementById(`prEditRow_${rid}_price`);
      sum += (parseFloat(qEl.value)||0) * (parseFloat(pEl?.value)||0);
    });
    const totalEl = document.getElementById("prEditTotalAmount");
    if (totalEl) totalEl.textContent = prFormatMoney(sum);
  }));
  document.getElementById("btnSavePREdit")?.addEventListener("click", savePREdit);
  document.querySelectorAll("[data-approve-pr]").forEach(el => el.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    const id = el.dataset.approvePr;
    const ok = await showConfirm({ title:"อนุมัติใบ PR นี้?", message:"สถานะจะเปลี่ยนเป็นอนุมัติแล้วทันที", confirmText:"อนุมัติ", icon:"ti-circle-check" });
    if (ok) approvePRRequest(id);
  }));
  document.querySelectorAll("[data-reject-pr]").forEach(el => el.addEventListener("click", (ev) => {
    ev.stopPropagation();
    rejectPRRequest(el.dataset.rejectPr);
  }));
  document.getElementById("btnExportRange")?.addEventListener("click", () => {
    const from = document.getElementById("exportFrom")?.value || "";
    const to = document.getElementById("exportTo")?.value || "";
    if (!from) { showToast("กรุณาเลือกวันที่อย่างน้อย 1 วัน"); return; }
    exportHistoryExcel(from, to || from);
  });
  document.getElementById("btnExportAll")?.addEventListener("click", () => {
    exportHistoryExcel(null, null);
  });
  document.getElementById("btnAddMachine")?.addEventListener("click", async () => {
    const input = document.getElementById("newMachineName");
    await addMachine(input.value);
    input.value = "";
  });
  document.getElementById("newMachineName")?.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const input = e.target;
      await addMachine(input.value);
      input.value = "";
    }
  });
  document.querySelectorAll("[data-del-machine]").forEach(el => el.addEventListener("click", async () => {
    const id = el.dataset.delMachine;
    const ok = await showConfirm({ title:"ลบเครื่องจักรนี้?", message:"อะไหล่ที่เคยผูกไว้กับเครื่องนี้จะยังแสดงชื่อเดิมอยู่ ไม่ได้ถูกลบตาม", confirmText:"ลบเครื่องจักร", icon:"ti-trash", danger:true });
    if (ok) deleteMachine(id);
  }));
  document.querySelectorAll("[data-edit-machine]").forEach(el => el.addEventListener("click", () => {
    editingMachineId = el.dataset.editMachine; render();
    const input = document.getElementById("editMachineName_" + editingMachineId);
    if (input) { input.focus(); const p = input.value.length; input.setSelectionRange(p, p); }
  }));
  document.querySelectorAll("[data-cancel-edit-machine]").forEach(el => el.addEventListener("click", () => {
    editingMachineId = null; render();
  }));
  document.querySelectorAll("[data-save-machine]").forEach(el => el.addEventListener("click", () => {
    const id = el.dataset.saveMachine;
    const oldName = el.dataset.oldName;
    const input = document.getElementById("editMachineName_" + id);
    renameMachine(id, oldName, input.value);
  }));
  document.querySelectorAll("[id^='editMachineName_']").forEach(el => el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const id = e.target.id.replace("editMachineName_", "");
      const m = machines.find(x => x.id === id);
      renameMachine(id, m ? m.name : "", e.target.value);
    } else if (e.key === "Escape") {
      editingMachineId = null; render();
    }
  }));
  document.getElementById("searchInput")?.addEventListener("input", (e) => {
    search = e.target.value; render();
    const el = document.getElementById("searchInput");
    if (el) { el.focus(); const p = search.length; el.setSelectionRange(p, p); }
  });
  document.getElementById("zoneFilterSelect")?.addEventListener("change", (e) => {
    zoneFilter = e.target.value; render();
  });
  if (view === "inventory") bindHgStrips();

  if (view === "inventory") buildScrollIndex();

  /* กดหัวชั้น = พลิกเปิด/ปิด (ไม่ re-render เพื่อให้อนิเมชันเล่นได้) */
  document.querySelectorAll("[data-group-toggle]").forEach(el => el.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const key = el.dataset.groupToggle;
    const card = el.closest(".machine-group");
    const willOpen = !card.classList.contains("open");
    card.classList.toggle("open", willOpen);
    el.setAttribute("aria-expanded", willOpen ? "true" : "false");
    if (willOpen) openGroups.add(key); else openGroups.delete(key);
    persistGroups();
  }));

  // part form
  document.getElementById("closePart")?.addEventListener("click", () => { addOpen=false; editPart=null; showNewMachineInput=false; render(); });
  document.getElementById("fMachineSelect")?.addEventListener("change", (e) => {
    showNewMachineInput = e.target.value === "__new__";
    const wrap = document.getElementById("machineNewWrap");
    if (wrap) wrap.style.display = showNewMachineInput ? "flex" : "none";
    if (showNewMachineInput) document.getElementById("fMachineNew")?.focus();
  });
  document.getElementById("fZoneAll")?.addEventListener("change", (e) => {
    const list = document.getElementById("zoneCheckList");
    if (list) {
      list.style.opacity = e.target.checked ? ".4" : "1";
      list.style.pointerEvents = e.target.checked ? "none" : "auto";
    }
  });
  document.getElementById("btnAddZoneTag")?.addEventListener("click", () => {
    const input = document.getElementById("fZoneNew");
    const val = input?.value.trim();
    if (!val) return;
    const list = document.getElementById("zoneCheckList");
    const exists = [...document.querySelectorAll(".zoneCheckbox")].some(cb => cb.value === val);
    if (!exists && list) {
      const label = document.createElement("label");
      label.style.cssText = "display:flex;align-items:center;gap:10px;background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;cursor:pointer;width:100%;box-sizing:border-box;";
      label.innerHTML = `<input type="checkbox" class="zoneCheckbox" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);margin:0;" value="${val.replace(/"/g,"&quot;")}" checked> <span style="flex:1;">${val.replace(/</g,"&lt;")}</span>`;
      list.appendChild(label);
    } else {
      const cb = [...document.querySelectorAll(".zoneCheckbox")].find(c => c.value === val);
      if (cb) cb.checked = true;
    }
    input.value = "";
    input.focus();
  });
  document.getElementById("photoInput")?.addEventListener("change", async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    try {
      pendingPhotoBlob = await compressImage(file); // dataURL string
      render();
      const errEl = document.getElementById("photoErr");
      if (errEl) errEl.style.display = "none";
    } catch (err) {
      pendingPhotoBlob = null;
      render();
      const errEl = document.getElementById("photoErr");
      if (errEl) { errEl.textContent = "อัปโหลดรูปไม่สำเร็จ ลองรูปอื่น"; errEl.style.display = "block"; }
    }
  });
  document.getElementById("btnAiScanInForm")?.addEventListener("click", () => {
    openAiScan((predictedName) => {
      const nameInput = document.getElementById("fName");
      if (nameInput) { nameInput.value = predictedName; nameInput.focus(); }
    });
  });
  document.getElementById("btnSavePart")?.addEventListener("click", async () => {
    const name = document.getElementById("fName").value.trim();
    const isAllZones = document.getElementById("fZoneAll")?.checked;
    const zones = isAllZones ? ["__all__"] : [...document.querySelectorAll(".zoneCheckbox:checked")].map(cb => cb.value);
    const code = document.getElementById("fCode").value.trim();
    const unit = document.getElementById("fUnit").value.trim() || "ชิ้น";
    const qty = Number(document.getElementById("fQty").value);
    const min = Number(document.getElementById("fMin").value);
    const maxRaw = document.getElementById("fMax").value.trim();
    const max = maxRaw === "" ? null : Number(maxRaw);
    const errEl = document.getElementById("formErr");
    if (!name || !code) { errEl.textContent = "กรุณากรอกชื่อและรหัสอะไหล่"; errEl.style.display="block"; return; }
    const machineSelectVal = document.getElementById("fMachineSelect")?.value || "";
    let machine = "";
    if (machineSelectVal === "__new__") {
      const newName = document.getElementById("fMachineNew")?.value.trim() || "";
      if (!newName) { errEl.textContent = "กรุณากรอกชื่อเครื่องจักรใหม่ หรือเลือกเครื่องจักรที่มีอยู่"; errEl.style.display="block"; return; }
      machine = await ensureMachine(newName);
    } else {
      machine = machineSelectVal;
    }
    let photo = editPart?.photo || null;
    if (pendingPhotoBlob) photo = pendingPhotoBlob; // base64 dataURL string
    showNewMachineInput = false;
    await savePart({ id: editPart?.id, name, zones, code, unit, qty, min, max, machine, photo });
  });
  document.getElementById("btnDeletePart")?.addEventListener("click", async () => {
    const id = editPart?.id;
    const ok = await showConfirm({ title:"ลบอะไหล่นี้?", message:"ข้อมูลอะไหล่และรูปที่แนบไว้จะถูกลบออกจากคลังถาวร", confirmText:"ลบอะไหล่", icon:"ti-trash", danger:true });
    if (ok) deletePart(id);
  });

  // withdraw form
  document.getElementById("closeWithdraw")?.addEventListener("click", () => { withdrawPart=null; render(); });
  document.getElementById("btnConfirmWithdraw")?.addEventListener("click", () => {
    const qty = Number(document.getElementById("wQty").value);
    const machine = withdrawPart.machine || "";
    const by = document.getElementById("wBy").value.trim();
    const note = document.getElementById("wNote").value.trim();
    const errEl = document.getElementById("wErr");
    if (!qty || qty <= 0) { errEl.textContent="ระบุจำนวนให้ถูกต้อง"; errEl.style.display="block"; return; }
    if (qty > withdrawPart.qty) { errEl.textContent=`คลังเหลือแค่ ${withdrawPart.qty} ${withdrawPart.unit}`; errEl.style.display="block"; return; }
    errEl.style.display="none";
    withdraw(withdrawPart, qty, machine, by, note);
  });

  if (view === "users") bindUsersEvents();
}

/* ---------------- roll-up warehouse door entrance ---------------- */
function initWarehouseDoor(){
  // ปิดหน้าประตูทางเข้าถาวร — เข้าแอปตรงได้เลยไม่ต้องลาก/กดอะไรก่อน
  const door = document.getElementById("warehouseDoor");
  if (door) door.classList.add("hidden");
}

render();
initBgParticles();
initWarehouseDoor();
mountStorageWidget();
mountAiScanFab();
syncChromeVisibility();   // ซ่อนของที่ใช้เฉพาะในแอป ถ้ายังไม่ล็อกอิน

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
