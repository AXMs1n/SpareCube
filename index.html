  /* ---- ตัวการ์ตูนบนการ์ดเมนู "คลังอะไหล่" ---- */
  .hub-blob .hub-mascot{
    width:96% !important; height:96% !important; display:block;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));
  }
  .hub-card[data-hub="inventory"] .hub-blob{
    background:rgba(var(--tc), .10) !important;
    box-shadow:inset 0 0 0 1.5px rgba(var(--tc), .38) !important;
  }
  .hub-card[data-hub="inventory"].is-front .hub-blob{
    background:rgba(var(--tc), .16) !important;
    box-shadow:inset 0 0 0 1.5px rgba(var(--tc), .6), 0 0 26px rgba(var(--tc), .4) !important;
  }
  @media(max-width:900px){
    .hub-blob .hub-mascot{ width:100% !important; height:100% !important; }
  }


  /* ---- อนิเมชัน "ดีใจ" ตอนคลิกเข้าหน้า ---- */
  #mcEnter{
    position:fixed; inset:0; z-index:9999; display:none;
    place-items:center; pointer-events:none; overflow:hidden;
  }
  #mcEnter.on{ display:grid; }
  #mcEnter .mc-flash{
    position:absolute; inset:-10%;
    background:radial-gradient(circle at 50% 50%, rgba(45,212,191,.55), rgba(45,212,191,.12) 42%, transparent 66%);
    opacity:0;
  }
  #mcEnter.on .mc-flash{ animation:mcFlashIn 2s ease-out forwards; }
  #mcEnter .mc-jump{
    width:min(200px, 42vw); height:min(240px, 50vw);
    display:grid; place-items:center;
    filter:drop-shadow(0 18px 46px rgba(0,0,0,.6));
    will-change:transform, opacity;
  }
  #mcEnter .mc-jump svg{ width:100%; height:100%; display:block; }
  #mcEnter.on .mc-jump{ animation:mcJumpIn 2s cubic-bezier(.2,1.05,.3,1) forwards; }
  #mcEnter .mc-spark{
    position:absolute; font-size:30px; color:#5eead4; opacity:0;
    text-shadow:0 0 18px rgba(94,234,212,.9);
  }
  #mcEnter.on .mc-spark{ animation:mcSpark 2s ease-out forwards; }
  #mcEnter .s1{ --tx:-104px; --ty:-78px; animation-delay:.18s !important; }
  #mcEnter .s2{ --tx: 108px; --ty:-58px; animation-delay:.34s !important; font-size:24px; }
  #mcEnter .s3{ --tx: -78px; --ty: 92px; animation-delay:.26s !important; font-size:22px; }
  #mcEnter .s4{ --tx:  92px; --ty:100px; animation-delay:.42s !important; }

  @keyframes mcJumpIn{
    0%  { transform:scale(.40) translateY(30px); opacity:0; }
    9%  { transform:scale(1.18) translateY(-16px); opacity:1; }
    17% { transform:scale(.97)  translateY(0); }
    26% { transform:scale(1.06) translateY(-10px); }
    34% { transform:scale(1)    translateY(0); }
    54% { transform:scale(1.03) translateY(0); }      /* ยืนโชว์หน้าดีใจ */
    70% { transform:scale(1.55) translateY(0); }
    88% { transform:scale(3.30) translateY(0); }
    100%{ transform:scale(5.60) translateY(6px); opacity:0; }
  }
  @keyframes mcFlashIn{
    0%, 42%{ opacity:0; }
    74%    { opacity:.95; }
    100%   { opacity:0; }
  }
  @keyframes mcSpark{
    0%  { opacity:0; transform:translate(var(--tx,0px),var(--ty,0px)) scale(.25) rotate(0deg); }
    28% { opacity:1; transform:translate(var(--tx,0px),var(--ty,0px)) scale(1.05) rotate(12deg); }
    100%{ opacity:0; transform:translate(var(--tx,0px),var(--ty,0px)) scale(2.1) rotate(45deg); }
  }
  /* หน้าเดิมขยายตามออกไปตอนสลับ */
  #app.leaving{ animation:appZoomOut .5s ease-in forwards; }
  @keyframes appZoomOut{
    from{ transform:scale(1); filter:none; }
    to  { transform:scale(1.06); filter:blur(3px) brightness(.75); }
  }
  @media (prefers-reduced-motion: reduce){
    #mcEnter.on .mc-jump{ animation:none; opacity:1; }
    #mcEnter.on .mc-flash{ animation:none; opacity:.3; }
    #mcEnter.on .mc-spark{ animation:none; opacity:0; }
    #app.leaving{ animation:none; }
  }


  /* ---- ตัวการ์ตูน: เอนตามแรงเฉื่อย + หน้าตกใจ ---- */
  .hub-mascot{
    transform-origin:50% 92%;
    will-change:transform;
  }
  .hub-blob{ overflow:visible !important; }

  .hub-mascot.lean-r{ animation:mcLeanR .66s cubic-bezier(.26,.9,.3,1) both; }
  .hub-mascot.lean-l{ animation:mcLeanL .66s cubic-bezier(.26,.9,.3,1) both; }

  /* หมุนซ้าย (ไปใบถัดไป) → ตัวกลิ้งไปขวา แล้วสปริงกลับ */
  @keyframes mcLeanR{
    0%  { transform:rotate(0deg)   translateX(0)     scale(1,1); }
    10% { transform:rotate(26deg)  translateX(-9px)  scale(.94,1.07); }
    26% { transform:rotate(15deg)  translateX(-5px)  scale(.97,1.03); }
    46% { transform:rotate(-8deg)  translateX(4px)   scale(1.03,.97); }
    64% { transform:rotate(4deg)   translateX(-2px); }
    80% { transform:rotate(-1.6deg) translateX(1px); }
    100%{ transform:rotate(0deg)   translateX(0) scale(1,1); }
  }
  /* หมุนขวา (ย้อนใบ) → ตัวกลิ้งไปซ้าย */
  @keyframes mcLeanL{
    0%  { transform:rotate(0deg)   translateX(0)    scale(1,1); }
    10% { transform:rotate(-26deg) translateX(9px)  scale(.94,1.07); }
    26% { transform:rotate(-15deg) translateX(5px)  scale(.97,1.03); }
    46% { transform:rotate(8deg)   translateX(-4px) scale(1.03,.97); }
    64% { transform:rotate(-4deg)  translateX(2px); }
    80% { transform:rotate(1.6deg) translateX(-1px); }
    100%{ transform:rotate(0deg)   translateX(0) scale(1,1); }
  }

  .mc-sweat{ transform-box:fill-box; transform-origin:50% 100%; animation:mcSweat 1.6s ease-in-out infinite; }
  .mc-bang{ transform-box:fill-box; transform-origin:50% 100%; animation:mcBang .9s ease-in-out infinite; }
  @keyframes mcSweat{
    0%,100%{ transform:translateY(0) scale(1); opacity:.95; }
    55%    { transform:translateY(6px) scale(.92); opacity:.55; }
  }
  @keyframes mcBang{
    0%,100%{ transform:scale(1) rotate(0); opacity:1; }
    50%    { transform:scale(1.25) rotate(-6deg); opacity:.75; }
  }
  @media (prefers-reduced-motion: reduce){
    .hub-mascot.lean-r, .hub-mascot.lean-l{ animation:none !important; }
    .mc-sweat, .mc-bang, .mc-eyeS1, .mc-eyeS2{ animation:none; }
  }


  /* ---- คลิกเข้าเมนู: กระโดด/กลิ้งในวงกลม ---- */
  .hub-card.is-clipping .hub-blob{ overflow:hidden !important; }
  .hub-mascot.hop-out{ animation:mcHopOut .44s cubic-bezier(.32,.86,.34,1) both; }
  @keyframes mcHopOut{
    0%  { transform:translate(0,0)       rotate(0deg)   scale(1);        opacity:1; }
    18% { transform:translate(0,-18px)   rotate(-10deg) scale(1.06,1.11); opacity:1; }
    42% { transform:translate(9px,-5px)  rotate(12deg)  scale(1.03,1.01); opacity:1; }
    64% { transform:translate(16px, 1px)  rotate(24deg)  scale(.99);      opacity:.70; }
    82% { transform:translate(21px, 4px)  rotate(31deg)  scale(.96);      opacity:.28; }
    100%{ transform:translate(24px, 6px)  rotate(36deg)  scale(.94);      opacity:0; }
  }
  .hub-blob.blob-pop{ animation:mcBlobPop .42s cubic-bezier(.3,.9,.35,1) both; }
  @keyframes mcBlobPop{
    0%  { transform:scale(1) rotate(0); opacity:1; }
    30% { transform:scale(1.18) rotate(-8deg); opacity:1; }
    100%{ transform:scale(1.4) rotate(16deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .hub-mascot.hop-out, .hub-blob.blob-pop{ animation:none !important; }
  }


  /* ---- ไอคอนการ์ตูนในหัวข้อหน้า ---- */
  .subnav-cur{ display:inline-flex; align-items:center; gap:7px; }
  .nav-mascot{
    width:27px; height:27px; flex:none; display:block;
    transform-origin:50% 88%;
    filter:drop-shadow(0 2px 7px rgba(0,0,0,.4));
    will-change:transform;
  }

</style>
</head>
<body>

<canvas id="bgParticles"></canvas>

<div id="doorLightBurst"></div>
<div id="warehouseDoor">
  <div class="door-siren door-siren-top"></div>
  <div class="door-slats"></div>
  <div class="door-handle-wrap">
    <div class="door-handle" id="doorHandle">
      <i class="ti ti-grip-horizontal" aria-hidden="true"></i>
    </div>
    <div class="door-hint">ลากขึ้นเพื่อเข้าใช้งาน</div>
    <i class="ti ti-chevron-up door-hint-arrow" aria-hidden="true"></i>
  </div>
  <div class="door-siren door-siren-bottom"></div>
</div>


<svg id="mc-sprite" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
  <style>
    .mc-fb{ transform-box:fill-box; }
    /* ปิดการกระโดดทั้งตัว / หมวกสะบัด / เงาขยับ — เหลือเฉพาะ ตา + คิ้ว */
    .mc-shadow{ transform-origin:50% 50%; animation:none; }
    .mc-bounce{ transform-origin:50% 100%; animation:none; }
    .mc-hat{ transform-origin:50% 100%; animation:none; }
    .mc-glasses{ animation:mcGlasses 4s ease-in-out infinite; }
    .mc-look{ animation:mcLook 4s ease-in-out infinite; }
    .mc-blink{ transform-origin:50% 50%; animation:mcBlink 4s ease-in-out infinite; }
    .mc-browR{ transform-origin:50% 50%; animation:mcBrowR 4s ease-in-out infinite; }
    .mc-browL{ transform-origin:50% 50%; animation:mcBrowL 4s ease-in-out infinite; }

    @keyframes mcBounce{
      0%,100%{ transform:translateY(0) scale(1,1); }
      8%{ transform:translateY(0) scale(1.07,.92); }
      20%{ transform:translateY(-16px) scale(.96,1.06); }
      32%{ transform:translateY(0) scale(1.08,.9); }
      38%{ transform:translateY(0) scale(.98,1.02); }
      44%{ transform:translateY(0) scale(1,1); }
    }
    @keyframes mcShadow{
      0%,100%,44%{ transform:scaleX(1); opacity:.25; }
      20%{ transform:scaleX(.78); opacity:.14; }
    }
    @keyframes mcHat{
      0%,100%{ transform:translateY(0) rotate(0); }
      8%{ transform:translateY(3px) rotate(0); }
      20%{ transform:translateY(-7px) rotate(-6deg); }
      32%{ transform:translateY(2px) rotate(5deg); }
      40%{ transform:rotate(-3deg); }
      48%{ transform:rotate(1.5deg); }
      56%{ transform:rotate(0); }
    }
    @keyframes mcGlasses{
      0%,60%{ transform:translateY(0); }
      80%{ transform:translateY(4px); }
      84%{ transform:translateY(-2px); }
      88%{ transform:translateY(0); }
    }
    @keyframes mcLook{
      0%,50%{ transform:translateX(0); }
      55%,68%{ transform:translateX(-5px); }
      72%,84%{ transform:translateX(5px); }
      90%,100%{ transform:translateX(0); }
    }
    @keyframes mcBlink{
      0%,91%,98%,100%{ transform:scaleY(1); }
      94.5%{ transform:scaleY(.08); }
    }
    @keyframes mcBrowR{
      0%,40%{ transform:translateY(0) rotate(0); }
      50%{ transform:translateY(-5px) rotate(-6deg); }
      56%{ transform:translateY(-2px) rotate(-2deg); }
      62%{ transform:translateY(-5px) rotate(-8deg); }
      70%,100%{ transform:translateY(0) rotate(0); }
    }
    @keyframes mcBrowL{
      0%,40%,70%,100%{ transform:translateY(0); }
      50%,62%{ transform:translateY(2px); }
    }
    @media (prefers-reduced-motion: reduce){
      .mc-shadow, .mc-bounce, .mc-hat,
      .mc-glasses, .mc-look, .mc-blink,
      .mc-browR, .mc-browL{ animation:none; }
    }

    /* ---- ของในมือขยับเบาๆ ---- */
    .acc{ transform-box:fill-box; }
    .acc-pen{ transform-origin:50% 90%; animation:penIdle 3.4s ease-in-out infinite; }
    @keyframes penIdle{ 0%,100%{ transform:rotate(0);} 45%{ transform:rotate(-8deg) translateY(-3px);} }
    .acc-paper{ transform-origin:50% 12%; animation:paperIdle 3.8s ease-in-out infinite; }
    @keyframes paperIdle{ 0%,100%{ transform:rotate(0);} 42%{ transform:rotate(6deg);} 72%{ transform:rotate(-3deg);} }
    .acc-chart .bar{ transform-box:fill-box; transform-origin:50% 100%; }
    .bar1{ animation:barIdle 2.6s ease-in-out infinite; }
    .bar2{ animation:barIdle 2.6s ease-in-out infinite .18s; }
    .bar3{ animation:barIdle 2.6s ease-in-out infinite .36s; }
    @keyframes barIdle{ 0%,100%{ transform:scaleY(1);} 50%{ transform:scaleY(.6);} }
    .acc-clock .hand-h{ transform-box:view-box; animation:clockH 16s steps(4) infinite; }
    .acc-clock .hand-m{ transform-box:view-box; animation:clockM 6s steps(6) infinite; }
    @keyframes clockH{ to{ transform:rotate(90deg);} }
    @keyframes clockM{ to{ transform:rotate(360deg);} }
    .acc-coin{ transform-box:fill-box; transform-origin:50% 50%; animation:coinIdle 3s ease-in-out infinite; }
    @keyframes coinIdle{ 0%,100%{ transform:translateY(0) scaleX(1);} 45%{ transform:translateY(-6px) scaleX(.78);} }
    .acc-gear{ transform-box:fill-box; transform-origin:50% 50%; animation:gearIdle 10s linear infinite; }
    @keyframes gearIdle{ to{ transform:rotate(360deg);} }
    .acc-headset{ transform-box:fill-box; animation:hsIdle 2.8s ease-in-out infinite; }
    @keyframes hsIdle{ 0%,100%{ opacity:1;} 50%{ opacity:.7;} }

    /* ---- ท่าตอนคลิก ---- */
    .accx-pen{ transform-box:fill-box; transform-origin:50% 10%; animation:penDrop .56s cubic-bezier(.4,0,.7,1) forwards; }
    @keyframes penDrop{
      0%{ transform:rotate(0) translate(0,0); opacity:1; }
      32%{ transform:rotate(-42deg) translate(-14px,-18px); opacity:1; }
      100%{ transform:rotate(165deg) translate(-34px,86px); opacity:0; }
    }
    .accx-paper{ transform-box:fill-box; transform-origin:50% 0%; animation:paperDrop .56s cubic-bezier(.4,0,.7,1) forwards; }
    @keyframes paperDrop{
      0%{ transform:rotate(0) translate(0,0); opacity:1; }
      28%{ transform:rotate(-14deg) translate(-10px,-16px); opacity:1; }
      100%{ transform:rotate(38deg) translate(-28px,92px); opacity:0; }
    }
    .accx-chart .bar{ transform-box:fill-box; transform-origin:50% 100%; }
    .accx-chart .bar1{ animation:barPop .5s ease-out forwards; }
    .accx-chart .bar2{ animation:barPop .5s ease-out .05s forwards; }
    .accx-chart .bar3{ animation:barPop .5s ease-out .1s forwards; }
    @keyframes barPop{ 0%{ transform:scaleY(1);} 45%{ transform:scaleY(1.6);} 100%{ transform:scaleY(0);} }
    .accx-clock .hand-h{ transform-box:view-box; animation:clockSpin .54s ease-in forwards; }
    .accx-clock .hand-m{ transform-box:view-box; animation:clockSpinF .54s ease-in forwards; }
    @keyframes clockSpin{ to{ transform:rotate(320deg);} }
    @keyframes clockSpinF{ to{ transform:rotate(1140deg);} }
    .accx-coin{ transform-box:fill-box; transform-origin:50% 50%; animation:coinFlip .54s ease-out forwards; }
    @keyframes coinFlip{
      0%{ transform:translateY(0) scaleX(1); opacity:1; }
      38%{ transform:translateY(-30px) scaleX(.18); opacity:1; }
      68%{ transform:translateY(-8px) scaleX(1); opacity:.9; }
      100%{ transform:translateY(8px) scaleX(.35); opacity:0; }
    }
    .accx-gear{ transform-box:fill-box; transform-origin:50% 50%; animation:gearBurst .54s cubic-bezier(.3,.8,.4,1) forwards; }
    @keyframes gearBurst{ 0%{ transform:rotate(0) scale(1); opacity:1;} 60%{ transform:rotate(280deg) scale(1.22); opacity:1;} 100%{ transform:rotate(440deg) scale(.35); opacity:0;} }
    .accx-headset{ transform-box:fill-box; animation:hsPing .54s ease-out forwards; }
    @keyframes hsPing{ 0%{ transform:scale(1); opacity:1;} 45%{ transform:scale(1.09); opacity:1;} 100%{ transform:scale(1.42); opacity:0;} }

  

    /* ---- ตัวการ์ตูน "รายการ PR" (แบบที่ผู้ใช้ส่ง) ---- */
    .pl-fb{ transform-box:fill-box; }
    .pl-look{ animation:plLook 4s ease-in-out infinite; }
    .pl-blink{ transform-origin:50% 50%; animation:plBlink 4s ease-in-out infinite; }
    @keyframes plLook{
      0%,10%{ transform:translate(0,0); } 16%,28%{ transform:translate(-4px,4px); }
      34%,46%{ transform:translate(4px,4px); } 52%,60%{ transform:translate(-4px,5px); }
      68%,100%{ transform:translate(0,0); }
    }
    @keyframes plBlink{
      0%,84%,92%,100%{ transform:scaleY(1); } 88%{ transform:scaleY(.08); }
    }
    /* ท่าคลิก: ฟอร์มดีดขึ้น + ติ๊กเขียวestamp */
    .pl-form-x{ transform-box:fill-box; transform-origin:50% 100%;
                animation:plLift .56s cubic-bezier(.3,.9,.35,1) forwards; }
    @keyframes plLift{
      0%  { transform:translateY(0) rotate(0) scale(1); opacity:1; }
      28% { transform:translateY(-13px) rotate(-5deg) scale(1.05); opacity:1; }
      58% { transform:translateY(-2px) rotate(2deg) scale(1.01); opacity:1; }
      100%{ transform:translateY(10px) rotate(0) scale(.9); opacity:.1; }
    }
    .pl-check{ animation:plCheck .56s ease-out forwards; transform-box:fill-box; transform-origin:50% 50%; }
    @keyframes plCheck{
      0%,35%{ transform:scale(.2); opacity:0; }
      55%{ transform:scale(1.35); opacity:1; }
      75%{ transform:scale(.95); }
      100%{ transform:scale(1); opacity:1; }
    }
    .pl-ok{ transform-box:fill-box; transform-origin:50% 50%; animation:plOk .56s ease-out forwards; }
    @keyframes plOk{
      0%,40%{ transform:scale(.2); opacity:0; }
      62%{ transform:scale(1.25); opacity:1; }
      100%{ transform:scale(1.6); opacity:0; }
    }
    @media (prefers-reduced-motion: reduce){
      .pl-look,.pl-blink,.pl-form-x,.pl-check,.pl-ok{ animation:none; }
    }


    /* ---- ตัวการ์ตูน "รายการ PR": คุณลุงหนวด + แว่นตาเดียว ---- */
    .rl-fb{ transform-box:fill-box; }
    .rl-look{ animation:rlLook 4s ease-in-out infinite; }
    .rl-blink{ transform-origin:50% 50%; animation:rlBlink 4s ease-in-out infinite; }
    @keyframes rlLook{
      0%,10%{ transform:translate(0,0); } 16%,28%{ transform:translate(-4px,3px); }
      34%,46%{ transform:translate(4px,3px); } 52%,60%{ transform:translate(-3px,4px); }
      68%,100%{ transform:translate(0,0); }
    }
    @keyframes rlBlink{ 0%,84%,92%,100%{ transform:scaleY(1);} 88%{ transform:scaleY(.08);} }
    .rl-stache{ transform-box:fill-box; animation:rlStache 4s ease-in-out infinite; }
    .rl-stL{ transform-origin:100% 50%; animation:rlStL 4s ease-in-out infinite; }
    .rl-stR{ transform-origin:0% 50%; animation:rlStR 4s ease-in-out infinite; }
    @keyframes rlStache{
      0%,18%,36%,60%,82%,100%{ transform:translateY(0);} 27%{ transform:translateY(-2px);} 68%{ transform:translateY(-3px);} 74%{ transform:translateY(1px);}
    }
    @keyframes rlStL{
      0%,18%,100%{ transform:rotate(0);} 22%{ transform:rotate(8deg);} 26%{ transform:rotate(-3deg);}
      30%{ transform:rotate(6deg);} 34%,60%{ transform:rotate(0);} 64%{ transform:rotate(14deg);}
      68%{ transform:rotate(-6deg);} 72%{ transform:rotate(14deg);} 76%{ transform:rotate(-4deg);} 82%{ transform:rotate(0);}
    }
    @keyframes rlStR{
      0%,18%,100%{ transform:rotate(0);} 22%{ transform:rotate(-3deg);} 26%{ transform:rotate(8deg);}
      30%{ transform:rotate(-3deg);} 34%,60%{ transform:rotate(0);} 64%{ transform:rotate(-6deg);}
      68%{ transform:rotate(14deg);} 72%{ transform:rotate(-6deg);} 76%{ transform:rotate(14deg);} 82%{ transform:rotate(0);}
    }
    /* ท่าคลิก: แว่นขยายซูมเข้าหา + ประกายทอง + หนวดหมุนติ้ว */
    .rl-mono-x{ transform-box:fill-box; transform-origin:50% 50%;
                animation:rlZoom .56s cubic-bezier(.3,.9,.35,1) forwards; }
    @keyframes rlZoom{
      0%  { transform:scale(1) translate(0,0); opacity:1; }
      28% { transform:scale(1.42) translate(-6px,-5px); opacity:1; }
      60% { transform:scale(1.85) translate(-9px,-8px); opacity:1; }
      100%{ transform:scale(2.5) translate(-12px,-11px); opacity:0; }
    }
    .rl-flash{ transform-box:fill-box; transform-origin:50% 50%; animation:rlFlash .56s ease-out forwards; }
    @keyframes rlFlash{
      0%,25%{ transform:scale(.3); opacity:0; }
      55%{ transform:scale(1.15); opacity:.9; }
      100%{ transform:scale(2.1); opacity:0; }
    }


    /* ---- ตัวการ์ตูน "ภาพรวม": กระบอกกราฟ ---- */
    .db-fb{ transform-box:fill-box; }
    .db-look{ animation:dbLook 4s ease-in-out infinite; }
    .db-blink{ transform-origin:50% 50%; animation:dbBlink 4s ease-in-out infinite; }
    @keyframes dbLook{
      0%,10%{ transform:translate(0,0);} 16%,28%{ transform:translate(-4px,2px);}
      34%,46%{ transform:translate(4px,2px);} 52%,60%{ transform:translate(-3px,3px);}
      68%,100%{ transform:translate(0,0);}
    }

/* ======================================================
   หลอดแสดงความจุที่ใช้ไป (Storage widget)
   - Firestore: ไม่มี API สาธารณะให้เช็คขนาดจริงแบบเรียลไทม์จากฝั่ง client
     (ต้องใช้ Cloud Monitoring API + service account ซึ่งไม่ปลอดภัยถ้าฝังไว้ในเว็บสาธารณะ)
     จึงใช้วิธี "ประมาณการ" จากขนาดข้อมูลจริงที่ sync เข้ามาแบบเรียลไทม์อยู่แล้ว (parts/history/machines/pr_requests)
     เทียบกับโควตาฟรีของ Firestore (Spark plan) = 1 GiB
   - Google Drive: ดึงโควตาจริงผ่าน Google Apps Script เดิมที่ใช้อัปโหลดไฟล์ PR อยู่แล้ว
     (ต้องเพิ่ม action "quota" ในสคริปต์ฝั่ง Apps Script — ดูคำแนะนำท้ายไฟล์ README ที่แนบมา)
   ====================================================== */
const FIRESTORE_FREE_LIMIT_BYTES = 1 * 1024 * 1024 * 1024; // 1 GiB (Spark/free plan)
let driveQuota = null;      // { used, limit, usageInDrive } from Apps Script, or null if not wired up / failed
let driveQuotaErr = false;
let storageWidgetOpen = false;
let storageWidgetRefreshing = false;

function formatBytes(bytes){
  if (!isFinite(bytes) || bytes < 0) return "0 B";
  const units = ["B","KB","MB","GB","TB"];
  let i = 0, v = bytes;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
}

function estimateFirestoreBytes(){
  try {
    const payload = JSON.stringify(parts) + JSON.stringify(history) + JSON.stringify(machines) + JSON.stringify(prRequests);
    return new Blob([payload]).size;
  } catch { return 0; }
}

async function refreshDriveQuota(){
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("วางลิงก์")) { driveQuota = null; driveQuotaErr = false; return; }
  storageWidgetRefreshing = true; updateStorageWidget();
  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "quota" }),
    });
    const json = await resp.json();
    if (!json.success) throw new Error(json.error || "quota failed");
    driveQuota = { used: Number(json.used || 0), limit: Number(json.limit || 0), usageInDrive: Number(json.usageInDrive || 0) };
    driveQuotaErr = false;
  } catch (e) {
    driveQuotaErr = true;
  } finally {
    storageWidgetRefreshing = false;
    updateStorageWidget();
  }
}

function swLevelColor(pct){
  if (pct >= 90) return "var(--danger)";
  if (pct >= 70) return "var(--warn)";
  return "var(--accent)";
}

function updateStorageWidget(){
  const ring = document.getElementById("swRingFg");
  const pillPct = document.getElementById("swPillPct");
  const fsFill = document.getElementById("swFsFill");
  const fsVal = document.getElementById("swFsVal");
  const drFill = document.getElementById("swDrFill");
  const drVal = document.getElementById("swDrRow");
  const drOff = document.getElementById("swDrOff");
  const refreshBtn = document.getElementById("swRefreshBtn");
  if (!ring) return; // widget not mounted yet

  const fsBytes = estimateFirestoreBytes();
  const fsPct = Math.min(100, (fsBytes / FIRESTORE_FREE_LIMIT_BYTES) * 100);
  fsFill.style.width = fsPct.toFixed(1) + "%";
  fsFill.style.background = swLevelColor(fsPct);
  fsVal.textContent = `${formatBytes(fsBytes)} / ${formatBytes(FIRESTORE_FREE_LIMIT_BYTES)} (${fsPct.toFixed(1)}%)`;

  let combinedPct = fsPct;
  if (driveQuota && driveQuota.limit > 0) {
    const drPct = Math.min(100, (driveQuota.used / driveQuota.limit) * 100);
    drFill.style.width = drPct.toFixed(1) + "%";
    drFill.style.background = swLevelColor(drPct);
    drVal.style.display = "block";
    drOff.style.display = "none";
    document.getElementById("swDrValTxt").textContent = `${formatBytes(driveQuota.used)} / ${formatBytes(driveQuota.limit)} (${drPct.toFixed(1)}%)`;
    combinedPct = Math.max(fsPct, drPct);
  } else {
    drVal.style.display = "none";
    drOff.style.display = "block";
    drOff.textContent = driveQuotaErr
      ? "ดึงโควตา Google Drive ไม่สำเร็จ — เช็คว่า Apps Script รองรับ action \"quota\" แล้ว"
      : "ยังไม่ได้เชื่อมต่อ Google Drive quota";
  }

  const circumference = 2 * Math.PI * 11; // r=11 in the svg below
  const offset = circumference - (combinedPct / 100) * circumference;
  ring.style.strokeDasharray = circumference.toFixed(2);
  ring.style.strokeDashoffset = offset.toFixed(2);
  ring.style.stroke = swLevelColor(combinedPct);
  pillPct.textContent = combinedPct.toFixed(0) + "%";

  if (refreshBtn) refreshBtn.classList.toggle("spin", storageWidgetRefreshing);
}

        </svg>
      </div>
      <div class="sw-pill-label">พื้นที่ใช้ไป<br><b id="swPillPct">–</b></div>
    </div>
  `;
  document.body.appendChild(el);

  // restore saved position
  try {
    const pos = JSON.parse(localStorage.getItem("wk_storageWidgetPos") || "null");
    if (pos && typeof pos.right === "number" && typeof pos.bottom === "number") {
      el.style.right = pos.right + "px";
      el.style.bottom = pos.bottom + "px";
    }
  } catch {}

  const pill = document.getElementById("swPill");
  let dragging = false, moved = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;

  function toPx(v){ return parseFloat(v) || 0; }

  pill.addEventListener("pointerdown", (e) => {
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    startRight = toPx(getComputedStyle(el).right);
    startBottom = toPx(getComputedStyle(el).bottom);
    pill.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
  });
  pill.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    let right = Math.max(4, Math.min(window.innerWidth - 40, startRight - dx));
    let bottom = Math.max(4, Math.min(window.innerHeight - 40, startBottom - dy));
    el.style.right = right + "px";
    el.style.bottom = bottom + "px";
  });
  pill.addEventListener("pointerup", (e) => {
    dragging = false;
    el.classList.remove("dragging");
    if (moved) {
      localStorage.setItem("wk_storageWidgetPos", JSON.stringify({
        right: toPx(getComputedStyle(el).right), bottom: toPx(getComputedStyle(el).bottom)
      }));
    } else {
      storageWidgetOpen = !storageWidgetOpen;
      el.classList.toggle("open", storageWidgetOpen);
    }
  });

  document.getElementById("swRefreshBtn")?.addEventListener("click", (e) => {
    e.stopPropagation();
    refreshDriveQuota();
  });

  updateStorageWidget();
  refreshDriveQuota();
  setInterval(refreshDriveQuota, 5 * 60 * 1000); // refresh Drive quota every 5 min
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("อ่านไฟล์รูปไม่สำเร็จ"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("โหลดรูปไม่สำเร็จ"));
      img.onload = () => {
        const maxW = 360;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.5));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- custom confirm modal (replaces native confirm()) ---------------- */
function showConfirm(opts){
  const {
    title = "ยืนยันการทำรายการ",
    message = "",
    confirmText = "ยืนยัน",
    cancelText = "ยกเลิก",
    danger = false,
    icon = "ti-help-circle",
  } = typeof opts === "string" ? { message: opts } : opts;

  return new Promise((resolve) => {
    let overlay = document.getElementById("confirmOverlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "confirmOverlay";
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = `
      <div class="confirm-card">
        <div class="confirm-icon${danger ? " danger" : ""}"><i class="ti ${icon}"></i></div>
        <div class="confirm-title">${esc(title)}</div>
        <div class="confirm-msg">${esc(message)}</div>
        <div class="confirm-actions">
          <button class="btn btn-ghost" id="confirmCancelBtn">${esc(cancelText)}</button>
          <button class="btn ${danger ? "btn-confirm-danger" : "btn-confirm-primary"}" id="confirmOkBtn">${esc(confirmText)}</button>
        </div>
      </div>
    `;

    const close = (result) => {
      overlay.classList.remove("open");
      document.removeEventListener("keydown", onKey);
      setTimeout(() => { if (overlay.parentNode) overlay.innerHTML = ""; }, 220);
      resolve(result);
    };
    const onKey = (e) => {
      if (e.key === "Escape") close(false);
      if (e.key === "Enter") close(true);
    };

    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(false); }, { once: true });
    document.addEventListener("keydown", onKey);
    document.getElementById("confirmCancelBtn").addEventListener("click", () => close(false));
    document.getElementById("confirmOkBtn").addEventListener("click", () => close(true));

    requestAnimationFrame(() => overlay.classList.add("open"));
    setTimeout(() => document.getElementById("confirmOkBtn")?.focus(), 60);
  });
}

  aiModelLoadPromise = (async () => {
    try {
      const manifestResp = await fetch(AI_MANIFEST_URL, { cache: "no-store" });
      if (!manifestResp.ok) throw new Error("no manifest");
      const manifest = await manifestResp.json();
      const key = manifest.current;
      const cfg = manifest.versions?.[key];
      if (!cfg) throw new Error("no active version in manifest");
      aiModelConfig = {
        inputSize: cfg.inputSize || 224,
        preprocess: cfg.preprocess || "rescale",
        topK: cfg.topK || 3,
        minConfidence: cfg.minConfidence ?? 0.5,
        label: cfg.label || key,
      };
      const [model, namesResp] = await Promise.all([
        tf.loadLayersModel(cfg.modelUrl),
        fetch(cfg.classNamesUrl, { cache: "no-store" }),
      ]);
      const namesJson = await namesResp.json();
      aiClassNames = Array.isArray(namesJson)
        ? namesJson
        : Object.keys(namesJson).sort((a, b) => Number(a) - Number(b)).map(k => namesJson[k]);
      aiModel = model;
      aiModelStatus = "ready";
      return true;
    } catch (err) {
      // ยังไม่มีโมเดลที่เทรนเอง → ใช้โมเดลฟรี COCO-SSD (80 ชนิด) ไปก่อน
      const ok = await loadFreeFallbackModel();
      if (ok) return true;
      aiModelStatus = manifestErrIsMissing(err) ? "unconfigured" : "error";
      return false;
    }
  })();
  return aiModelLoadPromise;
}
/* ---------- โมเดลฟรี: COCO-SSD (Apache-2.0) ใช้ได้ทันที ---------- */
let cocoLoading = null;
function loadCocoSsdScript(){
  if (window.cocoSsd) return Promise.resolve();
  if (cocoLoading) return cocoLoading;
  cocoLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js";
    s.onload = () => res();
    s.onerror = () => rej(new Error("coco-ssd load failed"));
    document.head.appendChild(s);
  });
  return cocoLoading;
}

async function loadFreeFallbackModel(){
  try {
    aiModelStatus = "loading";
    await loadCocoSsdScript();
    if (!window.cocoSsd) throw new Error("cocoSsd missing");
    // โหลดจากในเครื่องก่อน (เร็ว/ออฟไลน์ได้) ถ้าไม่มีค่อยไป CDN
    try {
      aiModel = await cocoSsd.load({ base: "lite_mobilenet_v2", modelUrl: "./models/coco/model.json" });
    } catch (e) {
      aiModel = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    }
    aiModelConfig = {
      mode: "detect",
      label: "โมเดลฟรี (รู้จัก 80 ชนิด)",
      topK: 4,
      minConfidence: 0.45,
    };
    aiClassNames = null;
    aiModelStatus = "fallback";
    return true;
  } catch (e) {
    aiModelStatus = "error";
    return false;
  }
}

function manifestErrIsMissing(err){
  return /no manifest|no active version/.test(String(err?.message || err));
}

async function runAiInference(imgEl){
  const cfg = aiModelConfig;

  // โหมดโมเดลฟรี: ตรวจจับวัตถุ (คืนกล่อง + ชื่อ)
  if (cfg && cfg.mode === "detect") {
    const preds = await aiModel.detect(imgEl, 20, 0.30);
    if (!preds || !preds.length) return [];
    const merged = new Map();
    preds.forEach(p => {
      const prev = merged.get(p.class) || 0;
      if (p.score * 100 > prev) merged.set(p.class, p.score * 100);
    });
    return [...merged.entries()]
      .map(([name, pct]) => ({ name, pct }))
      .sort((a, b) => b.pct - a.pct)
      .slice(0, cfg.topK);
  }

  const input = tf.tidy(() => {
    let img = tf.browser.fromPixels(imgEl).toFloat();
    img = tf.image.resizeBilinear(img, [cfg.inputSize, cfg.inputSize]);
    if (cfg.preprocess === "rescale") img = img.div(255);
    else if (cfg.preprocess === "mobilenet") img = img.div(127.5).sub(1);
    return img.expandDims(0);
  });
  const output = aiModel.predict(input);
  let values = Array.from(await output.data());
  tf.dispose([input, output]);

  const sum = values.reduce((a, b) => a + b, 0);
  if (Math.abs(sum - 1) > 0.05) { // looks like raw logits, not softmax — normalize
    const exps = values.map(v => Math.exp(v));
    const expSum = exps.reduce((a, b) => a + b, 0);
    values = exps.map(v => v / expSum);
  }

  const ranked = values
    .map((v, i) => ({ name: aiClassNames[i] || `คลาส ${i}`, pct: v * 100 }))
    .sort((a, b) => b.pct - a.pct)
    .slice(0, cfg.topK);
  return ranked;
}

function openAiScan(onPick){
  aiScanCallback = onPick || null;
  aiScanImageSrc = null;
  aiScanResults = null;
  aiScanStage = "camera";
  aiCamError = null;
  mountAiScanFab(); // ensure DOM exists
  const overlay = document.getElementById("aiScanOverlay");
  overlay.classList.add("open");
  renderAiScanBody();
  startAiCamera();   // เปิดกล้องทันที — ไม่โหลดโมเดลตอนเปิด (กันแอปค้าง/จอดำ)
}

function closeAiScan(){
  const overlay = document.getElementById("aiScanOverlay");
  overlay?.classList.remove("open");
  stopAiCamera();
}

async function startAiCamera(){
  stopAiCamera();
  try {
    aiScanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    const video = document.getElementById("aiScanVideo");
    if (video) { video.srcObject = aiScanStream; await video.play().catch(() => {}); }
    aiCamError = null;
  } catch (e) {
    aiScanStream = null;
    aiCamError = (e && e.name) ? e.name : "camera-error";
    if (aiScanStage === "camera") renderAiScanBody();   // กันกล่องดำเงียบๆ
  }
}
function stopAiCamera(){
  aiScanStream?.getTracks().forEach(t => t.stop());
  aiScanStream = null;
}

function captureAiPhoto(){
  const video = document.getElementById("aiScanVideo");
  // กล้องไม่ขึ้น (ไม่อนุญาต / เครื่องไม่มีกล้อง) → เปิดคลังภาพแทน ไม่ให้ปุ่มเงียบ
  if (!video || !video.videoWidth) {
    pickAiImage(true);   // กล้องไม่ขึ้น → เปิดกล้องเครื่องผ่าน file picker
    return;
  }
  const canvas = document.createElement("canvas");
  const size = Math.min(video.videoWidth, video.videoHeight);
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, 0, 0, size, size);
  aiScanImageSrc = canvas.toDataURL("image/jpeg", 0.9);
  stopAiCamera();
  runAiScanOnCurrentImage();
}

/* เปิดตัวเลือกไฟล์แบบสดๆ ทุกครั้ง — ไม่พึ่ง input ที่อาจถูกวาดใหม่ทับ */
function pickAiImage(fromCamera){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  if (fromCamera) inp.capture = "environment";
  inp.style.display = "none";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (f) handleAiFile(f);
    inp.remove();
  };
  document.body.appendChild(inp);
  inp.click();
}

function handleAiFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    aiScanImageSrc = reader.result;
    stopAiCamera();
    runAiScanOnCurrentImage();
  };
  reader.readAsDataURL(file);
}

async function runAiScanOnCurrentImage(){
  aiScanStage = "loading";
  renderAiScanBody();

  const t0 = Date.now();
  const tick = setInterval(() => {
    const el = document.getElementById("aiLoadTxt");
    if (el) el.textContent = `กำลังเตรียมโมเดล… ${Math.round((Date.now() - t0) / 1000)} วิ (ครั้งแรกครั้งเดียว)`;
  }, 400);

  const ok = await ensureAiModelLoaded();
  clearInterval(tick);

  if (!ok) {                       // โหลดไม่สำเร็จ → คงรูปไว้ให้เห็น + ปุ่มลองใหม่
    aiScanStage = "error";
    renderAiScanBody();
    return;
  }

  const imgEl = document.createElement("img");
  imgEl.src = aiScanImageSrc;
  await new Promise((res) => { imgEl.onload = res; });
  try {
    aiScanResults = await runAiInference(imgEl);
  } catch {
    aiScanResults = null;
  }
  aiScanStage = "result";
  renderAiScanBody();
}

function retakeAiPhoto(){
  aiScanImageSrc = null;
  aiScanResults = null;
  aiScanStage = "camera";
  renderAiScanBody();
  startAiCamera();
}

function renderAiScanBody(){
  const body = document.getElementById("aiScanBody");
  if (!body) return;

  let stageHtml = "";
  if (aiScanStage === "camera") {
    stageHtml = `
      <div class="ai-scan-stage">
        ${aiCamError
          ? `<div class="ai-scan-placeholder">
               <i class="ti ti-camera-off"></i>
               เปิดกล้องไม่ได้ (${esc(aiCamError)})<br>
               <span style="font-size:11.5px">กด “เลือกจากคลังภาพ” แทนได้เลย</span>
             </div>`
          : `<video id="aiScanVideo" playsinline muted autoplay></video>
             <svg class="ai-scan-guide" viewBox="0 0 100 100" preserveAspectRatio="none">
               <circle cx="50" cy="50" r="30" vector-effect="non-scaling-stroke"></circle>
             </svg>
             <div class="ai-scan-hint">จัดอะไหล่ให้อยู่กลางวงกลม แล้วถ่ายภาพ</div>`}
      </div>
      ${aiModelStatus === "unconfigured" ? `<div class="ai-low-conf">⚠️ ยังไม่ได้ตั้งค่าโมเดล AI (ไม่พบ models/manifest.json)</div>` : ""}
      ${aiModelStatus === "loading" ? `<div class="ai-hint-free"><i class="ti ti-loader"></i> กำลังเตรียมโมเดล… ครั้งแรกอาจใช้ 10–20 วิ</div>` : ""}
      ${aiModelStatus === "fallback" ? `<div class="ai-hint-free"><i class="ti ti-info-circle"></i> โหมดทดลอง — ใช้โมเดลฟรี 80 ชนิด (ยังไม่ใช่โมเดลอะไหล่)</div>` : ""}
      ${aiModelStatus === "error" ? `<div class="ai-low-conf">⚠️ โหลดโมเดลไม่สำเร็จ — ตรวจเน็ตแล้วลองกด “ถ่ายรูป” อีกครั้ง</div>` : ""}
      <div class="ai-scan-controls">
        <button class="btn btn-ai-capture" id="btnAiCapture"><i class="ti ti-camera"></i> ถ่ายรูป</button>
        <button class="btn btn-ghost" id="btnAiPickFile"><i class="ti ti-photo"></i> เลือกจากคลังภาพ</button>
      </div>
      <input type="file" accept="image/*" id="aiFileInput">
    `;
  } else if (aiScanStage === "loading") {
    stageHtml = `
      <div class="ai-scan-stage"><img src="${aiScanImageSrc}"></div>
      <div class="ai-scan-loading"><div class="ai-spinner"></div><span id="aiLoadTxt">กำลังเตรียมโมเดล…</span></div>
    `;
  } else if (aiScanStage === "error") {
    stageHtml = `
      <div class="ai-scan-stage"><img src="${aiScanImageSrc}"></div>
      <div class="ai-low-conf">⚠️ โหลดโมเดลไม่สำเร็จ — ตรวจเน็ตแล้วลองอีกครั้ง<br>
        <span style="font-size:11px">ครั้งแรกต้องโหลด ~18 MB (ถ้าอัปโฟลเดอร์ models/ ขึ้นเว็บแล้วจะเร็วมาก)</span></div>
      <div class="ai-scan-controls">
        <button class="btn btn-ai-capture" id="btnAiRetryModel"><i class="ti ti-refresh"></i> ลองโหลดใหม่</button>
        <button class="btn btn-ghost" id="btnAiRetake"><i class="ti ti-camera"></i> เลือกรูปใหม่</button>
      </div>
    `;
  } else if (aiScanStage === "result") {
    const top = aiScanResults?.[0];
    const lowConf = !top || top.pct < (aiModelConfig?.minConfidence ?? 0.5) * 100;
    const circumference = 2 * Math.PI * 25;
    const offset = top ? circumference - (top.pct / 100) * circumference : circumference;
    stageHtml = `
      <div class="ai-scan-stage"><img src="${aiScanImageSrc}"></div>
      ${top ? `
        <div class="ai-result">
          <div class="ai-result-top">
            <div class="ai-result-ring">
              <svg viewBox="0 0 60 60">
                <circle class="bg" cx="30" cy="30" r="25"></circle>
                <circle class="fg" cx="30" cy="30" r="25" style="stroke-dasharray:${circumference.toFixed(1)};stroke-dashoffset:${offset.toFixed(1)}"></circle>
              </svg>
              <div class="pct">${top.pct.toFixed(0)}%</div>
            </div>
            <div>
              <div class="ai-result-name">${esc(top.name)}</div>
              <div class="ai-result-sub">ความมั่นใจของโมเดล (${esc(aiModelConfig.label)})</div>
            </div>
          </div>
          ${aiScanResults.length > 1 ? `
            <div class="ai-result-list">
              ${aiScanResults.map(r => `
                <div class="ai-result-row">
                  <span class="name">${esc(r.name)}</span>
                  <span class="bar"><div style="width:${r.pct.toFixed(1)}%"></div></span>
                  <span class="val">${r.pct.toFixed(0)}%</span>
                </div>`).join("")}
            </div>` : ""}
          ${lowConf ? `<div class="ai-low-conf">ความมั่นใจค่อนข้างต่ำ ลองถ่ายใหม่ให้ชัดขึ้น หรือเลือกชื่อเองก็ได้</div>` : ""}
          <div class="ai-result-actions">
            <button class="btn btn-ghost" id="btnAiRetake"><i class="ti ti-refresh"></i> ถ่ายใหม่</button>
            <button class="btn btn-ai-capture" id="btnAiUseResult"><i class="ti ti-check"></i> ใช้ชื่อนี้</button>
          </div>
        </div>
      ` : `<div class="ai-low-conf">วิเคราะห์รูปไม่สำเร็จ ลองอีกครั้ง</div>
        <div class="ai-scan-controls"><button class="btn btn-ai-capture" id="btnAiRetake" style="width:100%;">ถ่ายใหม่</button></div>`}
    `;
  }

  body.innerHTML = stageHtml;
  wireAiScanBodyEvents();
  if (aiScanStage === "camera" && aiScanStream) {
    const video = document.getElementById("aiScanVideo");
    if (video) video.srcObject = aiScanStream;
  }
}

function wireAiScanBodyEvents(){ /* ใช้ event delegation บน overlay แทน (กันหลุดหลัง re-render) */ }
function mountAiScanFab(){
  if (document.getElementById("aiScanFab")) return;

  const fab = document.createElement("button");
  fab.id = "aiScanFab";
  fab.innerHTML = `<span class="fab-pulse"></span><i class="ti ti-scan"></i><span class="fab-label">สแกน AI</span>`;
  fab.addEventListener("click", () => openAiScan(null));
  document.body.appendChild(fab);

  const overlay = document.createElement("div");
  overlay.id = "aiScanOverlay";
  overlay.innerHTML = `
    <div class="ai-scan-card">
      <div class="ai-scan-head">
        <div class="ai-scan-title"><i class="ti ti-scan"></i>สแกนอะไหล่ด้วย AI</div>
        <button class="close-btn" id="btnAiScanClose">✕</button>
      </div>
      <div class="ai-scan-body" id="aiScanBody"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) { closeAiScan(); return; }
    const t = e.target.closest?.("#btnAiScanClose,#btnAiCapture,#btnAiPickFile,#btnAiRetake,#btnAiRetryModel,#btnAiUseResult");
    if (!t) return;
    e.stopPropagation();
    switch (t.id){
      case "btnAiScanClose": closeAiScan(); break;
      case "btnAiCapture":   captureAiPhoto(); break;
      case "btnAiPickFile":  pickAiImage(false); break;
      case "btnAiRetake":    retakeAiPhoto(); break;
      case "btnAiRetryModel": aiModelStatus = "idle"; aiModelLoadPromise = null; runAiScanOnCurrentImage(); break;
      case "btnAiUseResult": {
        const name = aiScanResults?.[0]?.name;
        if (name && aiScanCallback) aiScanCallback(name);
        closeAiScan();
        showToast(`เติมชื่อ "${name}" ให้แล้ว ตรวจสอบอีกครั้งก่อนบันทึก`);
        break;
      }
    }
  });

  // รับไฟล์จาก input (delegation — ทน re-render)
  overlay.addEventListener("change", (e) => {
    if (e.target?.id !== "aiFileInput") return;
    const f = e.target.files?.[0];
    if (f) handleAiFile(f);
  });
}

/* ---------------- Scroll index (แถบชื่อเครื่องจักรด้านขวา) ---------------- */
let siRAF = null, siBound = false;

function siUpdate(){
  // หลอดความคืบหน้าการเลื่อนหน้า (%)
  const pctEl = document.getElementById("siPct");
  const fillEl = document.getElementById("siFill");
  if (pctEl && fillEl){
    const max = document.body.scrollHeight - window.innerHeight;
    const pct = max > 0 ? Math.max(0, Math.min(100, Math.round((window.scrollY / max) * 100))) : 0;
    pctEl.textContent = pct + "%";
    fillEl.style.height = pct + "%";
  }

  const items = [...document.querySelectorAll("#scrollIndex .si-item")];
  const groups = document.querySelectorAll(".machine-group[data-group]");
  if (!items.length || !groups.length) return;

  const probe = window.innerHeight * 0.35;
  let active = 0;
  groups.forEach((g, i) => {
    if (g.getBoundingClientRect().top - probe <= 0) active = i;
  });
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 6){
    active = groups.length - 1;
  }

  // กองเลื่อน: ตัวที่กำลังดูอยู่ = ช่องกลาง · ยังไม่ถึง = ล่าง · ผ่านแล้ว = บน
  const listEl = document.querySelector("#scrollIndex .si-list");
  const rowH = items[0] ? items[0].offsetHeight || 46 : 46;
  const windowH = listEl ? listEl.clientHeight : rowH * 5;
  const slots = Math.max(1, Math.round(windowH / rowH));
  const centerY = Math.floor((slots - 1) / 2) * rowH;

  items.forEach((it, i) => {
    const d = i - active;
    const y = centerY + d * rowH;
    it.style.transform = `translateY(${y}px)`;
    const ad = Math.abs(d);
    it.style.opacity = ad === 0 ? 1 : ad === 1 ? 0.55 : ad === 2 ? 0.22 : 0;
    it.style.pointerEvents = ad > 2 ? "none" : "auto";
    it.classList.toggle("active", d === 0);
    it.classList.toggle("passed", d < 0);
  });
}

function siOnScroll(){
  if (siRAF) return;
  siRAF = requestAnimationFrame(() => { siRAF = null; siUpdate(); });
}

function buildScrollIndex(){
  const nav = document.getElementById("scrollIndex");
  if (!nav) return;
  const groups = [...document.querySelectorAll(".machine-group[data-group]")];

  const itemsHtml = groups.map((g, i) => {
    const key = g.dataset.group;
    const label = key === "__unassigned__" ? "ยังไม่ระบุเครื่องจักร" : key;
    return `<button type="button" class="si-item" data-si="${esc(key)}" title="${esc(label)}">
      <span class="si-num">${String(i + 1).padStart(2, "0")}</span>
      <span class="si-label">${esc(label)}</span>
      <span class="si-dot"></span>
    </button>`;
  }).join("");

  nav.innerHTML = `
    <div class="si-list">${itemsHtml}</div>
    <div class="si-progress">
      <span class="si-pct" id="siPct">0%</span>
      <div class="si-track"><div class="si-fill" id="siFill"></div></div>
    </div>`;

  nav.style.display = groups.length ? "" : "none";

  nav.querySelectorAll("[data-si]").forEach(btn => btn.addEventListener("click", () => {
    const key = btn.dataset.si;
    const card = [...document.querySelectorAll(".machine-group[data-group]")]
      .find(el => el.dataset.group === key);
    if (!card) return;
    if (!card.classList.contains("open")) card.querySelector(".mg-toggle")?.click();
    const y = card.getBoundingClientRect().top + window.scrollY - 120;
    window.scrollTo({ top: y, behavior: "smooth" });
    siUpdate();
  }));

  if (!siBound){
    siBound = true;
    window.addEventListener("scroll", siOnScroll, { passive: true });
    window.addEventListener("resize", siOnScroll);
  }
  siUpdate();
}

/* ---------------- สถานะการเปิด/ปิดชั้นเครื่องจักร ---------------- */
let openGroups = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("wk_openGroups") || "null");
    return Array.isArray(v) ? new Set(v) : null;
  } catch (e) { return null; }
})();

function persistGroups(){
  try { localStorage.setItem("wk_openGroups", JSON.stringify([...openGroups])); } catch (e) {}
}

/* ---------------- data actions ---------------- */
async function ensureMachine(name){
  const existing = machines.find(m => m.name.trim().toLowerCase() === name.trim().toLowerCase());
  if (existing) return existing.name;
  try {
    await addDoc(collection(db, "machines"), { name: name.trim(), createdAt: serverTimestamp() });
  } catch (e) {
    showToast("บันทึกเครื่องจักรใหม่ไม่สำเร็จ: " + e.message);
  }
  return name.trim();
}

async function savePart(data){
  saving = true; render();
  try {
    const { id, ...rest } = data;
    if (id) {
      await updateDoc(doc(db, "parts", id), rest);
    } else {
      await addDoc(collection(db, "parts"), { ...rest, createdAt: serverTimestamp() });
    }
    addOpen = false; editPart = null;
  } catch (e) {
    showToast("บันทึกไม่สำเร็จ: " + e.message);
  } finally {
    saving = false; render();
  }
}

async function deletePart(id){

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

async function uploadFileToDrive(file, folderName, jobName){
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("วางลิงก์")) {
    throw new Error("ยังไม่ได้ตั้งค่า Google Apps Script (APPS_SCRIPT_URL) ในโค้ด");
  }
  const base64 = await fileToBase64(file);
  const resp = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
    body: JSON.stringify({
      action: "upload",
      folder: folderName,
      jobName: jobName,
      filename: file.name,
      mimeType: file.type || "application/octet-stream",
      data: base64,
    }),
  });
  const json = await resp.json();
  if (!json.success) throw new Error(json.error || "อัปโหลดไฟล์ไม่สำเร็จ");
  return json.file; // {id, name, url, previewUrl, mimeType}
}

function exportHistoryExcel(fromStr, toStr){
  if (typeof XLSX === "undefined") { showToast("โหลดตัวช่วยสร้าง Excel ไม่สำเร็จ ลองเช็คอินเทอร์เน็ต"); return; }
  let rows = history;
  if (fromStr || toStr) {
    const start = fromStr ? new Date(fromStr + "T00:00:00") : null;
    const end = toStr ? new Date(toStr + "T23:59:59") : new Date(fromStr + "T23:59:59");
    rows = history.filter(h => {
      if (!h.timestamp) return false;
      const d = h.timestamp.toDate ? h.timestamp.toDate() : new Date(h.timestamp);
      if (start && d < start) return false;
      if (end && d > end) return false;
      return true;
    });
  }
  if (rows.length === 0) { showToast("ไม่พบข้อมูลในช่วงที่เลือก"); return; }
  const data = rows.slice().reverse().map(h => ({
    "วันที่เวลา": fmtDate(h.timestamp),
    "ชื่ออะไหล่": h.partName || "",
    "รหัสอะไหล่": h.partCode || "",
    "จำนวนที่เบิก": h.qtyWithdrawn ?? "",
    "เครื่องที่ใช้": h.machine || "",
    "ผู้เบิก": h.by || "",
    "หมายเหตุ": h.note || "",
    "คงเหลือหลังเบิก": h.qtyAfter ?? ""
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:18},{wch:22},{wch:12},{wch:12},{wch:22},{wch:18},{wch:20},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "ประวัติการเบิก");
  const label = (fromStr && toStr && fromStr !== toStr) ? `${fromStr}_ถึง_${toStr}` : (fromStr || "ทั้งหมด");
  XLSX.writeFile(wb, `ประวัติการเบิก_${label}.xlsx`);
}

async function withdraw(part, qty, machine, by, note){
  saving = true; render();
  try {
    await runTransaction(db, async (tx) => {
      const ref_ = doc(db, "parts", part.id);
      const snap = await tx.get(ref_);
      if (!snap.exists()) throw new Error("ไม่พบอะไหล่นี้แล้ว");
      const current = snap.data().qty;
      if (qty > current) throw new Error("คลังเหลือแค่ " + current + " " + snap.data().unit);
      const qtyAfter = current - qty;
      tx.update(ref_, { qty: qtyAfter });
      const histRef = doc(collection(db, "history"));
      tx.set(histRef, {
        partId: part.id, partName: part.name, partCode: part.code,
        qtyWithdrawn: qty, qtyAfter, machine, by, note,
        timestamp: serverTimestamp()
      });
    });
    withdrawPart = null;
  } catch (e) {
    showToast("เบิกไม่สำเร็จ: " + e.message);
  } finally {
    saving = false; render();
  }
}

function fmtDate(ts){
  if (!ts) return "-";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("th-TH") + " " + d.toLocaleTimeString("th-TH", { hour:"2-digit", minute:"2-digit" });
}

/* ======================================================
   พื้นหลัง Circuit Flow (แบบที่ 2) — วาดเฉพาะหน้า login
   หยุดเมื่อออกจากหน้า login / เคารพ prefers-reduced-motion
   ====================================================== */
let circuitRAF = null, circuitCanvasEl = null;

function stopCircuitBg(){
  if (circuitRAF) cancelAnimationFrame(circuitRAF);
  circuitRAF = null; circuitCanvasEl = null;
}

function startCircuitBg(canvas){
  if (!canvas || circuitCanvasEl === canvas) return;
  stopCircuitBg();
  circuitCanvasEl = canvas;

  const ctx = canvas.getContext("2d");
  const STEP = 34;
  let w = 0, h = 0, paths = [], t0 = 0;
  const light = (currentTheme === "light");
  const TRACE = light ? "15,118,110" : "45,212,191";
  const TRACE_A = light ? 0.18 : 0.15;
  const DOT   = light ? "13,148,136" : "110,231,216";
  const PACK  = light ? "13,148,136" : "110,231,216";

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function makePath(){
    let x = Math.floor(Math.random() * Math.max(1, w / STEP)) * STEP + STEP / 2;
    let y = Math.floor(Math.random() * Math.max(1, h / STEP)) * STEP + STEP / 2;
    let horiz = Math.random() < 0.5;
    const segs = 3 + ((Math.random() * 4) | 0);
    const pts = [{ x, y }];
    for (let i = 0; i < segs; i++){
      const len = (1 + ((Math.random() * 3) | 0)) * STEP * (Math.random() < 0.5 ? 1 : -1);
      if (horiz) x = Math.max(6, Math.min(w - 6, x + len));
      else       y = Math.max(6, Math.min(h - 6, y + len));
      pts.push({ x, y });
      horiz = !horiz;
    }
    return { pts, p: Math.random(), sp: 0.0016 + Math.random() * 0.004 };
  }

  function build(){
    const r = canvas.getBoundingClientRect();
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (w < 40 || h < 40) { paths = []; return; }   /* แผงซ้ายถูกซ่อน (มือถือ) */
    const n = Math.max(7, Math.min(26, Math.round(w / 78)));
    paths = Array.from({ length: n }, makePath);
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (const P of paths){
      ctx.strokeStyle = `rgba(${TRACE},${TRACE_A})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(P.pts[0].x, P.pts[0].y);
      for (let i = 1; i < P.pts.length; i++) ctx.lineTo(P.pts[i].x, P.pts[i].y);
      ctx.stroke();

      ctx.fillStyle = `rgba(${DOT},${light ? 0.45 : 0.40})`;
      for (const pt of P.pts){ ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.7, 0, 7); ctx.fill(); }

      P.p += P.sp;
      if (P.p > 1) P.p = 0;
      const total = P.pts.length - 1;
      const pos = P.p * total;
      const i0 = Math.min(total - 1, Math.floor(pos));
      const f = pos - i0;
      const A = P.pts[i0], B = P.pts[i0 + 1];
      const x = A.x + (B.x - A.x) * f, y = A.y + (B.y - A.y) * f;

      const g = ctx.createRadialGradient(x, y, 0, x, y, 11);
      g.addColorStop(0, `rgba(${PACK},${light ? 0.75 : 0.95})`);
      g.addColorStop(0.4, `rgba(${TRACE},${light ? 0.22 : 0.30})`);
      g.addColorStop(1, `rgba(${TRACE},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill();

      ctx.fillStyle = light ? "rgba(255,255,255,0.95)" : "rgba(236,237,239,0.95)";
      ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7); ctx.fill();
    }
  }

  function loop(){
    if (!circuitCanvasEl) return;
    draw();
    circuitRAF = requestAnimationFrame(loop);
  }

  build();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(); return; }
  t0 = performance.now();
  circuitRAF = requestAnimationFrame(loop);

  if (!canvas._lgResize){
    canvas._lgResize = true;
    window.addEventListener("resize", () => { if (circuitCanvasEl === canvas) build(); });
  }
}

let hubIndex = 0;
let hubTurns = 0;
let hubDrag = null;

/* การ์ตูนประจำเมนู + ท่าตอนคลิก (fx) */
const HUB_CHAR = {

function renderHub(isAdmin, isApprove){

/* -------- ตัวการ์ตูนในหัวข้อหน้า: กระโดด/กลิ้งไปมาแบบสุ่ม -------- */
/* ตัวการ์ตูนในหัวข้อ: ไม่ขยับตัวแล้ว — เหลือแค่ตากะพริบ/กวาดตา/คิ้วขยับจาก SVG */
function initNavMascot(){ /* ปิดการกระโดดตามคำขอ (กันเวียนหัว) */ }

let mcEnterBusy = false;

/* คลิกเข้าเมนู: ตัวการ์ตูน "ดีใจ" กระโดด/กลิ้งออกในวงกลม แล้วสลับหน้าทันที */
function enterHubPage(key, idx){
  if (!key || mcEnterBusy) return;

  const go = () => {
    mcEnterBusy = false;
    view = key;
    hubIndex = Number.isFinite(idx) ? idx : 0;
    render();
  };

  const card = (Number.isFinite(idx) ? document.querySelector(`.hub-card[data-idx="${idx}"]`) : null)
            || document.querySelector(".hub-card.is-front");
  const svg = card ? card.querySelector(".hub-mascot") : null;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!svg || reduce || !svg.dataset.fx) { go(); return; }

  mcEnterBusy = true;
  clearTimeout(mcShockTimer);
  svg.classList.remove("lean-l", "lean-r");
  svg.style.transform = "";
  const u = svg.querySelector("use");
  if (u) u.setAttribute("href", svg.dataset.fx);   // ท่าเฉพาะตัว
  setTimeout(go, 560);
}

/* ---------------- วงล้อ: หมุนต่อเนื่อง (วนกลับได้ ไม่ตีกลับ) ---------------- */
function hubCount(){ return document.querySelectorAll(".hub-card").length || 1; }
function hubStepDeg(){ return 360 / hubCount(); }

let hubVisualTimer = 0;

/* อัปเดตเฉพาะ "สถานะที่เห็น" (ไฮไลต์การ์ด/จุด) — เรียกหลังวงล้อหมุนจบเท่านั้น */
function hubVisualState(){
  const cards = [...document.querySelectorAll(".hub-card")];
  const n = cards.length || 1;
  hubIndex = ((hubTurns % n) + n) % n;
  cards.forEach((c, i) => c.classList.toggle("is-front", i === hubIndex));
  document.querySelectorAll(".hub-dot").forEach((d, i) => d.classList.toggle("on", i === hubIndex));
}

function hubApply(animate){
  const ring = document.getElementById("hubRing");
  if (!ring) return;
  const step = hubStepDeg();
  const n = hubCount();

  // อัปเดตดัชนี (logic) ทันที แต่ "ไฮไลต์" ค่อยเปลี่ยนหลังหมุนจบ → ไอคอนไม่กระตุกกลางทาง
  hubIndex = ((hubTurns % n) + n) % n;
  const cnt = document.querySelector(".hub-count");
  if (cnt) cnt.textContent = `${hubIndex + 1} / ${n}`;

  ring.style.transition = animate === false ? "none" : "";
  ring.style.transform = `rotateY(${-hubTurns * step}deg)`;

  if (animate === false){
    hubVisualState();
  } else {
    ring.classList.add("rotating");
    clearTimeout(hubVisualTimer);
    hubVisualTimer = setTimeout(() => {
      const r = document.getElementById("hubRing");
      if (r) r.classList.remove("rotating");
      hubVisualState();
    }, 600);
  }

  // กันค่าองศาสะสมมากเกิน → รีเซ็ตเป็นค่าเทียบเท่าโดยไม่ให้เห็นการกระตุก
  if (Math.abs(hubTurns) > n * 5){
    setTimeout(() => {
      const r = document.getElementById("hubRing");
      if (!r) return;
      hubTurns = hubIndex;
      r.style.transition = "none";
      r.style.transform = `rotateY(${-hubTurns * step}deg)`;
      requestAnimationFrame(() => { const rr = document.getElementById("hubRing"); if (rr) rr.style.transition = ""; });
    }, 720);
  }
}

function hubStep(delta){
  hubTurns += delta;
  hubApply(true);
  if (Date.now() > mcSpinLock) mcInertia(delta > 0 ? 1 : -1);
}

/* กดปุ่มลูกศร = ให้ความรู้สึกเหมือนลากนิ้ว (เอียงค้างก่อน แล้วดีดกลับ) */
let mcSpinLock = 0;
function mcButtonSpin(dir){
  const n = hubCount();
  const el = mcElAt(((hubIndex + dir) % n + n) % n) || mcMascotEl();
  if (!el) return;
  mcSpinLock = Date.now() + 300;
  mcFace(el, true);
  clearTimeout(mcShockTimer);
  el.classList.remove("lean-r", "lean-l", "hop-out");
  el.style.transition = "transform .16s cubic-bezier(.3,.9,.4,1)";
  el.style.transform = dir > 0
    ? "rotate(21deg) translateX(-6px) scale(.96,1.05)"
    : "rotate(-21deg) translateX(6px) scale(.96,1.05)";
  setTimeout(() => {
    el.style.transition = "";
    el.style.transform = "";
    mcInertia(dir);
  }, 190);
}

/* ---- ตัวการ์ตูน: หน้าตกใจ + เอนตามแรงเฉื่อย ---- */
let mcShockTimer = 0;
function mcElAt(i){
  const c = document.querySelector(`.hub-card[data-idx="${i}"]`);
  return c ? c.querySelector(".hub-mascot") : null;
}
function mcMascotEl(){
  return mcElAt(hubIndex)
      || document.querySelector(".hub-card.is-front .hub-mascot")
      || document.querySelector(".hub-card .hub-mascot");
}
function mcKeyOf(el){
  return (el && el.dataset && el.dataset.key) || "inventory";
}
function mcFace(el, shocked){
  if (!el) return;
  const k = mcKeyOf(el);
  const cfg = HUB_CHAR[k] || {};
  const id = shocked ? (cfg.shock || `#mc-${k}-s`) : (cfg.id || `#mc-${k}`);
  const u = el.querySelector("use");
  if (u && u.getAttribute("href") !== id) u.setAttribute("href", id);
}
function mcInertia(dir){
  const el = mcMascotEl();
  if (!el) return;
  const k = mcKeyOf(el);
  mcFace(el, true);
  el.classList.remove("lean-r", "lean-l");
  el.style.transform = "";
  const cls = dir > 0 ? "lean-r" : "lean-l";
  if (k === "inventory"){
    // บอทคลัง: ใช้ท่าเดิมทุกอย่าง (ตามที่สั่ง ห้ามเปลี่ยน)
    el.classList.add(cls);
  } else {
    el.classList.add(cls);
  }
  clearTimeout(mcShockTimer);
  mcShockTimer = setTimeout(() => { mcFace(el, false); el.classList.remove("lean-r", "lean-l"); }, 760);
}

function hubGoto(idx){
  const n = hubCount();
  let diff = idx - hubIndex;
  if (diff > n / 2) diff -= n;
  if (diff < -n / 2) diff += n;
  hubTurns += diff;
  hubApply(true);
}

function bindHub(keys){
  const ring = document.getElementById("hubRing");
  if (!ring) return;
  hubApply(false);

  document.getElementById("hubPrev")?.addEventListener("click", (e) => { e.stopPropagation(); mcButtonSpin(-1); hubStep(-1); });
  document.getElementById("hubNext")?.addEventListener("click", (e) => { e.stopPropagation(); mcButtonSpin(1); hubStep(1); });
  document.querySelectorAll("[data-hubgo]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation(); hubGoto(Number(el.dataset.hubgo));
  }));

  // ล้อเมาส์
  let lock = 0;
  document.getElementById("hubStage")?.addEventListener("wheel", (e) => {
    e.preventDefault();
    const now = Date.now();
    if (now < lock) return;
    lock = now + 240;
    hubStep((e.deltaY > 0 || e.deltaX > 0) ? 1 : -1);
  }, { passive: false });

  // ลาก / ปัด
  let dragging = false, moved = false, startX = 0, startDeg = 0, lastDx = 0, downAt = 0;
  const onDown = (e) => {
    dragging = true; moved = false; lastDx = 0;
    downAt = Date.now();
    startX = e.clientX;
    startDeg = -hubTurns * hubStepDeg();
    ring.style.transition = "none";
  };
  const onMove = (e) => {
    if (!dragging) return;
    lastDx = e.clientX - startX;
    if (Math.abs(lastDx) > 6) moved = true;
    const mel = mcMascotEl();
    if (mel && Math.abs(lastDx) > 4){
      mcFace(mel, true);
      mel.classList.remove("lean-r", "lean-l");
      const tilt = Math.max(-30, Math.min(30, lastDx * 0.16));
      mel.style.transform = `rotate(${tilt}deg) translateX(${-tilt * 0.32}px) scale(.97,1.04)`;
    }
    ring.style.transform = `rotateY(${startDeg + lastDx * 0.32}deg)`;
  };
  const onUp = (e) => {
    if (!dragging) return;
    dragging = false;
    ring.style.transition = "";
    const mel0 = mcMascotEl();
    if (mel0) mel0.style.transform = "";
    const steps = Math.round((lastDx * 0.32) / hubStepDeg());
    hubTurns += steps;
    hubApply(true);
    if (steps) mcInertia(steps > 0 ? 1 : -1);
    else { const m2 = mcMascotEl(); mcFace(m2, false); }
    if (moved) { hubBlockClick(); return; }

    // แตะสั้นบนการ์ดตรงกลาง → เข้าหน้านั้นทันที
    const card = e && e.target && e.target.closest ? e.target.closest(".hub-card") : null;
    if (card && Date.now() - downAt < 600 && Number(card.dataset.idx) === hubIndex){
      hubBlockClick();
      enterHubPage(card.dataset.hub, Number(card.dataset.idx));
    }
  };
  ring.addEventListener("pointerdown", onDown);
  ring.addEventListener("pointermove", onMove);
  ring.addEventListener("pointerup", onUp);
  ring.addEventListener("pointercancel", onUp);
  window.addEventListener("pointerup", onUp);

  // คลิกการ์ด (delegate บน ring)
  ring.addEventListener("click", (e) => {
    const card = e.target.closest(".hub-card");
    if (!card) return;
    if (hubClickBlocked()) return;
    e.stopPropagation();
    const i = Number(card.dataset.idx);
    if (i !== hubIndex) { hubGoto(i); return; }
    enterHubPage(card.dataset.hub, i);
  });

  // คีย์บอร์ด
  document.addEventListener("keydown", hubKeysHandler);
  function hubKeysHandler(e){
    if (!document.getElementById("hubRing")) { document.removeEventListener("keydown", hubKeysHandler); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); hubStep(1); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); hubStep(-1); }
    if (e.key === "Enter") {
      const k = keys[hubIndex];
      if (k) enterHubPage(k, hubIndex);
    }
  }
}

let hubBlockUntil = 0;
function hubBlockClick(){ hubBlockUntil = Date.now() + 320; }
function hubClickBlocked(){ return Date.now() < hubBlockUntil; }

function renderDashboard(low, todayCount){
  // group low-stock items by zone, same convention as the history page:
  // an "all zones" part appears under every zone currently in use; items with no zone go under "unassigned".
  const allKnownZones = [...new Set(parts.flatMap(p => getPartZones(p)).filter(z => z && z !== "__all__"))];
  const zoneGroups = new Map();
  low.forEach(p => {
    const pz = getPartZones(p);
    let targetZones = pz.includes("__all__") ? allKnownZones : pz;
    if (!targetZones || targetZones.length === 0) targetZones = ["__unassigned__"];
    targetZones.forEach(key => {
      if (!zoneGroups.has(key)) zoneGroups.set(key, []);
      zoneGroups.get(key).push(p);
    });
  });
  const zoneKeys = [...zoneGroups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (zoneGroups.has("__unassigned__")) zoneKeys.push("__unassigned__");

  return `
    <div class="stats">
      <div class="stat"><div class="lbl">รายการทั้งหมด</div><div class="val">${parts.length}</div></div>
      <div class="stat"><div class="lbl">ต่ำกว่า min</div><div class="val" style="color:${low.length?'var(--danger)':'var(--accent)'}">${low.length}</div></div>
      <div class="stat"><div class="lbl">เบิกวันนี้</div><div class="val">${todayCount}</div></div>

    ${low.length > 0 ? `
    <div class="section-title"><i class="ti ti-bell-exclamation" style="color:var(--danger);" aria-hidden="true"></i> ต้องสั่งซื้อเพิ่ม</div>
    ${zoneKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const items = zoneGroups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ยังไม่ระบุโซน" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${items.length})</span></div>
        <div class="card-list" style="margin-bottom:10px;">
          ${items.map(lowStockCardHtml).join("")}
        </div>
      </div>`;
    }).join("")}
    ` : ""}

    ${history.length === 0 ? `<div class="empty">ยังไม่มีการเบิกอะไหล่</div>` :

  `;
}

function renderInventory(){
  const allZones = [...new Set(parts.flatMap(p => getPartZones(p)).filter(z => z && z !== "__all__"))].sort((a,b) => a.localeCompare(b, "th"));
  const filtered = parts.filter(p => {
    const pz = getPartZones(p);
    const matchesSearch = (p.name + p.code + (p.machine||"") + pz.join(" ")).toLowerCase().includes(search.toLowerCase());
    const matchesZone = !zoneFilter || pz.includes(zoneFilter) || pz.includes("__all__");
    return matchesSearch && matchesZone;
  });
  const invTopHtml = `
    <div class="inv-bar">
      <div class="inv-search">
        <i class="ti ti-search inv-ico"></i>
        <input id="searchInput" placeholder="ค้นหาชื่อ รหัส หรือเครื่องจักร" value="${esc(search)}">
        ${search ? `<button type="button" class="inv-clear" id="invClear" aria-label="ล้างคำค้น"><i class="ti ti-x"></i></button>` : ""}
      </div>
      <div class="inv-select-wrap">
        <i class="ti ti-map-pin inv-ico-l"></i>
        <select id="zoneFilterSelect" class="inv-select">
          <option value="">ทุกโซน</option>
          ${allZones.map(z => `<option value="${esc(z)}" ${zoneFilter===z?"selected":""}>${esc(z)}</option>`).join("")}
        </select>
        <i class="ti ti-chevron-down inv-chev"></i>
      </div>
      <span class="inv-count">${filtered.length} รายการ</span>
    </div>`;
  if (filtered.length === 0) {
    return `
      ${invTopHtml}
      <div class="empty">ไม่พบอะไหล่ ลองเพิ่มรายการใหม่</div>
    `;
  }

  // group by machine name; parts without a machine go into "unassigned"
  const groups = new Map();
  filtered.forEach(p => {
    const key = p.machine && p.machine.trim() ? p.machine.trim() : "__unassigned__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  const machineKeys = [...groups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (groups.has("__unassigned__")) machineKeys.push("__unassigned__");

  // ตอนค้นหาหรือกรองโซน: กางทุกชั้นให้เห็นผลลัพธ์ทันที
  const forceOpen = Boolean(search || zoneFilter);

  // ครั้งแรกที่เปิด: กางชั้นแรกให้เห็นว่ามีของอยู่ข้างใน
  if (openGroups === null){
    openGroups = new Set(machineKeys.length ? [machineKeys[0]] : []);
    persistGroups();
  }

  return `
    <nav class="scroll-index" id="scrollIndex" aria-label="รายชื่อเครื่องจักร"></nav>

    ${invTopHtml}
    ${machineKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const groupParts = groups.get(key);
      const isOpen = forceOpen || openGroups.has(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""} ${isOpen?"open":""}" data-group="${esc(key)}">
        <button type="button" class="mg-toggle" data-group-toggle="${esc(key)}" aria-expanded="${isOpen?"true":"false"}">
          <span class="mg-name">${isUnassigned ? "ยังไม่ระบุเครื่องจักร" : esc(key)}</span>
          <span class="mg-count mono">${groupParts.length}</span>
          <i class="ti ti-chevron-down mg-chev" aria-hidden="true"></i>
        </button>
        <div class="mg-body-wrap">
          <div class="mg-body">
            <div class="parts-grid">
              <div class="hg-wrap">
                <div class="hg-strip" data-hg="${esc(key)}">${groupParts.map(partCardHtml).join("")}</div>
                <button type="button" class="hg-arrow left" data-hg-left="${esc(key)}" aria-label="เลื่อนซ้าย"><i class="ti ti-chevron-left"></i></button>
                <button type="button" class="hg-arrow right" data-hg-right="${esc(key)}" aria-label="เลื่อนขวา"><i class="ti ti-chevron-right"></i></button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }).join("")}
  `;
}


/* =====================================================================
   HORIZONTAL PART STRIP — แต่ละกลุ่มเครื่องเลื่อนซ้าย/ขวาของใครของมัน
   ===================================================================== */
function bindHgStrips(){
  document.querySelectorAll(".hg-strip").forEach(strip => {
    if (strip.dataset.bound === "1") return;
    strip.dataset.bound = "1";
    const wrap = strip.closest(".hg-wrap");
    const leftBtn = wrap ? wrap.querySelector("[data-hg-left]") : null;
    const rightBtn = wrap ? wrap.querySelector("[data-hg-right]") : null;

    const step = () => {
      const card = strip.querySelector(".part-card");
      return card ? card.getBoundingClientRect().width + 14 : 320;
    };

    leftBtn?.addEventListener("click", (e) => {
      e.stopPropagation();
      strip.scrollBy({ left: -step(), behavior: "smooth" });
    });
    rightBtn?.addEventListener("click", (e) => {
      e.stopPropagation();
      strip.scrollBy({ left: step(), behavior: "smooth" });
    });

    // เน้นการ์ดที่อยู่กลางแถว + ซ่อนลูกศรเมื่อสุดขอบ
    const sync = () => {
      const max = strip.scrollWidth - strip.clientWidth;
      if (leftBtn) leftBtn.classList.toggle("off", strip.scrollLeft <= 2);
      if (rightBtn) rightBtn.classList.toggle("off", strip.scrollLeft >= max - 2);

      const cards = [...strip.querySelectorAll(".part-card")];
      // ใบที่อยู่กลางแถวมากที่สุด = ใบที่ถูกเน้น
      const mid = strip.scrollLeft + strip.clientWidth / 2;
      let best = null, bestD = Infinity;
      cards.forEach(c => {
        const cc = c.offsetLeft + c.offsetWidth / 2;
        const d = Math.abs(cc - mid);
        if (d < bestD) { bestD = d; best = c; }
        c.classList.remove("is-center");
      });
      if (best) best.classList.add("is-center");
    };

    // ตำแหน่งเริ่มต้น: ถ้าเคยเลื่อนไว้ → คืนค่าเดิม, ถ้าไม่เคย → กลางแถว
    const stripKey = strip.dataset.hg || "";
    const cardsNow = [...strip.querySelectorAll(".part-card")];
    const startIdx = cardsNow.length >= 3 ? Math.floor(cardsNow.length / 2) : 0;
    const centerOn = (idx) => {
      const c = cardsNow[idx];
      if (!c) return;
      return Math.max(0, c.offsetLeft - (strip.clientWidth - c.offsetWidth) / 2);
    };
    const saved = hgScrollPos.get(stripKey);
    const applyPos = () => {
      if (saved !== undefined) strip.scrollLeft = saved;
      else if (startIdx > 0) strip.scrollLeft = centerOn(startIdx) || 0;
    };
    applyPos();
    requestAnimationFrame(applyPos);
    setTimeout(applyPos, 120);

    let raf = 0;
    strip.addEventListener("scroll", () => {
      hgScrollPos.set(stripKey, strip.scrollLeft);   // จำตำแหน่งไว้
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(sync);
    }, { passive: true });
    requestAnimationFrame(sync);
    setTimeout(sync, 120);
    setTimeout(sync, 420);

    // ลากด้วยเมาส์ (จอสัมผัสใช้การปัดของเบราว์เซอร์อยู่แล้ว)
    /* ---------- ตรวจจับ "แตะจริง" vs "ลาก/ปัด/กดค้าง" ---------- */
    const g = { at: 0, x: 0, y: 0, scroll: 0, moved: false };
    const blockClicks = () => { hgSuppressUntil = Date.now() + 420; };

    strip.addEventListener("pointerdown", (e) => {
      g.at = Date.now();
      g.x = e.clientX; g.y = e.clientY;
      g.scroll = strip.scrollLeft;
      g.moved = false;
    }, { passive: true });

    strip.addEventListener("pointermove", (e) => {
      if (!g.at || g.moved) return;
      if (Math.abs(e.clientX - g.x) > 8 || Math.abs(e.clientY - g.y) > 8) g.moved = true;
    }, { passive: true });

    strip.addEventListener("pointerup", () => {
      if (!g.at) return;
      const held = Date.now() - g.at;
      const scrolled = Math.abs(strip.scrollLeft - g.scroll) > 6;
      // ลาก / เลื่อน / กดค้างเกิน 600ms  → ไม่ต้องเปิดอะไร
      if (g.moved || scrolled || held > 600) blockClicks();
      g.at = 0;
    });

    strip.addEventListener("pointercancel", () => {
      blockClicks();
      g.at = 0;
    });

    // ถ้าแถวเลื่อนระหว่างนิ้วยังกดอยู่ = ถือว่าลาก
    strip.addEventListener("scroll", () => {
      if (g.at) g.moved = true;
    }, { passive: true });

    /* ---------- ลากด้วยเมาส์ ---------- */
    let down = false, moved = false, startX = 0, startScroll = 0;
    strip.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch") return;
      if (e.target.closest("[data-withdraw],[data-edit]")) return;
      down = true; moved = false;
      startX = e.clientX; startScroll = strip.scrollLeft;
      strip.classList.add("dragging");
    });
    strip.addEventListener("pointermove", (e) => {
      if (!down) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 4) moved = true;
      if (moved) strip.scrollLeft = startScroll - dx;
    });
    const end = () => {
      if (!down) return;
      down = false;
      strip.classList.remove("dragging");
      if (moved) {
        const cards = [...strip.querySelectorAll(".part-card")];
        const mid = strip.scrollLeft + strip.clientWidth / 2;
        let best = null, bestD = Infinity;
        cards.forEach(c => {
          const cc = c.offsetLeft + c.offsetWidth / 2;
          const d = Math.abs(cc - mid);
          if (d < bestD) { bestD = d; best = c; }
        });
        if (best) {
          const target = best.offsetLeft - (strip.clientWidth - best.offsetWidth) / 2;
          strip.scrollTo({ left: Math.max(0, target), behavior: "smooth" });
        }
      }
      moved = false;
    };
    strip.addEventListener("pointerup", end);
    strip.addEventListener("pointerleave", end);
    strip.addEventListener("pointercancel", end);

    // กันคลิกช่วงที่เพิ่งลาก/ปัดเสร็จ (capture phase)
    strip.addEventListener("click", (e) => {
      if (hgClickBlocked()) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  });
}
