<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpareCube</title>
<link rel="manifest" href="manifest.json?v=3">
<meta name="theme-color" content="#14161A">
<script>
  /* ตั้งธีมก่อนวาดหน้า จะได้ไม่กระพริบ */
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('wk_theme') || 'dark'); } catch (e) {}
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpareCube">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#14161A; --panel:#1B1E23; --panelAlt:#22262C; --border:#2C3139;
    --text:#ECEDEF; --muted:#878D97; --mutedFaint:#5B6068;
    --accent:#2DD4BF; --accentDim:#134E4A; --warn:#F5A623; --warnDim:#4A3413;
    --danger:#F0473E; --dangerDim:#4A1613; --machine:#3B82F6; --machineDim:#152A4A;
  }
  *{box-sizing:border-box;}
  html{overscroll-behavior:none;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Prompt',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  #bgParticles{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;}

  #doorLightBurst{
    position:fixed; inset:0; z-index:39; pointer-events:none;
    background:radial-gradient(circle at 50% 55%, rgba(160,255,240,0.55), rgba(45,212,191,0.18) 35%, transparent 65%);
    opacity:0; transform:scale(0.6);
  }
  #doorLightBurst.burst{ animation:doorBurst 1.1s ease-out forwards; }
  @keyframes doorBurst{
    0%{ opacity:0; transform:scale(0.5); }
    35%{ opacity:1; transform:scale(1.05); }
    100%{ opacity:0; transform:scale(1.6); }
  }

  #warehouseDoor{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    touch-action:none; cursor:grab;
    will-change:transform;
  }
  #warehouseDoor.dragging{ cursor:grabbing; }
  #warehouseDoor.snapping{ transition:transform .38s cubic-bezier(.34,1.2,.4,1); }
  #warehouseDoor.opening{ transition:transform .62s cubic-bezier(.5,0,.3,1); }
  .door-slats{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(45,212,191,0.05), transparent 30%),
      repeating-linear-gradient(180deg, #1E2229 0px, #1E2229 22px, #171A1F 22px, #171A1F 24px),
      #14161A;
    border-bottom:3px solid #2C3139;
  }
  .door-siren{
    position:absolute; left:0; right:0; height:6px; z-index:1;
    background:repeating-linear-gradient(90deg, #F5A623 0 22px, transparent 22px 44px);
    animation:doorSirenPulse 1.6s ease-in-out infinite;
  }
  .door-siren-top{ top:0; }
  .door-siren-bottom{ bottom:3px; }
  @keyframes doorSirenPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:.95; }
  }
  .door-handle-wrap{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    user-select:none; -webkit-user-select:none;
  }
  .door-handle{
    width:76px; height:44px; border-radius:10px;
    background:linear-gradient(180deg, #2C3139, #1B1E23);
    border:1px solid #3A4048;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    animation:doorHandleHint 1.8s ease-in-out infinite;
  }
  @keyframes doorHandleHint{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .door-hint{ color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.2px; }
  .door-hint-arrow{ color:var(--accent); font-size:16px; opacity:.8; animation:doorHandleHint 1.8s ease-in-out infinite; }
  #warehouseDoor.dragging .door-handle,
  #warehouseDoor.dragging .door-hint-arrow{ animation:none; }
  #warehouseDoor.hidden{ display:none; }
  @keyframes doorShake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    20%{ transform:translateX(-6px) rotate(-0.4deg); }
    40%{ transform:translateX(5px) rotate(0.4deg); }
    60%{ transform:translateX(-4px) rotate(-0.3deg); }
    80%{ transform:translateX(3px) rotate(0.2deg); }
  }
  #warehouseDoor.shake .door-slats{ animation:doorShake .45s ease-in-out; }
  #app{position:relative;z-index:1;}
  .head{font-family:'Prompt',sans-serif;}
  .mono{font-family:'Prompt',sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px;}
  .topbar{position:sticky;top:0;background:radial-gradient(ellipse at 8% 50%, rgba(45,212,191,0.18), transparent 60%), var(--bg);border-bottom:1px solid var(--border);z-index:20;}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:20px 24px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{border-radius:0;box-shadow:none;}
  .brand-icon-wrap{position:relative;display:inline-block;border-radius:0;overflow:visible;flex-shrink:0;animation:none;}
  .brand-icon-wrap img{display:block;box-shadow:none !important;}
  .brand-icon-wrap::after{ display:none !important; content:none;
    content:"";
    position:absolute; left:0; right:0; height:40%;
    background:linear-gradient(180deg, transparent, rgba(160,255,240,0.9), transparent);
    animation:brandScanSweep 2.8s ease-in-out infinite;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  @keyframes brandScanSweep{
    0%{ transform:translateY(-120%); opacity:0; }
    12%{ opacity:1; }
    50%{ transform:translateY(220%); opacity:1; }
    62%{ opacity:0; }
    100%{ transform:translateY(220%); opacity:0; }
  }
  @keyframes brandGlowPulse{
    0%,100%{ box-shadow:0 0 10px #2DD4BF44; }
    50%{ box-shadow:0 0 22px #2DD4BF99; }
  }
  .brand-title-cube{
    background:linear-gradient(90deg,#2DD4BF,#ECEDEF,#6EE7D8,#2DD4BF);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:brandShimmer 4.5s linear infinite;
  }
  @keyframes brandShimmer{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  @media (max-width:480px){
    .topbar-inner{padding:14px 14px 0;}
    .row{flex-wrap:wrap;row-gap:10px;}
    .brand img{width:34px !important;height:34px !important;border-radius:0;}
    .brand-icon-wrap{border-radius:0;}
    .brand .head{font-size:17px !important;}
    #btnAdd{padding:8px 10px;font-size:12px;white-space:nowrap;}
    .row > div:last-child{gap:8px !important;}
  }
  .btn{border:none;cursor:pointer;font-family:'Prompt',sans-serif;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
  .btn-accent{background:var(--accent);color:#0A0C0E;}
  .btn-ghost{background:var(--panelAlt);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--dangerDim);color:var(--danger);border:1px solid #F0473E44;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);}
  .tab{background:none;border:none;color:var(--muted);padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transform:scale(1);transform-origin:center;transition:color .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1), border-color .25s ease;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);transform:scale(1.1);}
  .badge{background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-family:'Prompt',sans-serif;}
  .tabs{gap:6px;padding:6px;margin:10px 0 6px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs .tab{flex:0 0 auto;padding:9px 15px;border:none;border-radius:11px;font-size:13.5px;gap:7px;transform:none;transition:background .2s ease,color .2s ease,box-shadow .2s ease;}
  .tabs .tab i{font-size:17px;}
  .tabs .tab:hover{color:var(--text);background:rgba(255,255,255,.06);}
  .tabs .tab:active{transform:scale(.96);}
  .tabs .tab.active{color:#0B1614;background:linear-gradient(135deg,var(--accent),#14b8a6);box-shadow:0 4px 16px rgba(45,212,191,.32);transform:none;animation:tabPop .3s cubic-bezier(.22,1.3,.36,1);}
  .tabs .tab .badge{margin-left:2px;box-shadow:0 0 0 2px var(--panel);}
  @keyframes tabPop{from{transform:scale(.9);}to{transform:scale(1);}}
  .content{padding-top:20px;}
  .view-enter{animation:viewEnter .34s cubic-bezier(.22,1,.36,1);}
  @keyframes viewEnter{
    from{ opacity:0; transform:translateX(18px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .stat .lbl{color:var(--muted);font-size:11px;}
  .stat .val{font-family:'Prompt',sans-serif;font-size:24px;margin-top:6px;}
  .section-title{font-family:'Prompt',sans-serif;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .card-list{display:flex;flex-direction:column;gap:8px;}
  .low-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--dangerDim);border:1px solid #F0473E44;border-radius:10px;}
  .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--panelAlt);}
  .thumb-ph{width:40px;height:40px;border-radius:8px;background:var(--panelAlt);display:flex;align-items:center;justify-content:center;color:var(--mutedFaint);flex-shrink:0;font-size:16px;}
  .grow{flex:1;min-width:0;}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search{position:relative;margin-bottom:16px;}
  .search input{width:100%;padding:10px 12px 10px 36px;}
  .search .icon{position:absolute;left:12px;top:11px;color:var(--mutedFaint);}
  input,textarea,select{background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Prompt',sans-serif;font-size:14px;outline:none;width:100%;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  label.field{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field-wrap{margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .parts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:600px){.parts-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.parts-grid{grid-template-columns:repeat(4,1fr);}}
  .part-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .part-photo{aspect-ratio:4/3;background:var(--panelAlt);position:relative;display:flex;align-items:center;justify-content:center;color:var(--mutedFaint);}
  .part-photo img{width:100%;height:100%;object-fit:cover;}
  .edit-btn{position:absolute;top:6px;right:6px;background:rgba(20,22,26,.75);border:none;border-radius:6px;padding:5px;cursor:pointer;color:var(--text);}
  .part-body{padding:12px;}
  .part-name{font-size:15px;font-weight:600;}
  .part-code{color:var(--mutedFaint);font-size:12px;font-family:'Prompt',sans-serif;margin-bottom:8px;}
  .machine-tag{color:var(--machine);font-size:11.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:4px;}
  .machine-select-row{display:flex;gap:8px;}
  .machine-select-row select{flex:1;}
  .machine-add-inline{margin-top:8px;display:flex;gap:8px;}
  .pill-group{display:flex;flex-wrap:wrap;gap:8px;}
  .pr-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  .pr-table{width:100%;border-collapse:collapse;min-width:820px;}
  .pr-table th{background:var(--panelAlt);color:var(--muted);font-size:11px;text-align:left;padding:8px;white-space:nowrap;font-weight:600;}
  .pr-table td{padding:6px 8px;border-top:1px solid var(--border);}
  .pr-table input{width:100%;background:var(--panelAlt);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;color:var(--text);box-sizing:border-box;}
  .pr-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .pr-attach-row{display:flex;align-items:center;gap:8px;background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
  .machine-add-inline input{flex:1;}
  .machine-add-inline button{white-space:nowrap;}
  .machine-group{border:1.5px solid var(--machine);border-radius:14px;padding:14px 14px 4px;margin-bottom:18px;background:#3B82F60A;}
  .machine-group.unassigned{border:1.5px dashed var(--border);background:transparent;}
  .machine-group-title{color:var(--machine);font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .machine-group.unassigned .machine-group-title{color:var(--mutedFaint);}
  .zoomable{cursor:zoom-in;touch-action:manipulation;}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(8,9,11,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:lightboxFadeIn .22s ease;}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;animation:lightboxPopIn .28s cubic-bezier(.22,1,.36,1);}
  .lightbox-close{position:absolute;top:16px;right:20px;background:rgba(20,22,26,.75);border:none;border-radius:8px;padding:8px 12px;color:var(--text);font-size:18px;cursor:pointer;}
  @keyframes lightboxFadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes lightboxPopIn{
    from{ opacity:0; transform:scale(.88); }
    to{ opacity:1; transform:scale(1); }
  }
  .gauge-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px;}
  .gauge-bar{background:var(--panelAlt);height:4px;border-radius:2px;overflow:hidden;}
  .gauge-fill{height:100%;transition:width .3s;}
  .withdraw-btn{width:100%;margin-top:10px;padding:8px 0;background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
  .withdraw-btn i{color:var(--accent);font-size:14px;}
  .btn i{font-size:14px;}
  .btn-accent i{color:#0A0C0E;}
  .empty{text-align:center;padding:40px 0;color:var(--mutedFaint);font-size:13px;}
  .hist-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
  .hist-icon{background:var(--panelAlt);border-radius:8px;padding:8px;display:flex;color:var(--accent);font-size:15px;}
  .overlay{position:fixed;inset:0;background:rgba(10,11,13,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.overlay{align-items:center;}}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
  @media(min-width:600px){.modal{border-radius:16px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
  .modal-body{padding:20px;}
  .close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}
  .photo-picker{width:120px;height:120px;border-radius:12px;background:var(--panelAlt);border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mutedFaint);cursor:pointer;margin:0 auto 16px;overflow:hidden;}
  .photo-picker img{width:100%;height:100%;object-fit:cover;}
  .err-text{color:var(--danger);font-size:12px;margin-bottom:12px;}
  .notice{padding:14px;background:var(--warnDim);border:1px solid #F5A62344;border-radius:10px;margin-bottom:20px;font-size:12.5px;color:#F0D3A0;line-height:1.6;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  a{color:var(--accent);}
  .login-screen{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(45,212,191,0.13), transparent 55%),
      radial-gradient(circle at 90% 85%, rgba(124,58,237,0.08), transparent 50%),
      repeating-linear-gradient(0deg, rgba(45,212,191,0.05) 0, rgba(45,212,191,0.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(45,212,191,0.05) 0, rgba(45,212,191,0.05) 1px, transparent 1px, transparent 42px),
      radial-gradient(rgba(45,212,191,0.16) 1px, transparent 1.2px) 0 0/26px 26px;
  }

  /* ---------------- storage usage widget (draggable) ---------------- */
  #storageWidget{
    position:fixed; z-index:60; touch-action:none; user-select:none;
    right:16px; bottom:22px;
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
  }
  #storageWidget.dragging .sw-pill{ cursor:grabbing; box-shadow:0 8px 26px rgba(0,0,0,.55); }
  .sw-pill{
    display:flex; align-items:center; gap:9px; cursor:grab;
    background:linear-gradient(160deg, var(--panel), var(--panelAlt));
    border:1px solid var(--border); border-radius:999px;
    padding:8px 14px 8px 10px; box-shadow:0 4px 16px rgba(0,0,0,.4);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .sw-pill:active{ transform:scale(.97); }
  .sw-ring{ position:relative; width:30px; height:30px; flex-shrink:0; }
  .sw-ring svg{ width:100%; height:100%; transform:rotate(-90deg); display:block; }
  .sw-ring circle{ fill:none; stroke-width:4; }
  .sw-ring .sw-ring-bg{ stroke:var(--border); }
  .sw-ring .sw-ring-fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1), stroke .3s ease; }
  .sw-pill-label{ font-size:11px; color:var(--muted); font-weight:600; line-height:1.25; white-space:nowrap; }
  .sw-pill-label b{ color:var(--text); font-size:12.5px; }
  .sw-panel{
    width:260px; max-width:calc(100vw - 32px);
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 12px 34px rgba(0,0,0,.5); padding:16px;
    opacity:0; transform:translateY(10px) scale(.96); pointer-events:none;
    transition:opacity .2s ease, transform .2s cubic-bezier(.22,1,.36,1);
  }
  #storageWidget.open .sw-panel{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .sw-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sw-panel-title{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .sw-panel-title i{ color:var(--accent); }
  .sw-refresh{ background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; border-radius:6px; display:flex; }
  .sw-refresh:hover{ color:var(--accent); background:var(--panelAlt); }
  .sw-refresh.spin i{ animation:spin 1s linear infinite; }
  .sw-row{ margin-bottom:14px; }
  .sw-row:last-of-type{ margin-bottom:4px; }
  .sw-row-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .sw-row-name{ font-size:11.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:5px; }
  .sw-row-name i{ font-size:12px; }
  .sw-row-val{ font-size:11px; color:var(--mutedFaint); font-family:'Prompt',sans-serif; }

  /* ---------------- custom confirm modal ---------------- */
  #confirmOverlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(10,11,13,0);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, background .22s ease;
  }
  #confirmOverlay.open{
    opacity:1; pointer-events:auto;
    background:rgba(10,11,13,.62); backdrop-filter:blur(3px);
  }
  .confirm-card{
    width:100%; max-width:360px;
    background:linear-gradient(165deg, var(--panel), var(--panelAlt));
    border:1px solid var(--border); border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    padding:26px 24px 22px;
    text-align:center;
    transform:translateY(18px) scale(.94); opacity:0;
    transition:transform .32s cubic-bezier(.22,1.15,.36,1), opacity .28s ease;
    position:relative; overflow:hidden;
  }
  #confirmOverlay.open .confirm-card{ transform:translateY(0) scale(1); opacity:1; }
  .confirm-card::before{
    content:""; position:absolute; top:-60%; left:50%; width:220%; aspect-ratio:1;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(45,212,191,0.14), transparent 62%);
    pointer-events:none;
  }
  .confirm-icon{
    width:56px; height:56px; margin:0 auto 16px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:24px; position:relative; z-index:1;
    background:var(--accentDim); color:var(--accent);
    box-shadow:0 0 0 6px rgba(45,212,191,0.08);
    animation:confirmIconPop .38s cubic-bezier(.22,1.4,.36,1) .05s both;
  }
  .confirm-icon.danger{ background:var(--dangerDim); color:var(--danger); box-shadow:0 0 0 6px rgba(240,71,62,0.08); }
  @keyframes confirmIconPop{
    0%{ transform:scale(.4) rotate(-12deg); opacity:0; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  .confirm-title{ font-size:16px; font-weight:700; margin-bottom:6px; position:relative; z-index:1; }
  .confirm-msg{ font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:22px; position:relative; z-index:1; }
  .confirm-actions{ display:flex; gap:10px; position:relative; z-index:1; }
  .confirm-actions .btn{ flex:1; justify-content:center; padding:11px 14px; font-size:13.5px; }
  .btn-confirm-primary{ background:var(--accent); color:#0B1614; }
  .btn-confirm-primary:hover{ filter:brightness(1.08); }
  .btn-confirm-danger{ background:var(--danger); color:#fff; }
  .btn-confirm-danger:hover{ filter:brightness(1.08); }

  .ai-scan-loading span{ font-size:12.5px; color:var(--muted); }

  .ai-result{ margin-top:16px; }
  .ai-result-top{
    display:flex; align-items:center; gap:14px;
    background:var(--panelAlt); border:1px solid var(--border); border-radius:14px;
    padding:14px;
  }

  .ai-result-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ai-result-ring circle{ fill:none; stroke-width:5; }
  .ai-result-ring .bg{ stroke:var(--border); }
  .ai-result-ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1); }
  .ai-result-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700;
  }
  .ai-result-name{ font-size:15px; font-weight:700; margin-bottom:2px; }
  .ai-result-sub{ font-size:11px; color:var(--muted); }
  .ai-result-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .ai-result-row{ display:flex; align-items:center; gap:9px; font-size:11.5px; }
  .ai-result-row .name{ width:40%; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ai-result-row .bar{ flex:1; height:6px; border-radius:4px; background:var(--border); overflow:hidden; }

  /* =====================================================================
     THEME — กลางวัน / กลางคืน
     ===================================================================== */
  .brand-spare{ color:#ECEDEF; }
  html[data-theme="light"]{
    --bg:#F3F5F9; --panel:#FFFFFF; --panelAlt:#EDF1F6; --border:#DCE2EA;
    --text:#0F172A; --muted:#5A6675; --mutedFaint:#8B97A6;
    --accent:#0D9488; --accentDim:#CCFBF1;
    --warn:#B45309; --warnDim:#FEF3C7;
    --danger:#DC2626; --dangerDim:#FEE2E2;
    --machine:#2563EB; --machineDim:#DBEAFE;
  }
  html[data-theme="light"] body{ background:var(--bg); color:var(--text); }
  html[data-theme="light"] .brand-spare{ color:#0F172A; }
  html[data-theme="light"] .brand-title-cube{
    background:linear-gradient(90deg,#0D9488,#0F172A,#14B8A6,#0D9488);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  html[data-theme="light"] .topbar{
    background:radial-gradient(ellipse at 8% 50%, rgba(13,148,136,.13), transparent 60%), var(--panel);
    box-shadow:0 1px 0 var(--border);
  }
  html[data-theme="light"] .tabs{ background:linear-gradient(180deg,rgba(15,23,42,.035),rgba(15,23,42,.008)); }
  html[data-theme="light"] .tabs .tab:hover{ background:rgba(15,23,42,.055); }
  html[data-theme="light"] .tabs .tab.active{ color:#fff; }
  html[data-theme="light"] .gauge-bar{ background:#E2E8F0; }
  html[data-theme="light"] #bgParticles{ opacity:.45; }
  html[data-theme="light"] .toast{ box-shadow:0 10px 26px rgba(15,23,42,.16); }
  html[data-theme="light"] .lightbox-overlay{ background:rgba(243,245,249,.94); }
  html[data-theme="light"] .lightbox-close{ background:#fff; color:#0F172A; border:1px solid var(--border); }
  html[data-theme="light"] .edit-btn{ background:rgba(255,255,255,.85); color:#0F172A; }
  html[data-theme="light"] .mc-owner-avatar{ color:#fff; }
  html[data-theme="light"] .btn-accent{ color:#fff; }
  html[data-theme="light"] .sw-pill{ box-shadow:0 4px 16px rgba(15,23,42,.14); }
  html[data-theme="light"] .login-screen{
    background:
      radial-gradient(circle at 50% 0%, rgba(13,148,136,.10), transparent 55%),
      repeating-linear-gradient(0deg, rgba(13,148,136,.05) 0, rgba(13,148,136,.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(13,148,136,.05) 0, rgba(13,148,136,.05) 1px, transparent 1px, transparent 42px),
      var(--bg);
  }

  /* =====================================================================
     LOGIN — editorial / minimal (อิงจากต้นแบบ)
     ===================================================================== */
  .lg-wrap{
    position:relative;
    --lg-bg:#f7f6f3; --lg-ink:#1c1c1a; --lg-muted:#6b6a64; --lg-faint:#9a988f;
    --lg-line:#e4e2dc; --lg-accent:#0f766e; --lg-accent-soft:#5eead4;
    --lg-btn-bg:#1c1c1a; --lg-btn-fg:#f7f6f3; --lg-dot:#d6d3cb;
    min-height:100vh; display:grid; grid-template-columns:1fr 1fr;
    background:var(--lg-bg); color:var(--lg-ink); overflow-x:hidden;
  }
  html[data-theme="dark"] .lg-wrap{
    --lg-bg:#14161A; --lg-ink:#ECEDEF; --lg-muted:#878D97; --lg-faint:#5B6068;
    --lg-line:#2C3139; --lg-accent:#2DD4BF; --lg-accent-soft:#6EE7D8;
    --lg-btn-bg:#2DD4BF; --lg-btn-fg:#0A0C0E; --lg-dot:#2A3038;
  }

  @keyframes lgRise   { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  @keyframes lgFade   { from{opacity:0;} to{opacity:1;} }
  @keyframes lgDraw   { from{transform:scaleX(0);} to{transform:scaleX(1);} }
  @keyframes lgFloat  { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  @keyframes lgShimmer{ 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
  @keyframes lgPulse  { 0%,100%{box-shadow:0 0 0 0 rgba(15,118,110,.35);} 50%{box-shadow:0 0 0 10px rgba(15,118,110,0);} }
  @keyframes lgDrift  { to{transform:translate(26px,26px);} }
  @keyframes lgRipple { to{transform:scale(4);opacity:0;} }

  .lg-bg{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none; display:block;
    opacity:.85;
    /* อยู่ในแผงซ้ายเท่านั้น — ขวาไม่แตะ */
    mask-image:linear-gradient(90deg, #000 70%, transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, #000 70%, transparent 100%);
  }
  html[data-theme="light"] .lg-bg{ opacity:.55; }

  .lg-left{
    position:relative; z-index:1; padding:56px;
    display:flex; flex-direction:column; justify-content:space-between;
    border-right:1px solid var(--lg-line); overflow:hidden;
  }
  .lg-left::before{
    content:""; position:absolute; inset:-40px;
    background-image:radial-gradient(circle, var(--lg-dot) 1px, transparent 1.2px);
    background-size:26px 26px; opacity:.55; pointer-events:none;
    animation:lgFade 1.2s ease both, lgDrift 30s linear infinite;
    mask-image:radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
  }
  .lg-brand{
    position:relative; z-index:1; display:flex; align-items:center; gap:14px;
    font-weight:700; font-size:23px; letter-spacing:-.4px;
    animation:lgRise .7s ease both;
  }
  .lg-mark-img{
    width:44px; height:44px; border-radius:0; object-fit:contain;
    box-shadow:none;
    animation:lgFloat 5s ease-in-out infinite;
  }
  .lg-name{ display:inline-flex; align-items:baseline; }
  .lg-name .brand-spare{ color:var(--lg-ink); }
  .lg-hero{ position:relative; z-index:1; }
  .lg-headline{
    font-size:clamp(26px,3.1vw,38px); line-height:1.32; font-weight:500; letter-spacing:-.02em;
    max-width:460px; animation:lgRise .9s .1s ease both;
  }
  .lg-headline .shine{
    background:linear-gradient(90deg,var(--lg-accent),var(--lg-accent-soft),var(--lg-accent));
    background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:lgShimmer 4s linear infinite;
  }
  .lg-underline{
    height:2px; width:120px; margin-top:18px; background:var(--lg-accent);
    transform-origin:left; animation:lgDraw .9s .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .lg-list{ position:relative; z-index:1; font-size:13.5px; color:var(--lg-muted); font-weight:300; max-width:460px; }
  .lg-list div{
    padding:14px 0; border-top:1px solid var(--lg-line);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    opacity:0; animation:lgRise .6s ease forwards;
    transition:color .25s, padding-left .25s;
  }
  .lg-list div:nth-child(1){ animation-delay:.6s; }
  .lg-list div:nth-child(2){ animation-delay:.75s; }
  .lg-list div:nth-child(3){ animation-delay:.9s; }
  .lg-list div::after{
    content:"→"; opacity:0; transform:translateX(-6px); color:var(--lg-accent);
    transition:opacity .25s, transform .25s;
  }
  .lg-list div:hover{ color:var(--lg-ink); padding-left:6px; }
  .lg-list div:hover::after{ opacity:1; transform:translateX(0); }

  .lg-right{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; padding:44px; }
  .lg-panel{ width:100%; max-width:340px; animation:lgRise .8s .2s ease both; }
  .lg-panel h2{ font-size:24px; font-weight:500; letter-spacing:-.02em; margin:0; }
  .lg-sub{ margin-top:8px; font-size:13px; color:var(--lg-muted); font-weight:300; line-height:1.7; }

  .lg-warn{
    margin-top:24px; padding:12px 14px; border-radius:10px;
    background:#fdf6e3; border:1px solid #f0e0a8; color:#7a5b00;
    font-size:12px; line-height:1.65;
  }
  html[data-theme="dark"] .lg-warn{ background:rgba(245,166,35,.10); border-color:rgba(245,166,35,.32); color:#F0D3A0; }
  .lg-warn b{ font-weight:600; }

  .lg-btn{
    position:relative; overflow:hidden; margin-top:32px;
    width:100%; height:52px; border-radius:999px;
    border:1px solid var(--lg-btn-bg); background:var(--lg-btn-bg); color:var(--lg-btn-fg);
    font-family:'Prompt',sans-serif; font-weight:500; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
    transition:transform .2s ease, box-shadow .3s ease;
    animation:lgPulse 2.8s 1.4s ease-in-out infinite;
  }
  .lg-btn .g{
    width:18px; height:18px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(#4285f4 0 25%, #34a853 0 50%, #fbbc05 0 75%, #ea4335 0);
    mask:radial-gradient(circle, transparent 5px, #000 6px);
    -webkit-mask:radial-gradient(circle, transparent 5px, #000 6px);
    transition:transform .4s ease;
  }
  .lg-btn .arrow{ transition:transform .3s ease; }
  .lg-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 30px -12px rgba(28,28,26,.55); }
  .lg-btn:hover .g{ transform:rotate(-20deg) scale(1.08); }
  .lg-btn:hover .arrow{ transform:translateX(4px); }
  .lg-btn:active{ transform:translateY(0) scale(.98); }
  .lg-btn[disabled]{ opacity:.6; cursor:not-allowed; }
  .lg-btn .ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,.35); transform:scale(0); pointer-events:none; animation:lgRipple .6s ease-out forwards; }
  html[data-theme="dark"] .lg-btn .ripple{ background:rgba(10,12,14,.28); }

  .lg-status{
    margin-top:16px; min-height:20px; font-size:12.5px; color:var(--lg-accent); text-align:center;
    opacity:0; transition:opacity .3s;
  }
  .lg-status.show{ opacity:1; }
  .lg-err{ margin-top:14px; font-size:12px; color:var(--danger,#F0473E); line-height:1.65; }
  html[data-theme="light"] .lg-err{ color:#b91c1c; }

  .lg-note{ margin-top:24px; font-size:12px; color:#7c7a72; line-height:1.75; font-weight:300; }
  html[data-theme="dark"] .lg-note{ color:#98A0AC; }
  .lg-note b{ color:var(--lg-muted); font-weight:500; }

  .lg-theme{
    position:absolute; top:22px; right:22px; width:38px; height:38px; border-radius:11px;
    border:1px solid transparent; background:transparent; color:var(--lg-faint);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
    transition:color .2s, background .2s, border-color .2s;
  }
  .lg-theme:hover{ color:var(--lg-accent); background:var(--lg-line); border-color:var(--lg-line); }

  .lg-brand-m{ display:none; }

  @media (max-width:860px){
    .lg-wrap{ grid-template-columns:1fr; }
    .lg-left{ display:none; }
    .lg-right{ padding:76px 24px 40px; align-items:flex-start; justify-content:flex-start; }
    .lg-panel{ max-width:100%; }

    /* บนมือถือ: โชว์ตรา + ชื่อเว็บด้านบนการ์ด (เพราะแผงซ้ายถูกซ่อน) */
    .lg-brand-m{ display:flex; align-items:center; gap:12px; margin-bottom:34px; }
    .lg-brand-m .lg-mark-img{ width:40px; height:40px; border-radius:0; animation:none; }
    .lg-brand-m .lg-name{ font-size:21px; font-weight:700; letter-spacing:-.4px; }
  }
  @media (prefers-reduced-motion:reduce){
    .lg-wrap *, .lg-wrap *::before, .lg-wrap *::after{
      animation:none !important; transition:none !important; opacity:1 !important;
    }
  }
  /* =====================================================================
     ANIMATION CHOREOGRAPHY (v4.2)
     อนิเมชันจากต้นแบบมีครบแล้ว (rise/fade/drawLine/float/shimmer/pulse/drift/ripple)
     ที่เพิ่ม: จังหวะไล่โผล่ทีละelement + แสงกวาดปุ่ม + โลโก้เรืองแสง
     ===================================================================== */
  @keyframes lgPop   { 0%{opacity:0; transform:scale(.94);} 100%{opacity:1; transform:scale(1);} }
  @keyframes lgSweep { 0%{transform:translateX(-130%);} 100%{transform:translateX(240%);} }
  @keyframes lgGlow  { 0%,100%{filter:drop-shadow(0 0 0 rgba(45,212,191,0));} 50%{filter:drop-shadow(0 0 10px rgba(45,212,191,.55));} }

  /* ให้แต่ละส่วนของการ์ดไล่โผล่ทีละจังหวะ (แทนที่จะโผล่พร้อมกันทั้งก้อน) */
  .lg-wrap .lg-panel{ animation:none; }
  .lg-panel h2       { animation:lgRise .50s .26s ease both; }
  .lg-panel .lg-sub  { animation:lgRise .50s .34s ease both; }
  .lg-panel .lg-warn { animation:lgPop  .45s .28s ease both; }
  .lg-panel .lg-btn  { animation:lgRise .58s .42s ease both, lgPulse 2.8s 1.7s ease-in-out infinite; }
  .lg-panel .lg-note { animation:lgRise .50s .58s ease both; }
  .lg-panel .lg-err  { animation:lgPop  .40s .05s ease both; }
  .lg-brand-m        { animation:lgRise .60s .08s ease both; }
  .lg-theme          { animation:lgFade .90s .55s ease both; }

  /* โลโก้: ลอยขึ้นลง + เรืองแสงเบาๆ */
  .lg-mark-img{ animation:lgFloat 5s ease-in-out infinite, lgGlow 4.5s ease-in-out infinite; }

  /* แสงกวาดผ่านปุ่ม 1 ครั้งหลังเปิดหน้า */
  .lg-btn::after{
    content:""; position:absolute; top:0; left:0; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.30), transparent);
    transform:translateX(-130%); animation:lgSweep 1.05s 1.05s ease-out both;
    pointer-events:none;
  }
  html[data-theme="dark"] .lg-btn::after{
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
  }

  /* แถวรายการ: ขีดสีเลื่อนเข้าตอน hover */
  .lg-list div{ position:relative; }
  .lg-list div::before{
    content:""; position:absolute; left:-14px; top:14px; bottom:14px; width:2px;
    background:var(--lg-accent); opacity:0; transform:scaleY(.3);
    transition:opacity .25s ease, transform .25s ease;
  }
  .lg-list div:hover::before{ opacity:1; transform:scaleY(1); }

  /* =====================================================================
     SKIN v2 — minimal / editorial (ให้เข้าชุดกับหน้า login)
     ===================================================================== */

  /* ---- ใช้พื้นที่เต็มจอ ---- */
  .wrap{ max-width:1680px; margin:0 auto; padding:0 40px 64px; }
  .topbar-inner{ max-width:1680px; padding:16px 40px 0; }
  .content{ padding-top:22px; }
  @media(max-width:700px){
    .wrap{ padding:0 16px 48px; }
    .topbar-inner{ padding:12px 16px 0; }
  }

  /* ---- แท็บ: เส้นใต้บาง แทน pill ---- */
  .tabs{
    background:transparent; border:0; border-bottom:1px solid var(--border);
    border-radius:0; padding:0; gap:28px; margin:16px 0 0; overflow-x:auto;
  }
  .tabs .tab{
    background:transparent !important; box-shadow:none !important; border-radius:0 !important;
    padding:12px 2px; font-size:13px; font-weight:500; color:var(--muted);
    border-bottom:2px solid transparent; margin-bottom:-1px; transform:none;
  }
  .tabs .tab i{ font-size:15px; opacity:.8; }
  .tabs .tab:hover{ background:transparent !important; color:var(--text); }
  .tabs .tab.active{
    color:var(--text) !important; background:transparent !important;
    border-bottom-color:var(--accent); box-shadow:none !important;
  }
  .tabs .tab .badge{ background:var(--danger); }

  /* ---- ช่องค้นหา: ขีดเส้นใต้ ---- */
  .search{ margin-bottom:20px; }
  .search input{
    background:transparent; border:0; border-bottom:1px solid var(--border);
    border-radius:0; padding:10px 0 10px 28px; font-size:14px;
  }
  .search input:focus{ border-bottom-color:var(--accent); }
  .search .icon{ left:4px; top:11px; }
  #zoneFilterSelect{ max-width:280px; background:transparent; border:0; border-bottom:1px solid var(--border); border-radius:0; }

  /* ---- กลุ่มเครื่องจักร: หัวข้อเล็กตัวพิมพ์ใหญ่ + เส้นคั่น ---- */
  .machine-group{
    border:0 !important; border-radius:0; padding:0; margin:0 0 42px; background:transparent !important;
  }
  .machine-group-title{
    color:var(--muted); font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:0;
    justify-content:space-between; align-items:baseline;
  }
  .machine-group.unassigned .machine-group-title{ color:var(--mutedFaint); border-bottom-style:dashed; }

  /* ---- อะไหล่: แถวเรียบ ไม่มีกรอบการ์ด ---- */
  .parts-grid{ display:block !important; margin-bottom:0 !important; }
  .part-card{
    display:flex; align-items:center; gap:18px;
    background:transparent; border:0; border-bottom:1px solid var(--border); border-radius:0;
    padding:14px 8px; transition:background .18s ease, padding-left .18s ease;
  }
  .part-card:hover{ background:rgba(45,212,191,.05); padding-left:14px; }
  .part-card:hover .part-name{ color:var(--accent); }

  .part-photo{
    width:52px; height:52px; flex:0 0 52px; aspect-ratio:auto;
    border-radius:10px; overflow:hidden; background:var(--panelAlt); border:1px solid var(--border);
  }
  .part-photo img{ width:100%; height:100%; object-fit:cover; }
  .edit-btn{ top:3px; right:3px; padding:3px; font-size:11px; border-radius:5px; }

  .part-body{
    flex:1; min-width:0; padding:0;
    display:grid; grid-template-columns:1fr auto auto;
    grid-template-areas:"name gauge btn" "code gauge btn";
    column-gap:22px; row-gap:3px; align-items:center;
  }
  .part-name{ grid-area:name; font-size:14px; font-weight:600; transition:color .18s ease; }
  .part-code{ grid-area:code; margin:0 !important; font-size:11.5px; color:var(--mutedFaint); }
  .gauge-top{ grid-area:gauge; margin:0; display:flex; align-items:baseline; gap:7px; justify-content:flex-end; }
  .gauge-top > span:first-child{ font-size:21px !important; line-height:1 !important; }
  .gauge-top > span:last-child{ font-size:11px !important; }
  .gauge-bar{ display:none; }

  .withdraw-btn{
    grid-area:btn; width:auto; margin:0; padding:7px 14px; font-size:11.5px;
    background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--muted);
    transition:border-color .18s ease, color .18s ease;
  }
  .withdraw-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .withdraw-btn i{ font-size:13px; }

  /* ---- จอเล็ก: จัดใหม่ให้อ่านง่าย ---- */
  @media(max-width:600px){
    .part-card{ padding:12px 4px; gap:13px; }
    .part-photo{ width:44px; height:44px; flex:0 0 44px; border-radius:8px; }
    .part-body{ grid-template-columns:1fr auto; grid-template-areas:"name gauge" "code code" "btn btn"; row-gap:9px; column-gap:12px; }
    .withdraw-btn{ justify-self:start; }
    .tabs{ gap:20px; }
    .machine-group{ margin-bottom:32px; }
  }

  /* ---- พื้นหลังแอป: จุดกริดจางแบบเดียวกับหน้า login + particle เบาลง ---- */
  body{
    background-image:radial-gradient(circle, rgba(45,212,191,.075) 1px, transparent 1.2px);
    background-size:26px 26px;
    background-attachment:fixed;
  }
  html[data-theme="light"] body{
    background-image:radial-gradient(circle, rgba(15,23,42,.065) 1px, transparent 1.2px);
  }
  #bgParticles{ opacity:.22; }
  html[data-theme="light"] #bgParticles{ opacity:.14; }
  .topbar{ backdrop-filter:blur(10px); }

  /* ---- เก็บรายละเอียด: กันปุ่มลอยทับแถวล่าง + ทำตัวเลขตรงคอลัมน์ ---- */
  .wrap{ padding-bottom:104px; }
  .gauge-top > span:first-child{
    font-variant-numeric:tabular-nums; min-width:2.4ch; text-align:right; display:inline-block;
  }
  .gauge-top > span:last-child{ white-space:nowrap; }
  @media(max-width:700px){ .wrap{ padding-bottom:120px; } }

  /* =====================================================================
     SKIN v2.1 — ขยายขนาด + ตีกรอบกลุ่มเครื่องจักรกลับมา (อ่านง่ายขึ้น)
     ===================================================================== */
  /* ---- กลุ่มเครื่องจักร: กรอบสี + หัวข้อใหญ่ชัด ---- */
  .machine-group{
    border:1.5px solid var(--machine) !important;
    border-radius:14px !important;
    padding:12px 16px 4px !important;
    margin:0 0 20px !important;
    background:rgba(59,130,246,.07) !important;
  }
  html[data-theme="light"] .machine-group{ background:rgba(37,99,235,.045) !important; }
  .machine-group.unassigned{
    border:1.5px dashed var(--border) !important;
    background:transparent !important;
  }
  .machine-group-title{
    font-size:17px !important; font-weight:700 !important;
    letter-spacing:0 !important; text-transform:none !important;
    color:var(--machine) !important;
    border-bottom:0 !important; padding-bottom:0 !important;
    margin:0 0 10px !important;
    display:flex; align-items:center; gap:9px; justify-content:flex-start !important;
  }
  .machine-group-title::before{
    content:""; width:9px; height:9px; border-radius:50%;
    background:var(--machine); flex:0 0 9px;
  }
  .machine-group-title span[style]{ font-size:13px !important; margin-left:auto; }
  .machine-group.unassigned .machine-group-title{ color:var(--muted) !important; }
  .machine-group.unassigned .machine-group-title::before{ background:var(--mutedFaint); }

  /* ---- แถวอะไหล่: ขยายรูป/ตัวหนังสือ ---- */
  .part-photo{ width:64px !important; height:64px !important; flex:0 0 64px !important; border-radius:12px !important; }
  .part-name{ font-size:16.5px !important; font-weight:600 !important; letter-spacing:-.1px; }
  .part-code{ font-size:12.5px !important; color:var(--muted) !important; }
  .part-code span{ font-size:12.5px !important; }
  .gauge-top > span:first-child{ font-size:27px !important; }
  .gauge-top > span:last-child{ font-size:12.5px !important; }
  .withdraw-btn{ font-size:13px !important; padding:9px 16px !important; border-radius:9px !important; }
  .withdraw-btn i{ font-size:15px !important; }
  .part-card{ padding:16px 6px !important; gap:18px !important; }

  /* ---- มือถือ ---- */
  @media(max-width:600px){
    .machine-group{ padding:14px 14px 6px !important; border-radius:14px !important; margin-bottom:22px !important; }
    .machine-group-title{ font-size:15.5px !important; }
    .part-photo{ width:56px !important; height:56px !important; flex:0 0 56px !important; }
    .part-name{ font-size:15px !important; }
    .part-code{ font-size:11.5px !important; }
    .gauge-top > span:first-child{ font-size:23px !important; }
    .withdraw-btn{ font-size:12.5px !important; padding:8px 14px !important; }
  }

  /* ---- SKIN v2.2: ขยายอีกรอบให้อ่านง่ายบนจอใหญ่ ---- */
  .part-photo{ width:76px !important; height:76px !important; flex:0 0 76px !important; border-radius:14px !important; }
  .part-name{ font-size:18px !important; }
  .part-code{ font-size:13.5px !important; }
  .part-code span{ font-size:13.5px !important; }
  .gauge-top > span:first-child{ font-size:30px !important; }
  .gauge-top > span:last-child{ font-size:13.5px !important; }
  .withdraw-btn{ font-size:13.5px !important; padding:10px 18px !important; }
  .part-card{ padding:18px 6px !important; }
  .machine-group-title{ font-size:18px !important; margin-bottom:12px !important; }
  @media(max-width:600px){
    .part-photo{ width:64px !important; height:64px !important; flex:0 0 64px !important; }
    .part-name{ font-size:16px !important; }
    .gauge-top > span:first-child{ font-size:25px !important; }
    .machine-group-title{ font-size:16px !important; }
  }

  /* ---- SKIN v2.3: รูปใหญ่ขึ้นอีก (จอใหญ่) ---- */
  .part-photo{ width:88px !important; height:88px !important; flex:0 0 88px !important; border-radius:16px !important; }
  .part-card{ padding:20px 6px !important; }
  .part-name{ font-size:18.5px !important; }
  @media(max-width:600px){
    .part-photo{ width:68px !important; height:68px !important; flex:0 0 68px !important; border-radius:12px !important; }
    .part-name{ font-size:16px !important; }
  }

  /* ---- SKIN v2.4: ข้อความรองอ่านง่ายขึ้นอีกนิด ---- */
  .part-code, .part-code span{ font-size:14px !important; }
  .gauge-top > span:last-child{ font-size:14px !important; }
  .gauge-top{ gap:9px !important; }

  /* =====================================================================
     SKIN v2.5 — แท็บ: ตัวใหญ่ ไอคอนใหญ่ เต็มความกว้าง + ฟอนต์ Prompt
     ===================================================================== */
  .tabs{
    display:flex !important; gap:0 !important; padding:0 !important;
    border-bottom:1px solid var(--border) !important;
    overflow-x:auto; overflow-y:hidden;
  }
  .tabs .tab{
    flex:1 0 auto; min-width:132px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-family:'Prompt',sans-serif !important;
    font-size:15.5px !important; font-weight:600 !important;
    padding:16px 12px !important;
    border-bottom:2px solid transparent; margin-bottom:-1px;
    white-space:nowrap;
  }
  .tabs .tab i{ font-size:20px !important; opacity:.9; }
  .tabs .tab .badge{ font-size:11.5px !important; padding:2px 7px !important; }
  .tabs .tab:hover{ background:rgba(45,212,191,.06) !important; color:var(--text) !important; }
  .tabs .tab.active{ border-bottom-color:var(--accent) !important; color:var(--text) !important; }
  .tabs .tab.active i{ color:var(--accent); opacity:1; }

  @media(max-width:700px){
    .tabs .tab{ min-width:124px; font-size:14.5px !important; padding:14px 10px !important; gap:7px; }
    .tabs .tab i{ font-size:18px !important; }
  }

  /* =====================================================================
     LAYERS — ชั้นเครื่องจักร: กดหัวชั้นแล้วพลิกเปิดรายการอะไหล่
     ===================================================================== */
  .machine-group{ perspective:1600px; }

  .mg-toggle{
    width:100%; display:flex; align-items:center; gap:10px;
    background:none; border:0; cursor:pointer; text-align:left;
    font-family:'Prompt',sans-serif; font-size:18px; font-weight:700;
    color:var(--machine); padding:2px 0 12px; margin:0; line-height:1.3;
    transition:opacity .2s ease;
  }
  .machine-group.unassigned .mg-toggle{ color:var(--muted); }

  /* =====================================================================
     BOOT SCREEN — AI / tech loading
     ===================================================================== */
  .boot{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 42%, rgba(45,212,191,.10), transparent 58%),
      radial-gradient(circle at 82% 82%, rgba(124,58,237,.07), transparent 52%),
      var(--bg);
    overflow:hidden;
  }
  .boot-grid{
    position:absolute; inset:-40px;
    background-image:radial-gradient(rgba(45,212,191,.20) 1px, transparent 1.2px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 5%, transparent 62%);
    mask-image:radial-gradient(circle at 50% 45%, #000 5%, transparent 62%);
    animation:bootDrift 26s linear infinite, bootFadeIn .9s ease both;
  }
  @keyframes bootDrift{ to{ transform:translate(26px, 26px); } }
  @keyframes bootFadeIn{ from{ opacity:0 } to{ opacity:1 } }

  /* จุดลอยรอบ ๆ */
  .boot-orbit{ position:absolute; width:min(78vw, 560px); aspect-ratio:1; pointer-events:none; }
  .bo-dot{
    position:absolute; width:5px; height:5px; border-radius:2px;
    background:var(--accent); opacity:.55;
    box-shadow:0 0 10px rgba(45,212,191,.7);
  }
  .bo-dot.d1{ top:12%; left:22%; animation:boFloat1 7s ease-in-out infinite; }
  .bo-dot.d2{ top:70%; left:80%; width:4px; height:4px; animation:boFloat2 9s ease-in-out infinite; }
  .bo-dot.d3{ top:82%; left:26%; width:3px; height:3px; opacity:.4; animation:boFloat3 11s ease-in-out infinite; }
  @keyframes boFloat1{ 0%,100%{ transform:translate(0,0) rotate(0) } 50%{ transform:translate(18px,-22px) rotate(45deg) } }
  @keyframes boFloat2{ 0%,100%{ transform:translate(0,0) rotate(0) } 50%{ transform:translate(-24px,14px) rotate(-40deg) } }
  @keyframes boFloat3{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(14px,-16px) } }

  .boot-core{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }

  /* วงแหวน + โลโก้ */
  .boot-orb{ position:relative; width:112px; height:112px; display:grid; place-items:center; margin-bottom:30px; }
  .boot-orb img{
    width:62px; height:62px; object-fit:contain; position:relative; z-index:2;
    filter:drop-shadow(0 0 16px rgba(45,212,191,.55));
    animation:bootLogoPulse 2.8s ease-in-out infinite, bootLogoIn .7s cubic-bezier(.22,1.3,.36,1) both;
  }
  @keyframes bootLogoPulse{ 0%,100%{ transform:scale(1); filter:drop-shadow(0 0 12px rgba(45,212,191,.45)) } 50%{ transform:scale(1.06); filter:drop-shadow(0 0 22px rgba(45,212,191,.75)) } }
  @keyframes bootLogoIn{ from{ opacity:0; transform:scale(.7) } to{ opacity:1; transform:scale(1) } }

  .boot-orb .ring{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(45,212,191,.5);
    animation:bootRing 3.2s cubic-bezier(.2,.6,.4,1) infinite;
  }
  .boot-orb .ring.r2{ animation-delay:1.05s; }
  .boot-orb .ring.r3{ animation-delay:2.1s; }
  @keyframes bootRing{
    0%{ transform:scale(.42); opacity:0; }
    18%{ opacity:.85; }
    100%{ transform:scale(1.32); opacity:0; }
  }

  .boot-orb .arc{
    position:absolute; inset:-7px; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0 68%, rgba(45,212,191,.9) 86%, transparent 92%);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
    animation:bootSpin 1.9s linear infinite;
  }
  @keyframes bootSpin{ to{ transform:rotate(360deg); } }

  /* ข้อความ */
  .boot-title{
    font-family:'Prompt',sans-serif; font-size:14.5px; font-weight:600; letter-spacing:.03em;
    background:linear-gradient(90deg, var(--muted) 0%, var(--text) 42%, var(--accent) 58%, var(--muted) 100%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:bootShimmer 2.6s linear infinite;
  }
  @keyframes bootShimmer{ 0%{ background-position:130% 50%; } 100%{ background-position:-130% 50%; } }

  /* ขั้นตอน 3 ขีด */
  .boot-steps{ display:flex; gap:7px; margin:16px 0 10px; }
  .boot-steps i{
    position:relative; width:30px; height:2px; border-radius:2px;
    background:var(--border); overflow:hidden;
  }
  .boot-steps i::after{
    content:""; position:absolute; inset:0; background:var(--accent);
    box-shadow:0 0 8px rgba(45,212,191,.8);
    transform-origin:left; transform:scaleX(0);
    animation:bootStepFill 2.7s cubic-bezier(.4,0,.2,1) infinite;
  }
  .boot-steps i:nth-child(2)::after{ animation-delay:.45s; }
  .boot-steps i:nth-child(3)::after{ animation-delay:.9s; }
  @keyframes bootStepFill{
    0%{ transform:scaleX(0); opacity:1; }
    26%{ transform:scaleX(1); opacity:1; }
    48%{ transform:scaleX(1); opacity:.35; }
    54%{ transform:scaleX(0); opacity:0; }
    100%{ transform:scaleX(0); opacity:0; }
  }

  /* แถบวิ่ง */
  .boot-bar{ width:196px; height:2px; border-radius:2px; background:var(--border); overflow:hidden; position:relative; }
  .boot-bar i{
    position:absolute; top:0; bottom:0; width:44%;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation:bootSlide 1.5s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes bootSlide{ 0%{ left:-44%; } 100%{ left:100%; } }

  .boot-sub{
    position:relative; margin-top:14px; height:17px; width:280px; max-width:70vw;
    font-size:12px; color:var(--muted); letter-spacing:.02em; text-align:center;
  }
  .boot-sub span{
    position:absolute; left:0; right:0; top:0; opacity:0;
    animation:bootSubCycle 3.9s ease-in-out infinite;
  }
  .boot-sub span:nth-child(2){ animation-delay:1.3s; }
  .boot-sub span:nth-child(3){ animation-delay:2.6s; }
  @keyframes bootSubCycle{
    0%{ opacity:0; transform:translateY(4px); }
    9%{ opacity:1; transform:translateY(0); }
    26%{ opacity:1; transform:translateY(0); }
    35%{ opacity:0; transform:translateY(-4px); }
    100%{ opacity:0; transform:translateY(-4px); }
  }

  @media(max-width:700px){
    .boot-orb{ width:96px; height:96px; margin-bottom:26px; }
    .boot-orb img{ width:54px; height:54px; }
    .boot-title{ font-size:13.5px; }
    .boot-bar{ width:168px; }
  }
  @media(prefers-reduced-motion:reduce){
    .boot-grid, .boot-orb img, .boot-orb .ring, .boot-orb .arc,
    .boot-title, .boot-steps i::after, .boot-bar i, .boot-sub, .bo-dot{ animation:none !important; }
  }


  /* =====================================================================
     TABS — การ์ดอิโมจิ (ลอยเบา ๆ / ไม่หมุน)
     ===================================================================== */
  .tabs .tab{
    display:inline-flex !important; align-items:center !important; gap:8px !important;
    padding:6px 13px 6px 7px !important;
    border-radius:999px !important;
  }
  .tab-blob{
    position:relative; width:26px; height:26px; flex:0 0 26px;
    display:grid; place-items:center; border-radius:50%;
    background:rgba(var(--tc), .20);
    box-shadow:inset 0 0 0 1px rgba(var(--tc), .48);
    transition:transform .34s cubic-bezier(.22,1,.36,1), background .3s ease, box-shadow .3s ease;
  }
  .tab-emo{
    font-size:13.5px; line-height:1; display:block;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    animation:tabFloat 5.2s ease-in-out infinite;
    will-change:transform;
  }
  .tabs .tab:nth-child(2) .tab-emo{ animation-delay:.55s; }
  .tabs .tab:nth-child(3) .tab-emo{ animation-delay:1.1s; }
  .tabs .tab:nth-child(4) .tab-emo{ animation-delay:1.65s; }
  .tabs .tab:nth-child(5) .tab-emo{ animation-delay:2.2s; }
  .tabs .tab:nth-child(6) .tab-emo{ animation-delay:2.75s; }
  .tabs .tab:nth-child(7) .tab-emo{ animation-delay:3.3s; }
  .tabs .tab:nth-child(8) .tab-emo{ animation-delay:3.85s; }
  @keyframes tabFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    35%{ transform:translateY(-2.5px) rotate(-3deg); }
    70%{ transform:translateY(1px) rotate(2deg); }
  }

  .tab-label{ white-space:nowrap; }
  .tabs .tab{ color:#A3AAB4; }
  .tabs .tab:hover{ color:var(--text); }
  .tabs .tab.active{ color:#fff; }

  .tabs .tab:hover .tab-blob{
    transform:translateY(-2px) scale(1.08);
    background:rgba(var(--tc), .24);
    box-shadow:inset 0 0 0 1px rgba(var(--tc), .5);
  }
  .tabs .tab:active .tab-blob{ transform:scale(.94); }

  .tabs .tab.active .tab-blob{
    background:rgba(var(--tc), .26);
    box-shadow:inset 0 0 0 1px rgba(var(--tc), .6),
               0 0 14px rgba(var(--tc), .45),
               0 4px 12px -4px rgba(var(--tc), .55);
    transform:translateY(-1px) scale(1.1);
  }
  .tabs .tab.active .tab-emo{ animation-duration:3.6s; }
  .tabs .tab.active .tab-label{ font-weight:700; }

  /* ชั้นเงาใต้แท็บที่เลือก — พาราแลกซ์เบา ๆ */
  .tabs .tab.active::after{
    content:""; position:absolute; left:50%; bottom:-2px; transform:translateX(-50%);
    width:46%; height:2.5px; border-radius:3px;
    background:linear-gradient(90deg, transparent, rgba(var(--tc), 1), transparent);
    box-shadow:0 0 10px rgba(var(--tc), .75);
    animation:tabUnderline 3.4s ease-in-out infinite;
  }
  @keyframes tabUnderline{
    0%,100%{ opacity:.55; width:32%; }
    50%{ opacity:1; width:52%; }
  }
  .tabs .tab{ position:relative; }

  @media(prefers-reduced-motion:reduce){
    .tab-emo, .tabs .tab.active::after{ animation:none !important; }
  }
  @media(max-width:700px){
    .tab-blob{ width:23px; height:23px; flex:0 0 23px; }
    .tab-emo{ font-size:12px; }
    .tabs .tab{ gap:6px !important; padding:5px 11px 5px 6px !important; }
  }

     HUB — เมนูวงล้อ 3D เต็มหน้า

  .wrap-hub{ max-width:100% !important; padding:0 24px 0 !important; }

  .subnav{

  .hub{

  .hub-title{
    font-size:30px; font-weight:700; letter-spacing:-.6px; margin:0 0 8px;

  .hub-hint{ font-size:12.5px; color:var(--muted); margin:0; letter-spacing:.01em; }

  .hub-stage{
    position:relative; width:100%; height:500px; margin-top:10px;
    perspective:1500px; perspective-origin:50% 46%;
    display:flex; align-items:center; justify-content:center;
    touch-action:pan-y;           /* ลากแนวนอน = หมุนวงล้อ, แนวตั้ง = เลื่อนหน้า */
  }
  .hub-ring{ touch-action:pan-y; }
  .hub-ring{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.22,1,.36,1);
  }
  .hub-card{
    position:absolute; left:50%; top:50%;
    width:310px; height:370px; margin:-185px 0 0 -155px;
    transform: rotateY(calc(var(--i) * var(--step))) translateZ(430px);
    transform-style:preserve-3d; backface-visibility:hidden;

    padding:22px 18px; cursor:pointer; text-align:center;
    border-radius:22px;
    background:linear-gradient(168deg, var(--panel), var(--panelAlt));
    border:1px solid var(--border);
    color:var(--text); font-family:'Prompt',sans-serif;
    opacity:.72; filter:saturate(.62) brightness(.88);
    will-change:transform, opacity, filter;
    backface-visibility:hidden;
    transition:opacity .35s ease, filter .35s ease, border-color .35s ease, box-shadow .35s ease;
  }
  .hub-card:hover{ border-color:rgba(var(--tc),.42); }
  .hub-ring.rotating .hub-card{ pointer-events:none; }
  .hub-card.is-front{

    border-color:rgba(var(--tc),.6);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.9),
               0 0 0 1px rgba(var(--tc),.22),
               0 0 42px -12px rgba(var(--tc),.5);

  .hub-blob{
    width:112px; height:112px; border-radius:50%;
    display:grid; place-items:center; margin-bottom:6px;
    background:rgba(var(--tc), .16);
    box-shadow:inset 0 0 0 1.5px rgba(var(--tc), .45);
    transition:transform .4s cubic-bezier(.22,1,.36,1), background .3s ease, box-shadow .3s ease;
  }
  .hub-emo{
    font-size:52px; line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    display:block;
    transform:translateZ(0);     /* ล็อกให้ raster นิ่ง ไม่สั่นตอนวงล้อหมุน */
    backface-visibility:hidden;
  }
  .hub-card.is-front .hub-blob{
    background:rgba(var(--tc), .26);
    box-shadow:inset 0 0 0 1.5px rgba(var(--tc), .7), 0 0 26px rgba(var(--tc), .45);
  }
  .hub-label{ font-size:24px; font-weight:700; letter-spacing:-.3px; }
  .hub-sub{ font-size:12.5px; color:var(--muted); line-height:1.6; max-width:240px; }
  .hub-go{
    margin-top:8px; font-size:12.5px; font-weight:600; color:rgba(var(--tc),1);
    display:inline-flex; align-items:center; gap:5px;
    opacity:0; transform:translateY(4px); transition:all .3s ease;
  }
  .hub-card.is-front .hub-go{ opacity:1; transform:translateY(0); }
  .hub-card:not(.is-front) .hub-go{ display:none; }

  .hub-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:5;
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);

  .hub-arrow:hover{ color:var(--accent); border-color:var(--accent); transform:translateY(-50%) scale(1.06); }
  .hub-arrow.left{ left:2%; }

  .hub-dock{

  }
  @media(prefers-reduced-motion:reduce){
    .hub-emo{ animation:none !important; }
    .hub-ring{ transition:none !important; }
  }


  /* =====================================================================
     HUD REACTOR — ครึ่งซ้ายหน้า login (สไตล์ sci-fi / HUD)
     ===================================================================== */
  .hud{
    position:relative; flex:1 1 auto; min-height:230px;

  /* ---- วงแท่งเสียง (equalizer) รอบอะตอม ---- */
  .viz{ position:absolute; inset:10%; border-radius:50%; pointer-events:none; }
  .viz i{
    position:absolute; left:50%; bottom:50%;
    width:2px; margin-left:-1px;
    height:50%;                                   /* ยาวเท่ารัศมีวง */
    transform-origin:50% 100%;                    /* หมุนรอบจุดศูนย์กลางวง */
    transform:rotate(calc(var(--i) * (360deg / var(--n))));
    pointer-events:none;
  }
  .viz i::before{
    content:""; position:absolute; left:0; top:0; width:100%;
    height:6px; border-radius:1px;
    background:linear-gradient(to bottom, rgba(45,212,191,.95), rgba(45,212,191,.05));
    animation:vizBar var(--dur,1s) ease-in-out infinite alternate;
    animation-delay:var(--d,0s);
    will-change:height, opacity;
  }
  .viz i:nth-child(4n)::before{ background:linear-gradient(to bottom, rgba(110,231,216,.9), rgba(110,231,216,.04)); }
  .viz i:nth-child(7n)::before{ background:linear-gradient(to bottom, rgba(245,166,35,.75), rgba(245,166,35,.04)); }
  @keyframes vizBar{
    0%{ height:5px; opacity:.45; }
    100%{ height:22px; opacity:1; }
  }
  .hud-ring{ position:absolute; border-radius:50%; will-change:transform; }
  .hud-ring.r1{

  .hud-ring.r2{

  }
  .hud-ring.r3{
    inset:30%;

  .hud-ticks{

    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px));

  }
  .hud-cross{ position:absolute; background:rgba(45,212,191,.28); }

  .hud-core{
    position:relative; width:31%; aspect-ratio:1; border-radius:50%;
    display:grid; place-items:center;
    background:radial-gradient(circle, rgba(45,212,191,.34), rgba(45,212,191,.07) 58%, transparent 72%);
    animation:hudPulse 3s ease-in-out infinite;
  }
  /* ---- อะตอม: นิวเคลียส + อิเล็กตรอนวิ่งเป็นวงรี 3 วง ---- */
  .atom{ position:absolute; inset:-46%; transform-style:preserve-3d; }
  .orbit{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(45,212,191,.30);
    transform:rotateX(72deg) rotateZ(0deg);
    transform-style:preserve-3d;
  }
  .orbit.o2{ transform:rotateX(72deg) rotateZ(60deg); border-color:rgba(245,166,35,.26); }
  .orbit.o3{ transform:rotateX(72deg) rotateZ(120deg); border-color:rgba(110,231,216,.24); }
  .orbit .spin{
    position:absolute; inset:0; border-radius:50%;
    animation:orbitSpin 7s linear infinite;
  }
  .orbit.o2 .spin{ animation-duration:9.5s; animation-direction:reverse; }
  .orbit.o3 .spin{ animation-duration:12s; }
  .orbit .e{
    position:absolute; left:50%; top:-3.5px; width:7px; height:7px; margin-left:-3.5px;
    border-radius:50%; background:#2DD4BF;
