<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpareCube</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpareCube">

<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
  :root{
    --bg:#14161A; --panel:#1B1E23; --panelAlt:#22262C; --border:#2C3139;
    --text:#ECEDEF; --muted:#878D97; --mutedFaint:#5B6068;
    --accent:#2DD4BF; --accentDim:#134E4A; --warn:#F5A623; --warnDim:#4A3413;
    --danger:#F0473E; --dangerDim:#4A1613; --machine:#3B82F6; --machineDim:#152A4A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Prompt',sans-serif;-webkit-font-smoothing:antialiased;}
  #bgParticles{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;}

  #doorLightBurst{
    position:fixed; inset:0; z-index:39; pointer-events:none;
    background:radial-gradient(circle at 50% 55%, rgba(160,255,240,0.55), rgba(45,212,191,0.18) 35%, transparent 65%);
    opacity:0; transform:scale(0.6);
  }
  #doorLightBurst.burst{ animation:doorBurst 1.1s ease-out forwards; }
  @keyframes doorBurst{
    0%{ opacity:0; transform:scale(0.5); }
    35%{ opacity:1; transform:scale(1.05); }
    100%{ opacity:0; transform:scale(1.6); }
  }

  #warehouseDoor{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    touch-action:none; cursor:grab;
    will-change:transform;
  }
  #warehouseDoor.dragging{ cursor:grabbing; }
  #warehouseDoor.snapping{ transition:transform .38s cubic-bezier(.34,1.2,.4,1); }
  #warehouseDoor.opening{ transition:transform .62s cubic-bezier(.5,0,.3,1); }
  .door-slats{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(45,212,191,0.05), transparent 30%),
      repeating-linear-gradient(180deg, #1E2229 0px, #1E2229 22px, #171A1F 22px, #171A1F 24px),
      #14161A;
    border-bottom:3px solid #2C3139;
  }
  .door-siren{
    position:absolute; left:0; right:0; height:6px; z-index:1;
    background:repeating-linear-gradient(90deg, #F5A623 0 22px, transparent 22px 44px);
    animation:doorSirenPulse 1.6s ease-in-out infinite;
  }
  .door-siren-top{ top:0; }
  .door-siren-bottom{ bottom:3px; }
  @keyframes doorSirenPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:.95; }
  }
  .door-handle-wrap{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    user-select:none; -webkit-user-select:none;
  }
  .door-handle{
    width:76px; height:44px; border-radius:10px;
    background:linear-gradient(180deg, #2C3139, #1B1E23);
    border:1px solid #3A4048;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    animation:doorHandleHint 1.8s ease-in-out infinite;
  }
  @keyframes doorHandleHint{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .door-hint{ color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.2px; }
  .door-hint-arrow{ color:var(--accent); font-size:16px; opacity:.8; animation:doorHandleHint 1.8s ease-in-out infinite; }
  #warehouseDoor.dragging .door-handle,
  #warehouseDoor.dragging .door-hint-arrow{ animation:none; }
  #warehouseDoor.hidden{ display:none; }
  @keyframes doorShake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    20%{ transform:translateX(-6px) rotate(-0.4deg); }
    40%{ transform:translateX(5px) rotate(0.4deg); }
    60%{ transform:translateX(-4px) rotate(-0.3deg); }
    80%{ transform:translateX(3px) rotate(0.2deg); }
  }
  #warehouseDoor.shake .door-slats{ animation:doorShake .45s ease-in-out; }
  #app{position:relative;z-index:1;}
  .head{font-family:'Prompt',sans-serif;}
  .mono{font-family:'Prompt',sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px;}
  .topbar{position:sticky;top:0;background:radial-gradient(ellipse at 8% 50%, rgba(45,212,191,0.18), transparent 60%), var(--bg);border-bottom:1px solid var(--border);z-index:20;}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:20px 24px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{border-radius:10px;box-shadow:0 0 14px #2DD4BF44;}
  .brand-icon-wrap{position:relative;display:inline-block;border-radius:10px;overflow:hidden;flex-shrink:0;animation:brandGlowPulse 3s ease-in-out infinite;}
  .brand-icon-wrap img{display:block;box-shadow:none !important;}
  .brand-icon-wrap::after{
    content:"";
    position:absolute; left:0; right:0; height:40%;
    background:linear-gradient(180deg, transparent, rgba(160,255,240,0.9), transparent);
    animation:brandScanSweep 2.8s ease-in-out infinite;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  @keyframes brandScanSweep{
    0%{ transform:translateY(-120%); opacity:0; }
    12%{ opacity:1; }
    50%{ transform:translateY(220%); opacity:1; }
    62%{ opacity:0; }
    100%{ transform:translateY(220%); opacity:0; }
  }
  @keyframes brandGlowPulse{
    0%,100%{ box-shadow:0 0 10px #2DD4BF44; }
    50%{ box-shadow:0 0 22px #2DD4BF99; }
  }
  .brand-title-cube{
    background:linear-gradient(90deg,#2DD4BF,#ECEDEF,#6EE7D8,#2DD4BF);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:brandShimmer 4.5s linear infinite;
  }
  @keyframes brandShimmer{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  @media (max-width:480px){
    .topbar-inner{padding:14px 14px 0;}
    .row{flex-wrap:wrap;row-gap:10px;}
    .brand img{width:34px !important;height:34px !important;border-radius:8px;}
    .brand-icon-wrap{border-radius:8px;}
    .brand .head{font-size:17px !important;}
    #btnAdd{padding:8px 10px;font-size:12px;white-space:nowrap;}
    .row > div:last-child{gap:8px !important;}
  }
  .btn{border:none;cursor:pointer;font-family:'Prompt',sans-serif;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
  .btn-accent{background:var(--accent);color:#0A0C0E;}
  .btn-ghost{background:var(--panelAlt);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--dangerDim);color:var(--danger);border:1px solid #F0473E44;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);}
  .tab{background:none;border:none;color:var(--muted);padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transform:scale(1);transform-origin:center;transition:color .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1), border-color .25s ease;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);transform:scale(1.1);}
  .badge{background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-family:'Prompt',sans-serif;}
  .content{padding-top:20px;}
  .view-enter{animation:viewEnter .34s cubic-bezier(.22,1,.36,1);}
  @keyframes viewEnter{
    from{ opacity:0; transform:translateX(18px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .stat .lbl{color:var(--muted);font-size:11px;}
  .stat .val{font-family:'Prompt',sans-serif;font-size:24px;margin-top:6px;}
  .section-title{font-family:'Prompt',sans-serif;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .card-list{display:flex;flex-direction:column;gap:8px;}
  .low-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--dangerDim);border:1px solid #F0473E44;border-radius:10px;}
  .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--panelAlt);}
  .thumb-ph{width:40px;height:40px;border-radius:8px;background:var(--panelAlt);display:flex;align-items:center;justify-content:center;color:var(--mutedFaint);flex-shrink:0;font-size:16px;}
  .grow{flex:1;min-width:0;}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search{position:relative;margin-bottom:16px;}
  .search input{width:100%;padding:10px 12px 10px 36px;}
  .search .icon{position:absolute;left:12px;top:11px;color:var(--mutedFaint);}
  input,textarea,select{background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Prompt',sans-serif;font-size:14px;outline:none;width:100%;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  label.field{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field-wrap{margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .parts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:600px){.parts-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.parts-grid{grid-template-columns:repeat(4,1fr);}}
  .part-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .part-photo{aspect-ratio:4/3;background:var(--panelAlt);position:relative;display:flex;align-items:center;justify-content:center;color:var(--mutedFaint);}
  .part-photo img{width:100%;height:100%;object-fit:cover;}
  .edit-btn{position:absolute;top:6px;right:6px;background:rgba(20,22,26,.75);border:none;border-radius:6px;padding:5px;cursor:pointer;color:var(--text);}
  .part-body{padding:12px;}
  .part-name{font-size:15px;font-weight:600;}
  .part-code{color:var(--mutedFaint);font-size:12px;font-family:'Prompt',sans-serif;margin-bottom:8px;}
  .machine-tag{color:var(--machine);font-size:11.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:4px;}
  .machine-select-row{display:flex;gap:8px;}
  .machine-select-row select{flex:1;}
  .machine-add-inline{margin-top:8px;display:flex;gap:8px;}
  .pill-group{display:flex;flex-wrap:wrap;gap:8px;}
  .pr-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  .pr-table{width:100%;border-collapse:collapse;min-width:820px;}
  .pr-table th{background:var(--panelAlt);color:var(--muted);font-size:11px;text-align:left;padding:8px;white-space:nowrap;font-weight:600;}
  .pr-table td{padding:6px 8px;border-top:1px solid var(--border);}
  .pr-table input{width:100%;background:var(--panelAlt);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;color:var(--text);box-sizing:border-box;}
  .pr-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .pr-attach-row{display:flex;align-items:center;gap:8px;background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
  .machine-add-inline input{flex:1;}
  .machine-add-inline button{white-space:nowrap;}
  .machine-group{border:1.5px solid var(--machine);border-radius:14px;padding:14px 14px 4px;margin-bottom:18px;background:#3B82F60A;}
  .machine-group.unassigned{border:1.5px dashed var(--border);background:transparent;}
  .machine-group-title{color:var(--machine);font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .machine-group.unassigned .machine-group-title{color:var(--mutedFaint);}
  .zoomable{cursor:zoom-in;touch-action:manipulation;}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(8,9,11,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:lightboxFadeIn .22s ease;}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;animation:lightboxPopIn .28s cubic-bezier(.22,1,.36,1);}
  .lightbox-close{position:absolute;top:16px;right:20px;background:rgba(20,22,26,.75);border:none;border-radius:8px;padding:8px 12px;color:var(--text);font-size:18px;cursor:pointer;}
  @keyframes lightboxFadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes lightboxPopIn{
    from{ opacity:0; transform:scale(.88); }
    to{ opacity:1; transform:scale(1); }
  }
  .gauge-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px;}
  .gauge-bar{background:var(--panelAlt);height:4px;border-radius:2px;overflow:hidden;}
  .gauge-fill{height:100%;transition:width .3s;}
  .withdraw-btn{width:100%;margin-top:10px;padding:8px 0;background:var(--panelAlt);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
  .withdraw-btn i{color:var(--accent);font-size:14px;}
  .btn i{font-size:14px;}
  .btn-accent i{color:#0A0C0E;}
  .empty{text-align:center;padding:40px 0;color:var(--mutedFaint);font-size:13px;}
  .hist-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
  .hist-icon{background:var(--panelAlt);border-radius:8px;padding:8px;display:flex;color:var(--accent);font-size:15px;}
  .overlay{position:fixed;inset:0;background:rgba(10,11,13,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.overlay{align-items:center;}}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
  @media(min-width:600px){.modal{border-radius:16px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
  .modal-body{padding:20px;}
  .close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}
  .photo-picker{width:120px;height:120px;border-radius:12px;background:var(--panelAlt);border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mutedFaint);cursor:pointer;margin:0 auto 16px;overflow:hidden;}
  .photo-picker img{width:100%;height:100%;object-fit:cover;}
  .err-text{color:var(--danger);font-size:12px;margin-bottom:12px;}
  .notice{padding:14px;background:var(--warnDim);border:1px solid #F5A62344;border-radius:10px;margin-bottom:20px;font-size:12.5px;color:#F0D3A0;line-height:1.6;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  a{color:var(--accent);}
  .login-screen{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(45,212,191,0.13), transparent 55%),
      radial-gradient(circle at 90% 85%, rgba(124,58,237,0.08), transparent 50%),
      repeating-linear-gradient(0deg, rgba(45,212,191,0.05) 0, rgba(45,212,191,0.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(45,212,191,0.05) 0, rgba(45,212,191,0.05) 1px, transparent 1px, transparent 42px),
      radial-gradient(rgba(45,212,191,0.16) 1px, transparent 1.2px) 0 0/26px 26px;
  }
</style>
</head>

<canvas id="bgParticles"></canvas>

<div id="doorLightBurst"></div>
<div id="warehouseDoor">
  <div class="door-siren door-siren-top"></div>
  <div class="door-slats"></div>
  <div class="door-handle-wrap">
    <div class="door-handle" id="doorHandle">
      <i class="ti ti-grip-horizontal" aria-hidden="true"></i>
    </div>
    <div class="door-hint">ลากขึ้นเพื่อเข้าใช้งาน</div>
    <i class="ti ti-chevron-up door-hint-arrow" aria-hidden="true"></i>
  </div>
  <div class="door-siren door-siren-bottom"></div>
</div>

<div id="app">
  <div class="wrap" style="padding-top:80px;text-align:center;color:var(--mutedFaint);">กำลังโหลด...</div>
</div>

/* ---------------- helpers ---------------- */
function getPartZones(p){
  if (!p) return [];
  if (Array.isArray(p.zones)) return p.zones;
  if (p.zone) return [p.zone];
  return [];
}

function esc(s){ return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function gaugeColor(qty, min){
  if (qty <= min) return "var(--danger)";
  if (qty <= min * 1.3) return "var(--warn)";
  return "var(--accent)";
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("อ่านไฟล์รูปไม่สำเร็จ"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("โหลดรูปไม่สำเร็จ"));
      img.onload = () => {
        const maxW = 360;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.5));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 2600);
}

async function ensureMachine(name){
  const existing = machines.find(m => m.name.trim().toLowerCase() === name.trim().toLowerCase());
  if (existing) return existing.name;
  try {
    await addDoc(collection(db, "machines"), { name: name.trim(), createdAt: serverTimestamp() });
  } catch (e) {
    showToast("บันทึกเครื่องจักรใหม่ไม่สำเร็จ: " + e.message);
  }
  return name.trim();
}

async function savePart(data){
  saving = true; render();
  try {
    const { id, ...rest } = data;
    if (id) {
      await updateDoc(doc(db, "parts", id), rest);
    } else {
      await addDoc(collection(db, "parts"), { ...rest, createdAt: serverTimestamp() });
    }
    addOpen = false; editPart = null;
  } catch (e) {
    showToast("บันทึกไม่สำเร็จ: " + e.message);
  } finally {
    saving = false; render();
  }
}

async function addMachine(name){
  const trimmed = name.trim();
  if (!trimmed) return;
  if (machines.find(m => m.name.trim().toLowerCase() === trimmed.toLowerCase())) {
    showToast("มีชื่อเครื่องจักรนี้อยู่แล้ว"); return;
  }
  try {
    await addDoc(collection(db, "machines"), { name: trimmed, createdAt: serverTimestamp() });
  } catch (e) {
    showToast("เพิ่มเครื่องจักรไม่สำเร็จ: " + e.message);
  }
}

async function renameMachine(id, oldName, newName){
  const trimmed = newName.trim();
  if (!trimmed) { showToast("กรุณากรอกชื่อเครื่องจักร"); return; }
  if (trimmed === oldName) { editingMachineId = null; render(); return; }
  if (machines.find(m => m.id !== id && m.name.trim().toLowerCase() === trimmed.toLowerCase())) {
    showToast("มีชื่อเครื่องจักรนี้อยู่แล้ว"); return;
  }
  savingMachine = true; render();
  try {
    await updateDoc(doc(db, "machines", id), { name: trimmed });
    const affected = parts.filter(p => p.machine === oldName);
    await Promise.all(affected.map(p => updateDoc(doc(db, "parts", p.id), { machine: trimmed })));
    editingMachineId = null;
  } catch (e) {
    showToast("แก้ไขชื่อเครื่องจักรไม่สำเร็จ: " + e.message);
  } finally {
    savingMachine = false; render();
  }
}

function syncPRFormFromDOM(){
  const g = id => document.getElementById(id);
  const set = (key, id) => { const el = g(id); if (el) prForm[key] = el.value; };
  set("department", "prDepartment");
  set("prNumber", "prNumber");
  set("po", "prPO");
  set("poDate", "prPODate");
  set("jobName", "prJobName");
  set("jobOwner", "prJobOwner");
  set("reason", "prReason");
  set("jobTypeProjectName", "prJobTypeProjectName");
  set("categoryIoNumber", "prCategoryIoNumber");
  set("cca", "prCCA");
  set("gl", "prGL");
  set("vendor", "prVendor");
  set("receiveDate", "prReceiveDate");

  prRows.forEach(row => {
    const matEl = g(`prRow_${row.id}_matcode`); if (matEl) row.matCode = matEl.value;
    const descEl = g(`prRow_${row.id}_desc`); if (descEl) row.desc = descEl.value;
    const qtyEl = g(`prRow_${row.id}_qty`); if (qtyEl) row.qty = qtyEl.value;

    const priceEl = g(`prRow_${row.id}_price`); if (priceEl) row.price = priceEl.value;
  });
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

async function uploadFileToDrive(file, folderName){
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("วางลิงก์")) {
    throw new Error("ยังไม่ได้ตั้งค่า Google Apps Script (APPS_SCRIPT_URL) ในโค้ด");
  }
  const base64 = await fileToBase64(file);
  const resp = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
    body: JSON.stringify({
      action: "upload",
      folder: folderName,
      filename: file.name,
      mimeType: file.type || "application/octet-stream",
      data: base64,
    }),
  });
  const json = await resp.json();
  if (!json.success) throw new Error(json.error || "อัปโหลดไฟล์ไม่สำเร็จ");
  return json.file; // {id, name, url, previewUrl, mimeType}
}

async function submitPR(){
  syncPRFormFromDOM();
  const errEl = document.getElementById("prFormErr");
  const hideErr = () => { if (errEl) errEl.style.display = "none"; };
  const showErr = (msg) => { if (errEl) { errEl.textContent = msg; errEl.style.display = "block"; } };

  if (!prForm.department.trim() || !prForm.prNumber.trim() || !prForm.jobName.trim()) {
    showErr("กรุณากรอกหน่วยงาน, เลขที่ PR และชื่องานให้ครบ");
    return;
  }
  const cleanRows = prRows.filter(r => (r.desc||"").trim() || (r.matCode||"").trim());
  if (cleanRows.length === 0) {
    showErr("กรุณากรอกรายการสินค้าอย่างน้อย 1 รายการ");
    return;
  }
  hideErr();

  prSaving = true; render();
  try {
    const attachments = [];
    for (const file of prPendingFiles) {
      const uploaded = await uploadFileToDrive(file, currentName || "unknown");
      attachments.push(uploaded);
    }
    await addDoc(collection(db, "pr_requests"), {
      ...prForm,
      rows: cleanRows,
      totalAmount: cleanRows.reduce((s, r) => s + prRowAmount(r), 0),
      attachments,
      submittedBy: currentName,
      status: "pending",
      createdAt: serverTimestamp(),
    });
    resetPRForm();
    showToast("ส่ง PR สำเร็จ");
  } catch (e) {
    showErr("ส่ง PR ไม่สำเร็จ: " + e.message);
  } finally {
    prSaving = false; render();
  }
}

async function deletePRAttachment(prId, fileId){
  try {
    if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("วางลิงก์")) {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "delete", fileId }),
      });
    }
    const pr = prRequests.find(p => p.id === prId);
    if (pr) {
      const nextAttachments = (pr.attachments || []).filter(a => a.id !== fileId);
      await updateDoc(doc(db, "pr_requests", prId), { attachments: nextAttachments });
    }
    showToast("ลบไฟล์แล้ว");
  } catch (e) {
    showToast("ลบไฟล์ไม่สำเร็จ: " + e.message);
  }
}

async function deletePRRequest(prId){
  try {
    const pr = prRequests.find(p => p.id === prId);
    if (pr && APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("วางลิงก์")) {
      for (const att of (pr.attachments || [])) {
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "delete", fileId: att.id }),
          });
        } catch (_) { /* best-effort */ }
      }
    }
    await deleteDoc(doc(db, "pr_requests", prId));
    showToast("ลบใบ PR แล้ว");
  } catch (e) {
    showToast("ลบใบ PR ไม่สำเร็จ: " + e.message);
  }
}

function exportHistoryExcel(fromStr, toStr){
  if (typeof XLSX === "undefined") { showToast("โหลดตัวช่วยสร้าง Excel ไม่สำเร็จ ลองเช็คอินเทอร์เน็ต"); return; }
  let rows = history;
  if (fromStr || toStr) {
    const start = fromStr ? new Date(fromStr + "T00:00:00") : null;
    const end = toStr ? new Date(toStr + "T23:59:59") : new Date(fromStr + "T23:59:59");
    rows = history.filter(h => {
      if (!h.timestamp) return false;
      const d = h.timestamp.toDate ? h.timestamp.toDate() : new Date(h.timestamp);
      if (start && d < start) return false;
      if (end && d > end) return false;
      return true;
    });
  }
  if (rows.length === 0) { showToast("ไม่พบข้อมูลในช่วงที่เลือก"); return; }
  const data = rows.slice().reverse().map(h => ({
    "วันที่เวลา": fmtDate(h.timestamp),
    "ชื่ออะไหล่": h.partName || "",
    "รหัสอะไหล่": h.partCode || "",
    "จำนวนที่เบิก": h.qtyWithdrawn ?? "",
    "เครื่องที่ใช้": h.machine || "",
    "ผู้เบิก": h.by || "",
    "หมายเหตุ": h.note || "",
    "คงเหลือหลังเบิก": h.qtyAfter ?? ""
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:18},{wch:22},{wch:12},{wch:12},{wch:22},{wch:18},{wch:20},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "ประวัติการเบิก");
  const label = (fromStr && toStr && fromStr !== toStr) ? `${fromStr}_ถึง_${toStr}` : (fromStr || "ทั้งหมด");
  XLSX.writeFile(wb, `ประวัติการเบิก_${label}.xlsx`);
}

async function withdraw(part, qty, machine, by, note){
  saving = true; render();
  try {
    await runTransaction(db, async (tx) => {
      const ref_ = doc(db, "parts", part.id);
      const snap = await tx.get(ref_);
      if (!snap.exists()) throw new Error("ไม่พบอะไหล่นี้แล้ว");
      const current = snap.data().qty;
      if (qty > current) throw new Error("คลังเหลือแค่ " + current + " " + snap.data().unit);
      const qtyAfter = current - qty;
      tx.update(ref_, { qty: qtyAfter });
      const histRef = doc(collection(db, "history"));
      tx.set(histRef, {
        partId: part.id, partName: part.name, partCode: part.code,
        qtyWithdrawn: qty, qtyAfter, machine, by, note,
        timestamp: serverTimestamp()
      });
    });
    withdrawPart = null;
  } catch (e) {
    showToast("เบิกไม่สำเร็จ: " + e.message);
  } finally {
    saving = false; render();
  }
}

function fmtDate(ts){
  if (!ts) return "-";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("th-TH") + " " + d.toLocaleTimeString("th-TH", { hour:"2-digit", minute:"2-digit" });
}

function tabBtn(key, label, count){

}

function lowStockCardHtml(p){
  return `
    <div class="low-card">
      ${p.photo ? `<img class="thumb zoomable" src="${p.photo}">` : `<div class="thumb-ph">📦</div>`}
      <div class="grow">
        <div class="truncate" style="font-size:13px;font-weight:600;">${esc(p.name)}</div>
        <div class="mono" style="color:var(--muted);font-size:11px;">${esc(p.code)}</div>

      </div>
      <div class="mono" style="color:var(--danger);font-size:18px;">${p.qty}<span style="color:var(--mutedFaint);font-size:11px;"> /${p.min}</span></div>

    </div>

function renderDashboard(low, todayCount){
  // group low-stock items by zone, same convention as the history page:
  // an "all zones" part appears under every zone currently in use; items with no zone go under "unassigned".
  const allKnownZones = [...new Set(parts.flatMap(p => getPartZones(p)).filter(z => z && z !== "__all__"))];
  const zoneGroups = new Map();
  low.forEach(p => {
    const pz = getPartZones(p);
    let targetZones = pz.includes("__all__") ? allKnownZones : pz;
    if (!targetZones || targetZones.length === 0) targetZones = ["__unassigned__"];
    targetZones.forEach(key => {
      if (!zoneGroups.has(key)) zoneGroups.set(key, []);
      zoneGroups.get(key).push(p);
    });
  });
  const zoneKeys = [...zoneGroups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (zoneGroups.has("__unassigned__")) zoneKeys.push("__unassigned__");

  return `
    <div class="stats">
      <div class="stat"><div class="lbl">รายการทั้งหมด</div><div class="val">${parts.length}</div></div>
      <div class="stat"><div class="lbl">ต่ำกว่า min</div><div class="val" style="color:${low.length?'var(--danger)':'var(--accent)'}">${low.length}</div></div>
      <div class="stat"><div class="lbl">เบิกวันนี้</div><div class="val">${todayCount}</div></div>
    </div>
    ${low.length > 0 ? `
    <div class="section-title"><i class="ti ti-bell-exclamation" style="color:var(--danger);" aria-hidden="true"></i> ต้องสั่งซื้อเพิ่ม</div>
    ${zoneKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const items = zoneGroups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ยังไม่ระบุโซน" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${items.length})</span></div>
        <div class="card-list" style="margin-bottom:10px;">
          ${items.map(lowStockCardHtml).join("")}
        </div>
      </div>`;
    }).join("")}
    ` : ""}
    <div class="section-title">เบิกล่าสุด</div>
    ${history.length === 0 ? `<div class="empty">ยังไม่มีการเบิกอะไหล่</div>` :
      `<div class="card-list">${history.slice(0,5).map(histRow).join("")}</div>`}
  `;
}

function partCardHtml(p){
  const denom = (p.max && p.max > 0) ? Math.max(p.max, p.qty, 1) : Math.max(p.min * 2, p.qty, 1);
  const pct = Math.max(4, Math.min(100, (p.qty / denom) * 100));
  const color = gaugeColor(p.qty, p.min);
  return `
    <div class="part-card">
      <div class="part-photo">
        ${p.photo ? `<img class="zoomable" src="${p.photo}">` : "📦"}
        ${currentRole === "admin" ? `<button class="edit-btn" data-edit="${p.id}">✎</button>` : ""}
      </div>
      <div class="part-body">
        <div class="part-name truncate">${esc(p.name)}</div>
        <div class="part-code">${esc(p.code)} · ${esc(p.unit)}${(() => { const z=getPartZones(p); if(!z.length) return ""; const label = z.includes("__all__") ? "ทุกโซน" : z.join(", "); return ` · <span style="color:var(--accent);">${esc(label)}</span>`; })()}</div>
        <div class="gauge-top">
          <span class="mono" style="color:${color};font-size:32px;font-weight:600;line-height:1;">${p.qty}</span>
          <span class="mono" style="color:var(--mutedFaint);font-size:12px;">min ${p.min}</span>
        </div>
        <div class="gauge-bar"><div class="gauge-fill" style="width:${pct}%;background:${color};"></div></div>
        <button class="withdraw-btn" data-withdraw="${p.id}"><i class="ti ti-transfer-out" aria-hidden="true"></i> เบิกใช้</button>
      </div>
    </div>`;
}

function renderInventory(){
  const allZones = [...new Set(parts.flatMap(p => getPartZones(p)).filter(z => z && z !== "__all__"))].sort((a,b) => a.localeCompare(b, "th"));
  const filtered = parts.filter(p => {
    const pz = getPartZones(p);
    const matchesSearch = (p.name + p.code + (p.machine||"") + pz.join(" ")).toLowerCase().includes(search.toLowerCase());
    const matchesZone = !zoneFilter || pz.includes(zoneFilter) || pz.includes("__all__");
    return matchesSearch && matchesZone;
  });
  const zoneFilterHtml = `
    <div style="margin-bottom:12px;">
      <select id="zoneFilterSelect">
        <option value="">ทุกโซน</option>
        ${allZones.map(z => `<option value="${esc(z)}" ${zoneFilter===z?"selected":""}>${esc(z)}</option>`).join("")}
      </select>
    </div>`;
  if (filtered.length === 0) {
    return `
      <div class="search">
        <span class="icon">🔍</span>
        <input id="searchInput" placeholder="ค้นหาชื่อ รหัส หรือเครื่องจักร" value="${esc(search)}">
      </div>
      ${zoneFilterHtml}
      <div class="empty">ไม่พบอะไหล่ ลองเพิ่มรายการใหม่</div>
    `;
  }

  // group by machine name; parts without a machine go into "unassigned"
  const groups = new Map();
  filtered.forEach(p => {
    const key = p.machine && p.machine.trim() ? p.machine.trim() : "__unassigned__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  const machineKeys = [...groups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (groups.has("__unassigned__")) machineKeys.push("__unassigned__");

  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input id="searchInput" placeholder="ค้นหาชื่อ รหัส หรือเครื่องจักร" value="${esc(search)}">
    </div>
    ${zoneFilterHtml}
    ${machineKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const groupParts = groups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ยังไม่ระบุเครื่องจักร" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${groupParts.length})</span></div>
        <div class="parts-grid" style="margin-bottom:10px;">
          ${groupParts.map(partCardHtml).join("")}
        </div>
      </div>`;
    }).join("")}
  `;
}

function histRow(h){
  const part = parts.find(p => p.id === h.partId);
  const photo = part ? part.photo : null;
  return `
    <div class="hist-row">
      ${photo ? `<img class="thumb zoomable" src="${photo}">` : `<div class="hist-icon"><i class="ti ti-transfer-out" aria-hidden="true"></i></div>`}
      <div class="grow">
        <div class="truncate" style="font-size:13px;"><b>${esc(h.partName)}</b> <span style="color:var(--muted);">· เครื่อง ${esc(h.machine||"-")}</span></div>
        <div style="color:var(--mutedFaint);font-size:11px;">${h.by ? "โดย "+esc(h.by)+" · " : ""}${fmtDate(h.timestamp)}</div>
      </div>
      <div class="mono" style="color:var(--danger);font-size:14px;">-${h.qtyWithdrawn}</div>
      ${currentRole === "admin" ? `<button data-del-hist="${h.id}" title="ลบประวัตินี้" style="background:none;border:none;color:var(--mutedFaint);cursor:pointer;padding:4px;flex-shrink:0;"><i class="ti ti-trash" aria-hidden="true"></i></button>` : ""}
    </div>
  `;
}

function renderHistory(){
  const filtered = history.filter(h => ((h.partName||"")+(h.machine||"")+(h.by||"")).toLowerCase().includes(search.toLowerCase()));
  if (filtered.length === 0) {
    return `
      <div class="search">
        <span class="icon">🔍</span>
        <input id="searchInput" placeholder="ค้นหาตามอะไหล่ เครื่อง หรือผู้เบิก" value="${esc(search)}">
      </div>
      <div class="empty">ไม่พบประวัติ</div>
    `;
  }

  // group by the zone(s) of the related part; entries whose part has no zone (or part was deleted) go into "unassigned".
  // a part marked "all zones" appears under every zone currently in use; a part with several zones appears in each of them.
  const allKnownZones = [...new Set(parts.flatMap(p => getPartZones(p)).filter(z => z && z !== "__all__"))];
  const groups = new Map();
  filtered.forEach(h => {
    const part = parts.find(p => p.id === h.partId);
    const pz = getPartZones(part);
    let targetZones = pz.includes("__all__") ? allKnownZones : pz;
    if (!targetZones || targetZones.length === 0) targetZones = ["__unassigned__"];
    targetZones.forEach(key => {
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(h);
    });
  });
  const zoneKeys = [...groups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (groups.has("__unassigned__")) zoneKeys.push("__unassigned__");

  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input id="searchInput" placeholder="ค้นหาตามอะไหล่ เครื่อง หรือผู้เบิก" value="${esc(search)}">
    </div>
    ${zoneKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const groupItems = groups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ยังไม่ระบุโซน" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${groupItems.length})</span></div>
        <div class="card-list" style="margin-bottom:10px;">
          ${groupItems.map(histRow).join("")}
        </div>
      </div>`;
    }).join("")}
  `;
}

function pillGroupHtml(options, selectedValue, dataAttr){
  return `<div class="pill-group">${options.map(opt => {

}

function prRowAmount(row){ return (parseFloat(row.qty)||0) * (parseFloat(row.price)||0); }
function prFormatMoney(n){ return n.toLocaleString("th-TH", {minimumFractionDigits:2, maximumFractionDigits:2}); }

function prStatusBadgeHtml(pr){
  const status = pr.status || "pending";
  if (status === "approved") {
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:#134E4A;color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;"><i class="ti ti-circle-check" aria-hidden="true"></i> อนุมัติแล้ว</span>`;
  }
  if (status === "rejected") {

function renderPRList(){
  const q = prSearch.toLowerCase();
  const filtered = prRequests.filter(pr =>
    ((pr.prNumber||"")+(pr.jobName||"")+(pr.department||"")+(pr.submittedBy||"")+(pr.vendor||"")).toLowerCase().includes(q)
  );
  if (filtered.length === 0) {
    return `
      <div class="search">
        <span class="icon">🔍</span>
        <input id="prSearchInput" placeholder="ค้นหาเลขที่ PR ชื่องาน หน่วยงาน หรือผู้กรอก" value="${esc(prSearch)}">
      </div>
      <div class="empty">ยังไม่มีใบ PR</div>
    `;
  }

  // group by the submitting user, so each person's items stay separated instead of mixed together
  const groups = new Map();
  filtered.forEach(pr => {
    const key = pr.submittedBy && pr.submittedBy.trim() ? pr.submittedBy.trim() : "__unassigned__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(pr);
  });
  const userKeys = [...groups.keys()].filter(k => k !== "__unassigned__").sort((a,b) => a.localeCompare(b, "th"));
  if (groups.has("__unassigned__")) userKeys.push("__unassigned__");

  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input id="prSearchInput" placeholder="ค้นหาเลขที่ PR ชื่องาน หน่วยงาน หรือผู้กรอก" value="${esc(prSearch)}">
    </div>
    ${userKeys.map(key => {
      const isUnassigned = key === "__unassigned__";
      const items = groups.get(key);
      return `
      <div class="machine-group ${isUnassigned?"unassigned":""}">
        <div class="machine-group-title">${isUnassigned ? "ไม่ระบุผู้กรอก" : esc(key)} <span class="mono" style="color:var(--mutedFaint);font-weight:500;font-size:11px;">(${items.length})</span></div>
        ${items.map(prCardHtml).join("")}
      </div>`;
    }).join("")}
  `;
}

/* ---------------- persistent app-wide background animation ---------------- */
function initBgParticles(){
  const canvas = document.getElementById("bgParticles");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function spawnNodes(){
    const isSmall = W < 480;
    const count = isSmall ? 30 : 60;
    const arr = [];
    for (let i = 0; i < count; i++){
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        size: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.007,
      });
    }
    return arr;
  }
  let nodes = spawnNodes();
  window.addEventListener("resize", () => { nodes = spawnNodes(); });

  const mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener("mouseleave", () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener("touchmove", (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true;
  }, { passive: true });

  const LINK_DIST = 135;
  const MOUSE_DIST = 150;
  // colors oscillate slowly and continuously between teal and purple ("หลบไปมา")
  const TEAL = [45, 212, 191];
  const PURPLE = [124, 58, 237];
  const LIGHT_TEAL = [110, 231, 216];
  const LIGHT_PURPLE = [192, 160, 250];

  function mixColor(c1, c2, t){
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t),
    ];
  }

  function frame(t){
    ctx.clearRect(0, 0, W, H);

    const cyclePos = (Math.sin(t * 0.00012) + 1) / 2; // 0..1, ~8.7s half-cycle
    const linkColor = mixColor(TEAL, PURPLE, cyclePos);
    const nodeColor = mixColor(LIGHT_TEAL, LIGHT_PURPLE, cyclePos);
    const mouseLinkColor = mixColor(LIGHT_TEAL, LIGHT_PURPLE, cyclePos);

    for (const n of nodes){
      n.x += n.vx; n.y += n.vy;
      n.rot += n.rotSpeed;
      if (n.x < -10) n.x = W + 10; else if (n.x > W + 10) n.x = -10;
      if (n.y < -10) n.y = H + 10; else if (n.y > H + 10) n.y = -10;

      if (mouse.active){
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < MOUSE_DIST && dist > 0.01){
          const f = (1 - dist / MOUSE_DIST) * 0.55;
          n.x += (dx / dist) * f;
          n.y += (dy / dist) * f;
        }
      }
    }

    for (let i = 0; i < nodes.length; i++){
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++){
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < LINK_DIST){
          const op = (1 - dist / LINK_DIST) * 0.16;
          ctx.strokeStyle = `rgba(${linkColor[0]},${linkColor[1]},${linkColor[2]},${op})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
      if (mouse.active){
        const dx = a.x - mouse.x, dy = a.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < MOUSE_DIST){
          const op = (1 - dist / MOUSE_DIST) * 0.3;
          ctx.strokeStyle = `rgba(${mouseLinkColor[0]},${mouseLinkColor[1]},${mouseLinkColor[2]},${op})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }
    }

    for (const n of nodes){
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(n.rot);
      ctx.fillStyle = `rgba(${nodeColor[0]},${nodeColor[1]},${nodeColor[2]},0.45)`;
      ctx.fillRect(-n.size / 2, -n.size / 2, n.size, n.size);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------------- login events ---------------- */
function bindLoginEvents(){
  document.getElementById("roleUser")?.addEventListener("click", () => {
    loginShowPin = false; loginShowApprovePass = false;
    attemptLogin("user");
  });
  document.getElementById("roleAdmin")?.addEventListener("click", () => {
    const nameEl = document.getElementById("loginName");
    if (nameEl) currentName = nameEl.value; // keep typed name before re-render shows the pin field
    loginShowPin = true; loginShowApprovePass = false; loginErr="";
    render();
    document.getElementById("loginPin")?.focus();
  });
  document.getElementById("roleApprove")?.addEventListener("click", () => {
    const nameEl = document.getElementById("loginName");
    if (nameEl) currentName = nameEl.value;
    loginShowApprovePass = true; loginShowPin = false; loginErr="";
    render();
    document.getElementById("loginApprovePassword")?.focus();
  });
  document.getElementById("btnLogin")?.addEventListener("click", () => {
    const role = loginShowApprovePass ? "approve" : (loginShowPin ? "admin" : "user");
    attemptLogin(role);
  });
  document.getElementById("loginPin")?.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin("admin"); });
  document.getElementById("loginApprovePassword")?.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin("approve"); });
  document.getElementById("loginName")?.addEventListener("keydown", (e) => { if (e.key === "Enter" && !loginShowPin && !loginShowApprovePass) attemptLogin("user"); });
}

function attemptLogin(role){
  const nameEl = document.getElementById("loginName");
  const name = nameEl ? nameEl.value.trim() : currentName;
  if (nameEl) currentName = nameEl.value; // preserve whatever was typed across re-renders
  if (!name) { loginErr = "กรุณากรอกชื่อของคุณ"; render(); document.getElementById("loginName")?.focus(); return; }
  if (role === "admin") {
    const pin = document.getElementById("loginPin")?.value || "";
    if (pin !== ADMIN_PIN) { loginErr = "รหัสผ่าน Admin ไม่ถูกต้อง"; loginShowPin = true; render(); return; }
  }
  if (role === "approve") {
    const pass = document.getElementById("loginApprovePassword")?.value || "";
    if (name.toLowerCase() !== APPROVER_USERNAME.toLowerCase() || pass !== APPROVER_PASSWORD) {
      loginErr = "ชื่อผู้ใช้หรือรหัสผ่าน Approve ไม่ถูกต้อง";
      loginShowApprovePass = true; render(); return;
    }
  }
  currentName = (role === "approve") ? APPROVER_USERNAME : name;
  currentRole = role; loginErr = "";
  localStorage.setItem("wk_name", currentName);
  localStorage.setItem("wk_role", role);
  render();
}

/* ---------------- roll-up warehouse door entrance ---------------- */
function initWarehouseDoor(){
  const door = document.getElementById("warehouseDoor");
  const burst = document.getElementById("doorLightBurst");
  if (!door) return;

  let dragging = false;
  let startY = 0;
  let currentDelta = 0;
  let opened = false;

  function openThreshold(){ return Math.min(window.innerHeight * 0.28, 220); }

  function onPointerDown(e){
    if (opened) return;
    dragging = true;
    startY = e.clientY;
    door.classList.remove("snapping", "opening");
    door.classList.add("dragging");
  }

  function onPointerMove(e){
    if (!dragging || opened) return;
    const rawDelta = startY - e.clientY;
    currentDelta = Math.max(0, Math.min(rawDelta, window.innerHeight));
    door.style.transform = `translateY(-${currentDelta}px)`;
  }

  function onPointerUp(){
    if (!dragging || opened) return;
    dragging = false;
    door.classList.remove("dragging");

    if (currentDelta > openThreshold()) {
      completeOpen();
    } else if (currentDelta > 4) {
      snapClosed();
    } else {
      door.classList.add("shake");
      setTimeout(() => door.classList.remove("shake"), 480);
    }
    currentDelta = 0;
  }

  function snapClosed(){
    door.classList.add("snapping");
    door.style.transform = "translateY(0)";
  }

  function completeOpen(){
    opened = true;
    door.classList.add("opening");
    door.style.transform = "translateY(-115%)";
    if (burst) burst.classList.add("burst");
    setTimeout(() => { door.classList.add("hidden"); }, 680);
  }

  door.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);
}

render();
initBgParticles();
